schema: spec-driven
context: |
  Authorized repository Togarriapa/HermesAgent_Installer only.
  Read CURRENT-PLAN.md and requirements/current-scope.json; sole active change jarvis-core-platform.
  GPT-6.1 Sol owns specification/tasks/refinement; GPT-6 Luna implements.
  Official headless core -> individual ports -> responsive Jarvis -> full Resources -> review -> finished docs.
  Raspberry Pi5 nominal16GB/1TB, Linux ARM64, actual hardware detected; Coral USB/PCIe qualified independently.
  Preserve HOME/auth/memory/data/PM/Resources/shared tunnels/unrelated services and recovery copies.
  Desktop/Xpra is excluded from active installation; owned cleanup waits for private+public core/security/restart proof.
  Official Hermes PM Python3.14, isolated installer/components, browser sandbox/TLS preserved.
  Zero additional metered spending; private/public eligibility mediated across all dispatch/retry/background boundaries.
  One automatic memory owner; profiles are not process/filesystem sandboxes.
  Required GLM-5.2; no replacement model/huge download; Coral proof requires delegate-used TPU inference.
  Finite authenticated Jarvis adapters, no public raw RPC/shell/backend management/arbitrary URL/file proxies.
  Preserve Cloudflare OTP/binding/JWT-before-bytes, protected secret refs and setup-only management token.
  Original JWT/600s/stricter turn ceiling; distinct <=30s fresh leases, <=5s witness and <=4s SSE segments.
  Complete Bots groups/relay,208 Resources source identities and all component aliases/AC01..18 remain scope.
  HA live configuration deferred. No new spend/reimage/format/unrelated takeover/outbound test messages.
  Tests/fixtures/previews/servers/npm/npx/validators run only on identified Pi via root browser.
  Local source/spec reading/editing and Git allowed. Runtime acceptance distinct from code/source/fixture evidence.
rules:
  proposal:
    - Preserve every current-scope requirement, component alias and acceptance criterion.
  specs:
    - Use SHALL/MUST with observable WHEN/THEN success/denial/recovery scenarios.
    - Keep unavailable dependency/account/hardware states explicit; no source-only acceptance.
  design:
    - Explain actual policy boundary, ownership, failure containment and recovery.
  tasks:
    - Link current requirement IDs; distinguish implementation and live acceptance; keep unfinished tasks OPEN.
