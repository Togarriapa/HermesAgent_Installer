apiVersion: hermes.togarriapa/v1
kind: MCP
metadata:
  name: filesystem
  version: 1.0.1
  description: Pinned official filesystem MCP server scoped to the explicitly assigned Hermes workspace root.
  tags: [mcp, filesystem, workspace, official]
spec:
  transport: stdio
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-filesystem@2026.7.10"
    - ${HERMES_WORKSPACE}
  environment:
    HERMES_WORKSPACE: ${HERMES_WORKSPACE}
  capabilities:
    - read-files-under-assigned-workspace
    - write-files-under-assigned-workspace-when-task-authorized
    - list-search-move-and-metadata-under-assigned-workspace
  roots:
    - ${HERMES_WORKSPACE}
  policy:
    scope: workspace-only
    allowAdditionalRoots: false
    pathEscape: deny
    credentials: none
    writes: task-authorized-workspace-only
    destructiveOutsideWorkspace: deny
    authorityFromMcpConnection: deny
  provenance:
    provider: Model Context Protocol project
    repository: modelcontextprotocol/servers
    package: "@modelcontextprotocol/server-filesystem"
    version: "2026.7.10"
    official: true
