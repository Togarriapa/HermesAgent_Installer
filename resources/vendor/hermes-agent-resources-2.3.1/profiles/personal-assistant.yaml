apiVersion: hermes.togarriapa/v1
kind: Profile
metadata:
  name: personal-assistant
  version: 1.1.1
  description: Personal assistant for scheduling, task follow-through, correspondence support, meeting preparation, travel logistics, and organized information management.
  tags: [assistant, productivity, scheduling, organization]
spec:
  extends: base@^1.1.0
  requires:
    skills:
      - calendar-planning@^1.0.0
      - task-follow-through@^1.0.0
      - correspondence-support@^1.0.0
      - meeting-preparation@^1.0.0
      - travel-logistics@^1.0.0
      - information-organization@^1.0.0
    plugins:
      - web@^1.0.0
      - composio@^1.0.0
  integrationPolicy:
    composio:
      toolkits:
        - slug: googlecalendar
          version: "20260721_00"
          allowedTools:
            - GOOGLECALENDAR_EVENTS_LIST_ALL_CALENDARS
            - GOOGLECALENDAR_FIND_EVENT
            - GOOGLECALENDAR_FIND_FREE_SLOTS
            - GOOGLECALENDAR_CREATE_EVENT
            - GOOGLECALENDAR_UPDATE_EVENT
        - slug: gmail
          version: "20260721_00"
          allowedTools:
            - GMAIL_FETCH_EMAILS
            - GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID
            - GMAIL_FETCH_MESSAGE_BY_THREAD_ID
            - GMAIL_CREATE_EMAIL_DRAFT
            - GMAIL_UPDATE_DRAFT
        - slug: googledrive
          version: "20260721_00"
          allowedTools:
            - GOOGLEDRIVE_FIND_FILE
            - GOOGLEDRIVE_FIND_FOLDER
            - GOOGLEDRIVE_GET_FILE_METADATA
            - GOOGLEDRIVE_DOWNLOAD_FILE
        - slug: googletasks
          version: "20260721_00"
          allowedTools:
            - GOOGLETASKS_LIST_TASK_LISTS
            - GOOGLETASKS_LIST_TASKS
            - GOOGLETASKS_INSERT_TASK
            - GOOGLETASKS_PATCH_TASK
      emailSend: deny
      calendarDelete: deny
      taskDelete: deny
      writes: delegated-only
  instructions:
    - Convert requests and commitments into explicit tasks, dates, dependencies, and follow-ups.
    - Preserve the user's voice and intent in correspondence while clearly separating drafts from messages that have actually been sent.
    - Check current details for travel, venues, schedules, rules, or other time-sensitive logistics before relying on them.
    - Use account integrations only for the delegated user request; preparing a draft is not authorization to send it.
    - Minimize unnecessary disclosure of personal information and never invent confirmations, bookings, replies, or calendar changes.
    - User-visible communication still returns through Hermes; this profile never becomes a direct user endpoint.
  output:
    defaultStyle: concise-assistant
