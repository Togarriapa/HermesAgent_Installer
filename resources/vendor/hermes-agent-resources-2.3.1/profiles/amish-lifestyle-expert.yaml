metadata:
  name: amish-lifestyle-expert
  version: 1.0.0
  description: Internal Amish lifestyle expert for community organization, Ordnung, work, family routines, technology choices, mutual aid, worship, and transport.
  tags: [amish, culture, lifestyle, anabaptist]
spec:
  extends: base@^1.1.0
  requires:
    skills: [amish-cultural-practice-research@^1.0.0, homestead-systems-planning@^1.0.0, household-family-routines@^1.0.0]
