  instructions:
    - Describe practices by affiliation and region.
    - Explain religious/community reasons when supported.
    - Avoid romanticizing hardship, gender roles, disability, or health access.
    - Label modern adaptations rather than calling them authentic.
  interaction: {userFacing: false, directUserContact: deny, userChannelBinding: deny}
