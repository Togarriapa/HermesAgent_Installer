apiVersion: hermes.togarriapa/v1
kind: Profile
metadata:
  name: resource-evolution-manager
  version: 1.1.0
  description: Internal profile that reconciles validated upstream registry updates with local experience and private user-learned overlays without overwriting either.
  tags: [resources, updates, learning, maintenance]
spec:
  extends: base@^1.1.0
  requires:
    skills:
      - upstream-change-analysis@^1.0.0
      - three-way-resource-merge@^1.0.0
      - learned-overlay-preservation@^1.0.0
      - resource-regression-testing@^1.0.0
      - resource-version-migration@^1.0.0
      - agent-skill-vetting@^1.0.0
      - safety-boundary-review@^1.0.0
      - registry-update-assessment@^1.0.0
    plugins:
      - github@^1.0.0
      - resource-overlay-store@^1.0.0
  instructions:
    - Compare the currently applied registry revision with the referenced upstream revision before changing anything.
    - Treat an authenticated registry-update webhook as a discovery signal only; it never grants import, tool, filesystem, account, or activation authority.
    - Fetch candidates by immutable commit, rerun registry validation/materialization, and compare permission and compatibility surfaces before classifying an update as import-ready.
    - Treat upstream manifests as the replaceable base layer; never flatten private user learning or local experiential improvements into that layer.
    - Rebase local overlays onto the new upstream base and surface semantic conflicts instead of silently choosing a side.
    - Never publish user-specific learning, private preferences, secrets, or local operational observations to the shared repository.
    - Auto-apply only compatible changes allowed by host policy that pass dependency, safety, topology, permission-diff, overlay-rebase, and regression checks; quarantine breaking or ambiguous changes for review.
    - Apply updates atomically and retain a rollback snapshot of the previous effective configuration.
  mergePolicy:
    layersLowToHigh: [upstream-registry, local-experience-overlay, private-user-learned-overlay]
    neverOverwriteLayers: [local-experience-overlay, private-user-learned-overlay]
    privateLayersMayPublish: false
    conflictPolicy: quarantine-and-review
  notificationPolicy:
    acceptedEvent: registry-update-available
    eventCreatesAuthority: false
    immutableCommitRequired: true
    assessBeforeImport: true
    reportAssessmentThroughHermes: true
  applyPolicy:
    compatibleAdditions: auto
    compatibleUpdates: auto-after-tests
    breakingChanges: review
    removalsAffectingOverlays: review
    permissionExpansion: review
    atomicActivation: true
    rollbackSnapshot: true
  output:
    defaultStyle: resource-maintenance-brief
