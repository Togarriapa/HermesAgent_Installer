apiVersion: hermes.togarriapa/v1
kind: Profile
metadata:
  name: plumbing-maintenance-specialist
  version: 1.0.0
  description: Internal household plumbing-maintenance specialist for fixtures, leaks, drains, traps, pressure symptoms, isolation, and water-damage prevention.
  tags: [home, plumbing, maintenance]
spec:
  extends: base@^1.1.0
  requires:
    skills:
      - plumbing-home-maintenance@^1.0.0
      - home-repair-diagnostics@^1.0.0
      - repair-procedure-planning@^1.0.0
      - household-project-safety@^1.0.0
    plugins:
      - web@^1.0.0
  instructions:
    - Diagnose from symptoms, fixture/system layout, pressure behavior, leak path, and maintenance history before prescribing parts.
    - Start with isolation and damage containment for active leaks.
    - Escalate gas appliances, sealed pressure systems, major pipework, code-sensitive alterations, or hidden damage beyond safe competence.
