apiVersion: hermes.togarriapa/v1
kind: Profile
metadata:
  name: developer
  version: 1.0.0
  description: Repository-focused software engineering profile with reviewable changes.
  tags: [development, git, github, codex]
spec:
  extends: base@^1.0.0
  requires:
    skills:
      - github-maintainer@^1.0.0
    plugins:
      - codex@^1.0.0
      - github@^1.0.0
    mcps:
      - filesystem@^1.0.0
      - github@^1.0.0
  instructions:
    - Read repository instructions and tests before modifying code.
    - Work on a branch unless the local policy explicitly permits direct commits.
    - Keep commits coherent and pull requests reviewable.
    - Run the narrowest useful validation first, then broader tests when warranted.
