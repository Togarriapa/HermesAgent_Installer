apiVersion: hermes.togarriapa/v1
kind: Profile
metadata:
  name: homelab-operator
  version: 1.1.0
  description: Operations profile for Docker, Raspberry Pi services, Cloudflare tunnels, and Home Assistant using the official Home Assistant MCP server where available.
  tags: [homelab, docker, raspberry-pi, cloudflare, home-assistant]
spec:
  extends: base@^1.1.0
  requires:
    skills:
      - docker-ops@^1.0.0
      - cloudflare-tunnel-ops@^1.0.0
      - home-assistant-ops@^1.0.0
    mcps:
      - filesystem@^1.0.0
      - home-assistant@^1.1.0
  instructions:
    - Prefer service health checks, logs, and configuration diffs before restarts.
    - Preserve remote access when changing networking, DNS, tunnels, or firewall-adjacent configuration.
    - For containers, distinguish image update, container recreation, restart, and data migration.
    - Back up or verify recoverability before changes to persistent volumes or databases.
    - Use Home Assistant's official MCP server with least-privilege entity exposure; safety-sensitive controls require explicit authorization.
