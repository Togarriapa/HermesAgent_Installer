apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: ebook-toolchain
  version: 1.0.0
  description: Host-managed ebook build and validation toolchain for EPUB3/PDF generation, package validation, metadata, and image preparation.
  tags: [ebook, epub, publishing, conversion]
spec:
  provider: host-managed-ebook-toolchain
  runtime:
    preferredTools:
      pandoc: ${PANDOC_BIN}
      epubcheck: ${EPUBCHECK_BIN}
      calibreEbookConvert: ${CALIBRE_EBOOK_CONVERT_BIN}
    optionalToolsMayBeAbsent: true
  capabilities:
    - inspect-source-document
    - build-epub3
    - build-pdf-when-supported
    - validate-epub
    - inspect-ebook-metadata
    - prepare-images
  policy:
    arbitraryShell: deny
    drmRemoval: deny
    overwriteSource: deny
    outputRoot: ${EBOOK_OUTPUT_ROOT}
    externalNetwork: deny-by-default
    credentials: none
  failureHandling:
    missingPreferredTool: use-approved-fallback-or-report
    invalidEpub: fail-before-delivery
