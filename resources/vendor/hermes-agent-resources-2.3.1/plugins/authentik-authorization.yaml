apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: authentik-authorization
  version: 1.0.0
  description: Read-only Authentik identity provider adapter for trusted Hermes principal resolution, effective System membership checks, and live System alarm-recipient resolution.
  tags: [authentik, identity, authorization, infrastructure]
spec:
  provider: authentik-api
  endpoint: ${AUTHENTIK_BASE_URL}
  authentication:
    type: bearer
    tokenRef: ${AUTHENTIK_API_TOKEN}
  runtime:
    apiBasePath: /api/v3
    systemGroupIdRef: ${AUTHENTIK_SYSTEM_GROUP_ID}
    requiredGroupName: System
    membershipMode: direct-and-indirect
    cacheUseForAuthorization: deny
  capabilities:
    - resolve-session-principal-to-user
    - read-active-user-identity
    - read-user-effective-groups
    - verify-effective-System-membership
    - list-current-effective-System-members-for-alarm-delivery
  policy:
    writes: deny
    createUser: deny
    updateUser: deny
    deleteUser: deny
    addOrRemoveGroupMembership: deny
    groupAdministration: deny
    roleAdministration: deny
    userSuppliedIdentityClaims: deny
    failClosedOnLookupFailure: true
    credentials: runtime-only
    minimumServicePermission: identity-and-group-read-only
  failureHandling:
    unavailable: deny-privileged-decision
    ambiguousPrincipal: deny
    missingSystemGroup: deny
    inactiveUser: deny
