apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: financial-execution-gateway
  version: 1.0.0
  description: Write-capable bank, broker, exchange, and Ledger execution gateway that is technically configured but can act only from a one-shot explicit user order with fresh confirmation.
  tags: [finance, execution, banking, trading, wallet, explicit-order]
spec:
  enabled: true
  mode: explicit-user-order-only
  authorization:
    required: true
    source: hermes-user-order
    explicitUserOrder: true
    freshConfirmation: true
    oneShot: true
    ttlSeconds: 300
    wildcardAuthorization: deny
    delegatedStandingAuthority: deny
    recommendationMaySelfAuthorize: false
    bindAuthorizationTo:
      - provider
      - account
      - operation
      - instrument-or-recipient
      - side
      - quantity-or-amount
      - currency
      - price-or-limit-when-applicable
    showFinalActionPayloadBeforeConfirmation: true
    reuseAuthorization: deny
  adapters:
    banking:
      providerClass: regulated-pisp
      targetInstitutions:
        - revolut
        - banco-bpi
        - moey
      coverageCheckRequiredAtConnection: true
      directCredentialScraping: deny
      strongCustomerAuthentication: provider-user-flow
      allowedOperations:
        - initiate-user-authorized-payment
      beneficiaryAdministration: deny
      standingOrders: deny
      scheduledPayments: deny
    trading212:
      provider: trading212-public-api
      environment: live
      baseUrl: https://live.trading212.com/api/v0
      credentialRef: TRADING212_EXECUTION_CREDENTIALS
      keyPolicy:
        orderPermissionRequired: true
        ipRestriction: required
      allowedOperations:
        - place-market-order
        - place-limit-order
        - place-stop-order
        - place-stop-limit-order
        - cancel-pending-order
      accountAdministration: deny
      depositsWithdrawals: deny
      note: API is beta and order endpoints are not uniformly idempotent; gateway must enforce client-side duplicate protection.
    pionex:
      provider: pionex-api
      baseUrl: https://api.pionex.com
      credentialRef: PIONEX_TRADE_API_CREDENTIALS
      requiredPermission: Trade
      allowedOperations:
        - place-order
        - cancel-order
      withdrawals: deny
      transfers: deny
      accountAdministration: deny
    ledger:
      provider: ledger-wallet-api
      permissions:
        - account.list
        - transaction.sign
        - transaction.signAndBroadcast
      allowedOperations:
        - sign-user-authorized-transaction
        - sign-and-broadcast-user-authorized-transaction
      messageSigning: deny
      hardwareConfirmationRequired: true
      privateKeyAccess: deny
      seedPhraseAccess: deny
      recoveryCodeAccess: deny
  controls:
    preflight:
      - validate-current-account-state
      - validate-provider-capability
      - validate-authorization-envelope
      - simulate-or-estimate-where-supported
      - detect-duplicate-or-replayed-action
    postflight:
      - capture-provider-transaction-or-order-id
      - reconcile-result-to-account-state
      - append-immutable-audit-event
    onAmbiguity: deny-and-ask-hermes
    onProviderMismatch: deny
    onExpiredConfirmation: deny
  policy:
    autonomousExecution: deny
    agentInitiatedRealMoneyAction: deny
    explicitUserOrderedAction: allow-with-fresh-confirmation
    rawCredentialVisibilityToProfiles: deny
    propertyTransactions: deny
    userVisibleDeliveryViaHermesOnly: true
