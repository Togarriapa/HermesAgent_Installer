apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: epic-kanban
  version: 1.0.1
  description: Ephemeral per-Epic Kanban provider with GitHub Projects v2 or local runtime backends.
  tags: [kanban, projects, orchestration, github]
spec:
  provider: hermes-epic-kanban
  capabilities:
    - create-one-ephemeral-board-for-an-authorized-epic
    - create-and-update-epic-story-task-defect-spike-risk-and-decision-items
    - move-existing-board-items-through-the-declared-workflow-states
    - archive-an-accepted-completion-summary-before-authorized-board-deletion
  permissions:
    githubProjectsV2: [create-project, create-view, add-item, update-fields, delete-project]
    localEphemeral: [create-board, read-board, update-board, delete-board]
    repositoryCodeWrite: deny
    issueOrPullRequestMutation: deny
  sessions:
    isolation: one-board-per-epic
    persistence: ephemeral-until-accepted-done
    crossEpicReuse: deny
  backends:
    preferredWhenRepositoryBound: github-projects-v2
    fallback: local-ephemeral
  githubProjectsV2:
    credentialRef: GITHUB_TOKEN
    operations: [create-project, create-view, add-item, update-fields, delete-project]
  localEphemeral:
    root: ${HERMES_EPIC_BOARD_DIR}
  board:
    itemTypes: [epic, user-story, task, defect, spike, risk, decision]
    states: [backlog, ready, in-progress, review, blocked, done]
  lifecycle:
    createOnEpicStart: true
    archiveCompletionSummary: true
    deleteAfterAcceptedDone: true
  policy:
    internalOnly: true
    userFacing: false
    credentials: runtime-only
    authorityFromBoardState: deny
    destructiveBoardDelete: lifecycle-authorized-only
    unrelatedProjectAccess: deny
  provenance:
    githubProjectsDocs: https://docs.github.com/en/graphql/reference/projects
