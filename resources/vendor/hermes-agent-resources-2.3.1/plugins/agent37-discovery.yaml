apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: agent37-discovery
  version: 1.0.0
  description: Discovery-only access pattern for Agent37's public skill index; discovered skills are untrusted until their source repository passes local review.
  tags: [agent37, skills, discovery]
spec:
  provider: web-index
  baseUrl: https://www.agent37.com/skills
  capabilities:
    - discover-skill-candidates
    - inspect-public-metadata
  policy:
    readOnly: true
    autoInstall: false
    autoExecute: false
    trustIndexRanking: false
    requireSourceRepositoryReview: true
  provenance:
    role: discovery-only
