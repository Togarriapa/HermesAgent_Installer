apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: github
  version: 1.0.1
  description: GitHub repository, issue, pull-request, and workflow integration with explicit capability and write boundaries.
  tags: [github, git, scm]
spec:
  provider: github
  capabilities:
    - repository-read
    - issue-and-pull-request-read
    - workflow-and-status-read
    - repository-content-write-when-task-authorized
    - issue-and-pull-request-write-when-task-authorized
  auth:
    mode: environment
    token: ${GITHUB_TOKEN}
  permissions:
    default: read
    write: explicit-per-task
    destructiveOrRepositoryAdministration: explicit-confirmation-and-provider-scope
  policy:
    credentials: runtime-only
    leastPrivilegeToken: true
    authorityFromConnection: deny
    verifyAfterWrite: true
  provenance:
    provider: GitHub
    api: official
