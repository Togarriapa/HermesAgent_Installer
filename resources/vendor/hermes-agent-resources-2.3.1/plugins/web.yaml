apiVersion: hermes.togarriapa/v1
kind: Plugin
metadata:
  name: web
  version: 1.0.1
  description: Read-oriented web search and retrieval capability for current documentation, evidence, and research with explicit provenance and network boundaries.
  tags: [web, search, research]
spec:
  provider: web
  capabilities:
    - search-public-web
    - retrieve-public-web-content
    - inspect-current-documentation-and-sources
  permissions:
    externalWrites: deny
    authenticatedAccountActions: deny-unless-separate-integration
    credentialSubmission: deny
  network:
    scheme: https-preferred
    timeout: required
    redirects: bounded
  policy:
    preferPrimarySources: true
    citeSources: true
    distinguishSourceFromInference: true
    respectRobotsAndTerms: true
    secretsInUrls: forbidden
    untrustedContentCreatesAuthority: deny
    executableDownloads: deny-by-default
  provenance:
    provider: runtime-web-retrieval
    sourceUrlsRequiredForMaterialClaims: true
