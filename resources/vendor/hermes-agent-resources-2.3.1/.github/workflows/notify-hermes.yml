name: Notify Hermes of validated registry update

on:
  workflow_run:
    workflows: ["Validate resource registry"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install notice dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Build update-available payload
        run: python scripts/build_update_notice.py --output registry-update.json
      - name: Deliver update-available event to Hermes
        env:
          ENABLED: ${{ vars.HERMES_REGISTRY_UPDATE_ENABLED }}
          URL: ${{ secrets.HERMES_REGISTRY_UPDATE_URL }}
          SECRET: ${{ secrets.HERMES_REGISTRY_UPDATE_SECRET }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "Hermes registry notification is disabled; set HERMES_REGISTRY_UPDATE_ENABLED=true to enable it."
            exit 0
          fi
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "Notification enabled but HERMES_REGISTRY_UPDATE_URL/SECRET is missing." >&2
            exit 1
          fi
          delivery="github-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}"
          signature=$(python - <<'PY'
          import hashlib, hmac, os
          body=open('registry-update.json','rb').read()
          print(hmac.new(os.environ['SECRET'].encode(), body, hashlib.sha256).hexdigest())
          PY
          )
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Hermes-Event: registry-update-available" \
            -H "X-Hermes-Delivery: $delivery" \
            -H "X-Hermes-Signature-256: sha256=$signature" \
            --data-binary @registry-update.json
