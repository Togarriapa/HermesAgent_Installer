apiVersion: hermes.togarriapa/v1
kind: Webhook
metadata:
  name: cloudflare-alert
  version: 1.0.1
  description: Authenticated Cloudflare operational alert ingress for read-only incident triage; infrastructure alarms are restricted to current Authentik System members.
  tags: [webhook, cloudflare, alerting, infrastructure]
spec:
  path: /hooks/cloudflare/alert
  method: POST
  authentication:
    type: bearer
    token: ${CLOUDFLARE_ALERT_WEBHOOK_TOKEN}
  action:
    type: incident-triage
    mutate: false
  validation:
    contentType: application/json
    rejectMalformedPayload: true
  replayProtection:
    requireEventIdentity: true
    duplicateEvent: reject-or-noop
  policy:
    rejectUnauthenticated: true
    rateLimitPerMinute: 30
    authorityFromWebhookReceipt: deny
    remediationFromWebhookReceipt: deny
    mutation: deny
    infrastructureAlarmRequiredGroup: System
    resolveRecipientsAtDelivery: true
    failClosedOnRecipientAuthorizationFailure: true
    staticRecipientListAsAuthority: deny
    userVisibleResultsRouteThroughHermes: true
