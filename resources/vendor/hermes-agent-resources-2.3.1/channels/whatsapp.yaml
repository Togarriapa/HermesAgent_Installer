apiVersion: hermes.togarriapa/v1
kind: Channel
metadata:
  name: whatsapp
  version: 1.0.1
  description: WhatsApp Business user channel routed exclusively through Hermes using a scoped Composio WhatsApp Business connection.
  tags: [channel, whatsapp, composio, hermes]
spec:
  requires:
    plugins:
      - composio@^1.0.0
  adapter: composio-whatsapp-business
  integration:
    toolkit: whatsapp
    version: "20260721_00"
    inboundTrigger: provider-message-received
    allowedTools:
      - WHATSAPP_GET_MESSAGE_HISTORY
      - WHATSAPP_GET_MEDIA_INFO
      - WHATSAPP_SEND_MESSAGE
      - WHATSAPP_SEND_TEMPLATE_MESSAGE
      - WHATSAPP_SEND_MEDIA
    connection: user-authorized
  inbound:
    allowedUserNumbers: ${WHATSAPP_ALLOWED_USER_NUMBERS}
  routing:
    inboundProfile: hermes
    outboundProfile: hermes
    allowDirectProfileSelection: false
    allowedUserFacingProfiles: [hermes]
  policy:
    businessAccountsOnly: true
    requireHermesGateway: true
    rejectNonHermesProfileTarget: true
    replyToInboundConversation: allow
    proactiveOutbound: delegated-template-only
    accountAdministration: deny
    contactAdministration: deny
    destructiveTools: deny
    credentials: runtime-only
  provenance:
    toolkitDocs: https://docs.composio.dev/toolkits/whatsapp
