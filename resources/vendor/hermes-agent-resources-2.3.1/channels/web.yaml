apiVersion: hermes.togarriapa/v1
kind: Channel
metadata:
  name: web
  version: 1.1.0
  description: Web chat/API channel routed exclusively through the sole user-facing Hermes profile.
  tags: [channel, web, http, hermes]
spec:
  adapter: http
  listen:
    host: 127.0.0.1
    port: ${HERMES_CHANNEL_PORT}
  proxy:
    trustForwardedHeaders: true
  routing:
    inboundProfile: hermes
    outboundProfile: hermes
    allowDirectProfileSelection: false
    allowedUserFacingProfiles:
      - hermes
  policy:
    requireUpstreamAuthentication: true
    exposeDirectlyToInternet: false
    requireHermesGateway: true
    rejectNonHermesProfileTarget: true
