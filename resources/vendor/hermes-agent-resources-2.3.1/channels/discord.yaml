apiVersion: hermes.togarriapa/v1
kind: Channel
metadata:
  name: discord
  version: 1.1.0
  description: Discord bot channel routed exclusively through the sole user-facing Hermes profile with guild allow-listing.
  tags: [channel, discord, hermes]
spec:
  adapter: discord
  credentials:
    botToken: ${DISCORD_BOT_TOKEN}
  inbound:
    allowedGuildIds: ${DISCORD_ALLOWED_GUILD_IDS}
  routing:
    inboundProfile: hermes
    outboundProfile: hermes
    allowDirectProfileSelection: false
    allowedUserFacingProfiles:
      - hermes
  policy:
    denyUnknownGuilds: true
    requireHermesGateway: true
    rejectNonHermesProfileTarget: true
