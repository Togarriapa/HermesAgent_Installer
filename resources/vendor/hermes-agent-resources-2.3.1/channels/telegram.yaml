apiVersion: hermes.togarriapa/v1
kind: Channel
metadata:
  name: telegram
  version: 1.1.0
  description: Telegram bot channel routed exclusively through the sole user-facing Hermes profile with explicit chat allow-listing.
  tags: [channel, telegram, hermes]
spec:
  adapter: telegram
  credentials:
    botToken: ${TELEGRAM_BOT_TOKEN}
  inbound:
    allowedChatIds: ${TELEGRAM_ALLOWED_CHAT_IDS}
  outbound:
    parseMode: MarkdownV2
  routing:
    inboundProfile: hermes
    outboundProfile: hermes
    allowDirectProfileSelection: false
    allowedUserFacingProfiles:
      - hermes
  policy:
    denyUnknownChats: true
    requireHermesGateway: true
    rejectNonHermesProfileTarget: true
