apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: replace-me
  version: 0.1.0
  description: Replace with the outcome this starting team composition is intended to support.
  tags: [bundle, team, replace-me]
  source: Togarriapa/HermesAgent_Resources
spec:
  imports:
    profiles:
      - team-leader@^1.0.0
  purpose:
    outcomes:
      - replace-me
  recruitment:
    dynamic: true
    allowOutsideBundle: true
    preferSmallestCompetentTeam: true
  authority:
    membershipExpandsAuthority: false
    hostPolicyAuthoritative: true
  deliberation:
    mode: adaptive
    preserveMaterialDissent: true
  lifecycle:
    releaseIdleSpecialists: true
    completionRequiresVerification: true
