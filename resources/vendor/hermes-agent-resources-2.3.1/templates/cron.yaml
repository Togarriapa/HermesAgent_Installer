apiVersion: hermes.togarriapa/v1
kind: Cron
metadata:
  name: replace-me
  version: 0.1.0
  description: Replace with the bounded recurring job, why it runs, and whether it may mutate state.
  tags: [cron, replace-me]
  source: Togarriapa/HermesAgent_Resources
spec:
  schedule: "0 8 * * *"
  timezone: Europe/Lisbon
  action:
    type: replace-me
  concurrency:
    overlap: deny
  idempotency:
    required: true
  retries:
    attempts: 3
    backoff: exponential
  policy:
    authorityFromSchedule: deny
    mutate: false
    userVisibleRoute: hermes
