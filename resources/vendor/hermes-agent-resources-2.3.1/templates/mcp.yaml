apiVersion: hermes.togarriapa/v1
kind: MCP
metadata:
  name: replace-me
  version: 0.1.0
  description: Replace with the bounded MCP server capability, trust source, and intended exposure.
  tags: [mcp, replace-me]
  source: Togarriapa/HermesAgent_Resources
spec:
  transport: stdio
  command: replace-me
  args: []
  environment: {}
  exposure:
    default: deny
    allowedRootsOrCapabilities:
      - replace-me
  policy:
    credentials: runtime-only
    leastPrivilege: true
    writes: deny-unless-explicitly-declared
    destructiveActions: explicit-confirmation
  provenance:
    provider: replace-me
    source: replace-with-reviewed-or-official-source
    version: pin-when-practical
