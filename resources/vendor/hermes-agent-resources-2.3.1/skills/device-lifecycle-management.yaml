apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: device-lifecycle-management
  version: 1.0.0
  description: Manage connected devices from procurement through commissioning, inventory, firmware, credentials, backup, maintenance, replacement, and secure decommissioning.
  tags: [iot, devices, lifecycle]
spec:
  procedure:
    - Record model, identifiers, protocol, location, owner, firmware, integration, credentials, purchase date, warranty, and critical dependencies.
    - Define commissioning, backup, update, battery or maintenance, failure, replacement, and decommissioning procedures.
    - Track end-of-support and cloud-service dependency risks before devices become operational liabilities.
    - Remove credentials, automations, network access, and retained data when decommissioning.
