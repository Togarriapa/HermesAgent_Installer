apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: financial-planning
  version: 1.0.1
  description: Structure financial goals, cash-flow constraints, time horizons, liquidity needs, and planning assumptions.
  tags: [finance, planning]
spec:
  purpose: Build evidence-based planning scenarios without representing regulated personal financial advice as guaranteed outcomes.
  procedure:
    - Inventory goals, deadlines, currencies, income, recurring spending, debt obligations, assets, liquidity reserves, and known constraints.
    - Separate essential liquidity and near-term obligations from longer-horizon capital and define measurable planning priorities.
    - Model baseline and adverse scenarios for cash flow, inflation, income disruption, major expenses, and savings capacity using explicit assumptions.
    - Identify dependencies on tax, legal, insurance, pension, or regulated investment advice and route those conclusions to qualified specialists when needed.
    - Produce prioritized planning actions and review triggers without presenting forecasts or outcomes as guaranteed.
  verification:
    - goals-time-horizons-and-cashflows-reconcile
    - downside-liquidity-scenarios-are-included
    - regulated-or-jurisdiction-specific-dependencies-are-flagged
