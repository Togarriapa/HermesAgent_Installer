apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: team-retrospectives
  version: 1.0.0
  description: Facilitate psychologically safer, evidence-aware retrospectives that produce small owned improvement experiments.
  tags: [agile, retrospective, improvement]
spec:
  procedure:
    - Gather evidence about outcomes, flow, quality, collaboration, and notable events.
    - Create space for differing observations without turning the session into blame assignment.
    - Select a small number of controllable improvement experiments with owners and review dates.
    - Inspect prior experiments before adding new process changes.
