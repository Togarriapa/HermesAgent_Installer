apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: cross-service-incident-diagnosis
  version: 1.0.0
  description: Correlate host, application, Cloudflare, network, storage, backup, and Home Assistant context to identify likely homelab incident causes before remediation.
  tags: [homelab, incident, sre, diagnosis, infrastructure]
spec:
  principles: [read-first, correlate-before-remediate, distinguish-symptom-from-cause, evidence-ranked-hypotheses]
  procedure:
    - define-user-visible-symptom-and-affected-services
    - collect-read-only-health-signals-from-approved-integrations
    - establish-timeline-and-common-dependency-map
    - rank-host-application-network-cloudflare-storage-and-capacity-hypotheses
    - identify-disconfirming-evidence-and-unknowns
    - recommend-smallest-safe-test-or-remediation
    - require-separate-authentik-System-authorization-before-any-state-change
  policy:
    diagnosisCreatesMutationAuthority: deny
    authorityFromAlarm: deny
