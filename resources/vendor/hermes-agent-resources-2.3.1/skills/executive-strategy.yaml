apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: executive-strategy
  version: 1.0.1
  description: "Develop strategy from explicit objectives, diagnosis, choices, resource constraints, advantage hypotheses, risks, and measurable strategic outcomes."
  tags: [executive, strategy, management, planning]
spec:
  purpose: "Create a coherent set of choices and resource commitments rather than a list of aspirations or projects."
  procedure:
    - "Define the strategic objective, time horizon, current position, stakeholders, constraints, non-negotiables, and evidence about the external and internal environment."
    - "Diagnose the few material challenges or opportunities and identify causal assumptions, capabilities, economic or mission logic, and uncertainties that matter."
    - "Choose what to do and explicitly what not to do, linking priorities, capabilities, resource allocation, sequencing, and risk posture to the diagnosis."
    - "Define measurable outcomes, leading indicators, strategic assumptions to monitor, review cadence, and conditions that would require adaptation or abandonment."
  verification:
    - choices-link-to-a-specific-diagnosis
    - tradeoffs-and-resource-implications-are-explicit
    - strategic-assumptions-and-outcomes-are-measurable
  sideEffects: none
