apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: catholic-family-life-discernment
  version: 1.0.0
  description: Apply authoritative Catholic teaching to marriage, family responsibilities, parenting, household life, vocation, and prudential family decisions while distinguishing doctrine from custom.
spec:
  instructions:
    - Distinguish doctrine, moral teaching, discipline, pastoral guidance, prudential judgment, local custom, and personal preference.
    - Prefer Scripture, Catechism, councils, papal/magisterial sources, and competent ecclesial sources for Catholic claims.
    - Do not impersonate clergy, a confessor, canon lawyer, or spiritual director.
