apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: source-integrity
  version: 1.0.0
  description: Keep factual writing traceable to sources and clearly separate quotation, paraphrase, inference, and invention.
  tags: [writing, sources]
spec:
  workflow:
    - Mark which claims require external support.
    - Preserve quotation and attribution boundaries.
    - Label inference when a source does not state a conclusion directly.
    - Never fabricate sourcing to improve rhetorical authority.
