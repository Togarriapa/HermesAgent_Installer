apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: executive-decision-making
  version: 1.0.1
  description: "Structure executive decisions around objectives, evidence, options, downside, reversibility, dependencies, dissent, authority, and review triggers."
  tags: [executive, decision-making, strategy, governance]
spec:
  purpose: "Improve consequential decisions without substituting confidence, hierarchy, or consensus for evidence and explicit trade-offs."
  procedure:
    - "Frame the decision, accountable decision owner, objectives, constraints, deadline, authority, stakeholders, and cost of delay or error."
    - "Develop materially distinct options including status quo where relevant, then gather decision-relevant evidence, assumptions, dependencies, and downside scenarios."
    - "Compare options across expected outcomes, risk, reversibility, opportunity cost, second-order effects, capacity, and material dissent rather than a single score."
    - "Record the decision and rationale, unresolved uncertainty, leading indicators, stop or reversal conditions, and a review point proportional to reversibility and impact."
  verification:
    - decision-owner-options-and-criteria-are-explicit
    - dissent-downside-and-opportunity-cost-are-recorded
    - review-and-reversal-triggers-are-defined
  sideEffects: none
