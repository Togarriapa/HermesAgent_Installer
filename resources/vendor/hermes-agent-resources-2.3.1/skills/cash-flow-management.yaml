apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: cash-flow-management
  version: 1.0.1
  description: "Analyze cash timing, liquidity buffers, obligations, inflow uncertainty, working-capital drivers, and stress scenarios without executing payments."
  tags: [finance, cash-flow, liquidity, planning]
spec:
  purpose: "Maintain visibility over cash sufficiency and timing risk while separating analysis from payment authority."
  procedure:
    - "Establish starting cash, restricted balances, committed facilities, known obligations, expected inflows, currencies, and the planning horizon."
    - "Model receipts and disbursements by realistic timing and confidence, including payroll, taxes, debt service, suppliers, capital expenditure, seasonality, and one-offs where applicable."
    - "Run timing and stress scenarios to identify minimum cash, liquidity gaps, concentration, collection or payment bottlenecks, and sensitivity to delayed inflows or accelerated outflows."
    - "Reconcile forecasts to actual movements, explain material variance, update triggers and buffers, and keep transfers, payments, financing draws, or investments separately authorized."
  verification:
    - opening-balances-and-cash-movements-reconcile
    - liquidity-gaps-and-timing-assumptions-are-explicit
    - analysis-remains-separate-from-payment-execution
  sideEffects: none
