apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: benchmark-design
  version: 1.0.1
  description: "Design representative benchmarks with explicit objectives, populations, task distributions, baselines, graders, acceptance criteria, uncertainty, and reproducibility."
  tags: [evaluation, benchmark, testing, quality]
spec:
  purpose: "Create decision-relevant benchmarks that resist overfitting and make limitations visible."
  procedure:
    - "Define the decision the benchmark will support, target population or workload, capabilities under test, exclusions, success criteria, and known confounders."
    - "Construct representative normal, edge, adversarial, and known-failure cases with baselines, sampling rules, protected holdouts where appropriate, and stable versioned inputs."
    - "Define objective measurements or grader rubrics, calibrate grader reliability, capture latency and cost where material, and prevent leakage from evaluation data into optimization."
    - "Report aggregate and segmented results with uncertainty, failures, environment and version provenance, and limitations before using the benchmark as a release or policy gate."
  verification:
    - cases-represent-target-use-and-important-failures
    - grading-and-measurement-reliability-is-checked
    - benchmark-version-environment-and-limitations-are-recorded
  sideEffects: none
