apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: real-estate-investment-analysis
  version: 1.0.1
  description: Analyze real-estate investments using location, demand, rents, vacancy, cap rates, financing, taxes, maintenance, regulation, and exit scenarios.
  tags: [real-estate, investment]
spec:
  purpose: Compare property economics and risks while routing legal/tax/title matters to qualified specialists.
  procedure:
    - Define property type, location, tenancy, condition, title/ownership assumptions, financing, holding period, and investor objectives.
    - Analyze local supply/demand, comparable rents and transactions, vacancy, tenant quality, lease structure, operating costs, maintenance, capex, and management requirements.
    - Evaluate financing terms, leverage, refinancing exposure, debt-service coverage, taxes, insurance, regulation, zoning, and other jurisdiction-dependent constraints.
    - Compare valuation and cash-flow scenarios under changes in rents, vacancy, cap rates, expenses, financing, capex, and exit timing.
    - Flag legal, title, structural, environmental, tax, and regulated-professional questions for qualified local specialists rather than inferring definitive answers.
  verification:
    - property-economics-use-local-and-current-assumptions
    - financing-capex-and-exit-risks-are-stressed
    - legal-tax-title-and-technical-dependencies-are-flagged
