apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: amish-agriculture-practice-analysis
  version: 1.0.1
  description: Analyze Amish agricultural practices with historical, regional, economic, technological, religious, and community context while avoiding overgeneralization.
  tags: [amish, agriculture, history, culture]
spec:
  purpose: Explain agricultural practice as locally situated evidence rather than treating Amish communities as culturally uniform.
  procedure:
    - Identify the specific Amish affiliation, settlement, region, period, farm type, and evidence base before describing a practice as characteristic.
    - Separate theological or Ordnung-related constraints from local custom, economics, soil and climate conditions, market access, household labor, and neighboring agricultural influence.
    - Compare primary accounts, agricultural records, ethnography, and reputable scholarship and note where evidence represents one settlement rather than broader Amish practice.
    - Analyze crop and livestock systems, power and machinery choices, labor organization, land stewardship, market relationships, and adaptation over time without romanticizing or pathologizing them.
    - Synthesize similarities, differences, change drivers, uncertainties, and limits on generalization, explicitly distinguishing documented practice from inference.
  verification:
    - Claims about Amish practice must be scoped to place, affiliation, period, and source quality when those factors materially differ.
    - Religious explanations must not be asserted when economic, ecological, or community evidence better explains the observed practice.
