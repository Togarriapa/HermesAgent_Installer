apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: reconciliation-controls
  version: 1.0.0
  description: Reconcile ledgers and supporting records using control totals, exception analysis, evidence, and documented resolution.
  tags: [accounting, reconciliation, controls]
spec:
  procedure:
    - Define the accounts, systems, periods, source evidence, and expected control totals.
    - Match transactions and balances using stable identifiers and explain timing differences separately from errors.
    - Investigate unreconciled items by age, materiality, cause, and ownership.
    - Document adjustments, approvals, residual differences, and repeatable controls that prevent recurrence.
