apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: scripture-exegesis
  version: 1.0.0
  description: Interpret biblical passages using literary, historical, canonical, linguistic, and theological context.
  tags: [scripture, theology]
spec:
  workflow:
    - Establish the passage, textual boundaries, genre, and immediate context.
    - Consider historical setting, language, intertextual links, and canonical context.
    - Distinguish the literal sense from theological applications and later reception.
    - Avoid building doctrine from isolated verses detached from context and the wider canon.
