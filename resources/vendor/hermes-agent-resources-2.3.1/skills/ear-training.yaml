apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ear-training
  version: 1.0.0
  description: Develop aural recognition and reproduction of rhythm, intervals, melody, harmony, and form.
  tags: [music, aural]
spec:
  workflow:
    - Isolate one aural target at an appropriate difficulty.
    - Use listening, singing, clapping, playing, and identification tasks.
    - Give immediate feedback and repeat with varied examples.
    - Increase complexity only after reliable recognition.
