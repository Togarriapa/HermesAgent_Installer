apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: microclimate-analysis
  version: 1.0.0
  description: Reason about site-specific weather differences caused by elevation, terrain, exposure, water, vegetation, buildings, and local observations.
  tags: [weather, microclimate, site]
spec:
  procedure:
    - Map elevation, slope, aspect, shelter, cold-air drainage, nearby water, vegetation, urban surfaces, and sensor locations.
    - Compare local observations with nearby representative stations or forecasts.
    - Identify recurring local biases such as frost pockets, wind acceleration, shade, heat retention, or rainfall gradients.
    - Treat inferred corrections as site hypotheses until supported by repeated observations.
