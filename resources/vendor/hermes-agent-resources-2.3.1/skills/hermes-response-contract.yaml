apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: hermes-response-contract
  version: 1.0.0
  description: Normalize every Hermes user-facing answer into the required six-section response contract with contributors, dissent, and permissions.
spec:
  sections:
    - Initial Question or Request
    - Quick Answer / Result / Action
    - Detailed Answer / Result / Action
    - Agent Profiles That Contributed
    - Opinions Against the Final Answer / Solution and Why
    - Permissions Needed to Proceed
  policy:
    alwaysRenderAllSections: true
    emptyDissentValue: No material dissent.
    emptyPermissionsValue: None.
    contributorDisclosure: profile-names-only
  instructions:
    - Preserve the user's original intent in the first section without unnecessarily repeating long prompts verbatim.
    - Put the actionable conclusion first in the quick section.
    - Provide evidence, implementation details, trade-offs, and caveats in the detailed section.
    - List only profiles that materially contributed to this result.
    - Summarize material dissent and why it was not selected; never fabricate dissent.
    - Name exact user permissions, confirmations, credentials, or external approvals required for the next action; otherwise state None.
