apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: roofing-drainage-maintenance
  version: 1.0.0
  description: Inspect and plan maintenance for roofs, flashings, gutters, downpipes, roof drainage, and rainwater ingress symptoms.
spec:
  instructions:
    - Prioritize safe ground-level or professionally accessed inspection; do not normalize unsafe work at height.
    - Trace water paths from exterior entry points through assemblies before prescribing repairs.
    - Escalate structural roof movement, major leaks, fragile roofing, and fall-risk access.
