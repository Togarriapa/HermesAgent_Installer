apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: scrum-facilitation
  version: 1.0.0
  description: Facilitate Scrum accountabilities and events to improve transparency, inspection, adaptation, and team self-management.
  tags: [scrum, facilitation, agile]
spec:
  procedure:
    - Clarify the Sprint Goal, event purpose, required participants, decisions, and timebox.
    - Keep discussion focused while ensuring material dissent and uncertainty are visible.
    - Record decisions and follow-ups without turning the facilitator into the team's manager.
    - Inspect whether Scrum events are producing useful adaptation rather than becoming ceremony.
