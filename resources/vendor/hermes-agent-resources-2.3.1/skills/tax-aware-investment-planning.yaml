apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: tax-aware-investment-planning
  version: 1.0.1
  description: Identify tax-sensitive investment decisions and coordination points with accountants and jurisdiction-specific advisers.
  tags: [investment, tax, planning]
spec:
  purpose: Surface tax considerations without replacing current jurisdiction-specific professional tax advice.
  procedure:
    - Establish the relevant tax residence, account or wrapper type, asset type, holding period, income/capital-gain character, and transaction context before discussing tax effects.
    - Identify potentially material tax dimensions such as realization timing, withholding, distributions, loss utilization, basis, wrappers, cross-border exposure, and reporting obligations.
    - Distinguish generally applicable planning logic from jurisdiction-specific rates, exemptions, elections, filing rules, and anti-avoidance provisions that require current authoritative verification.
    - Compare investment alternatives on after-tax scenarios while avoiding false precision where the applicable law, taxpayer facts, or future rates are uncertain.
    - Route material tax conclusions, filings, elections, or transaction-specific advice to a qualified jurisdiction-specific tax professional.
  verification:
    - jurisdiction-and-taxpayer-assumptions-are-explicit
    - current-law-dependent-claims-are-identified-for-verification
    - analysis-does-not-present-general-planning-as-professional-tax-advice
