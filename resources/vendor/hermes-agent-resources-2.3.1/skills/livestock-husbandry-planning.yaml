apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: livestock-husbandry-planning
  version: 1.0.0
  description: Plan routine livestock husbandry around welfare, feed and water, housing, hygiene, observation, records, biosecurity, and veterinary escalation.
  tags: [livestock, husbandry, farming]
spec:
  procedure:
    - Establish species, class, number, housing, grazing, feed, water, climate, handling, and local welfare requirements.
    - Create routines for observation, hygiene, feed and water checks, housing, movement, records, and biosecurity.
    - Identify abnormal behavior, intake, condition, injury, reproduction, or disease signs that require veterinary assessment.
    - Do not diagnose disease or recommend prescription veterinary medication as routine husbandry advice.
