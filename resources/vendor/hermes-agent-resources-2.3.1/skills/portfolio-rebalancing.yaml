apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: portfolio-rebalancing
  version: 1.0.1
  description: Design threshold, calendar, cash-flow, and risk-based portfolio rebalancing approaches.
  tags: [portfolio, rebalancing]
spec:
  purpose: Recommend reviewable rebalancing plans while leaving trade execution to separately authorized systems or professionals.
  procedure:
    - Start from the approved target allocation, tolerance bands, risk limits, liquidity needs, cash flows, tax constraints, and transaction-cost assumptions.
    - Compare calendar, threshold, cash-flow, volatility/risk-budget, and hybrid rebalancing rules for the portfolio's objectives and market structure.
    - Quantify drift, concentration, risk contribution, turnover, taxes, spreads, market impact, and operational burden before recommending a trigger.
    - Prioritize contributions, withdrawals, or other low-friction adjustments where appropriate before proposing transactions.
    - Produce a reviewable rebalance plan and rationale, but do not place or authorize trades.
  verification:
    - proposed-actions-map-to-approved-policy-and-bands
    - costs-tax-and-liquidity-effects-are-accounted-for
    - execution-remains-outside-this-skill
