apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: market-structure-analysis
  version: 1.0.1
  description: Analyze liquidity, spreads, venues, flows, positioning, market mechanics, and execution frictions across traded assets.
  tags: [markets, liquidity, structure]
spec:
  purpose: Explain market behavior and implementation risk without providing manipulative trading tactics.
  procedure:
    - Identify the instrument, venue set, participant types, trading hours, settlement model, tick/lot rules, and relevant market-making structure.
    - Examine spreads, depth, turnover, volatility, fragmentation, concentration, borrow/funding conditions, derivatives linkages, and liquidity across regimes.
    - Distinguish observable flows and positioning evidence from inferred intent, and identify where data coverage or reporting lags limit conclusions.
    - Evaluate implementation risks such as slippage, market impact, gap risk, halts, forced flows, crowded positioning, and liquidity evaporation under stress.
    - Explain mechanics and risk controls without recommending spoofing, wash trading, manipulation, or other abusive tactics.
  verification:
    - venue-and-instrument-mechanics-are-correctly-identified
    - liquidity-conclusions-use-more-than-one-metric
    - analysis-does-not-enable-market-manipulation
