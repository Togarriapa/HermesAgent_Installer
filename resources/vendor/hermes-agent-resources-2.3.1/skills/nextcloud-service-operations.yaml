apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: nextcloud-service-operations
  version: 1.0.0
  description: Diagnose and maintain the approved Nextcloud deployment through bounded status, maintenance, repair, job, backup, and verification operations.
  tags: [nextcloud, homelab, infrastructure, operations]
spec:
  principles: [preserve-user-data, bounded-admin-surface, backup-before-risky-change, verify-application-health]
  procedure:
    - inspect-nextcloud-service-database-storage-and-background-job-health
    - correlate-host-capacity-and-cloudflare-path-when-user-impact-is-reported
    - require-authentik-System-authorization-before-state-change
    - require-current-backup-or-explicit-risk-acceptance-before-material-data-affecting-maintenance
    - execute-only-approved-nextcloud-administration-operation
    - verify-maintenance-mode-service-health-storage-and-background-jobs
    - preserve-evidence-and-rollback-path
  policy:
    directDatabaseMutation: deny
    arbitraryOccCommand: deny
    userDataDeletion: explicit-confirmation
    mutationAuthorization: authentik-System-fresh
