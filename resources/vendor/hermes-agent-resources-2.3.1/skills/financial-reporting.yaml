apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: financial-reporting
  version: 1.0.0
  description: Prepare and analyze financial reporting with framework, period, materiality, classification, disclosure, and consistency controls.
  tags: [accounting, reporting, statements]
spec:
  procedure:
    - Establish the reporting framework, entity, period, currency, materiality, and intended users.
    - Reconcile underlying ledgers and map accounts to financial-statement presentation.
    - Evaluate recognition, measurement, classification, presentation, comparatives, and disclosure requirements.
    - Document estimates, judgments, unusual items, adjustments, and unresolved reporting questions.
