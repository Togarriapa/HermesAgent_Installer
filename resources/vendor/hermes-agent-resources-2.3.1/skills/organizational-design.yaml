apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: organizational-design
  version: 1.0.1
  description: "Design organizations around outcomes, decision rights, capabilities, interfaces, spans, incentives, accountability, and coordination cost."
  tags: [organization, design, management, governance]
spec:
  purpose: "Align structure and decision systems to work requirements rather than copying titles, ratios, or fashionable operating models."
  procedure:
    - "Define mission or business outcomes, work types, strategy, critical capabilities, scale, regulatory constraints, geography, and current organizational failure modes."
    - "Map value flows, decisions, dependencies, interfaces, skill concentration, workload, incentives, and coordination bottlenecks before drawing reporting lines."
    - "Compare structural options across accountability, decision latency, specialization, resilience, manager capacity, career paths, and transition cost."
    - "Define decision rights and interfaces, test the design against representative work and failure scenarios, and measure whether outcomes improve after implementation."
  verification:
    - structure-links-to-work-and-strategy
    - decision-rights-and-interfaces-are-explicit
    - transition-risks-and-outcome-measures-are-defined
  sideEffects: none
