apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: fixed-income-analysis
  version: 1.0.1
  description: Analyze sovereign and corporate fixed income using yield, duration, convexity, credit, liquidity, curve, and reinvestment risks.
  tags: [bonds, fixed-income, credit]
spec:
  purpose: Compare fixed-income opportunities and risks without executing transactions.
  procedure:
    - Identify issuer, instrument seniority, currency, coupon, maturity, call/put features, covenants, benchmark, and settlement or liquidity characteristics.
    - Decompose return into yield, carry, roll-down, spread, duration, convexity, currency, reinvestment, and default/recovery assumptions as applicable.
    - Assess issuer credit quality, leverage, coverage, refinancing needs, collateral, covenant protection, sovereign or sector exposure, and rating-transition risk.
    - Stress parallel and non-parallel curve shifts, spread widening, liquidity deterioration, inflation, and adverse credit scenarios.
    - Compare instruments on risk-adjusted economics and portfolio role while keeping transaction execution outside this skill.
  verification:
    - instrument-features-and-cashflows-are-correctly-identified
    - rate-credit-liquidity-and-currency-risks-are-separated
    - stress-cases-and-key-assumptions-are-visible
