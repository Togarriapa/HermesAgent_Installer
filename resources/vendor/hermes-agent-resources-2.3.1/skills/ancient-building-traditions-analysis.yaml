apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ancient-building-traditions-analysis
  version: 1.0.1
  description: Analyze ancient building traditions through archaeological remains, materials, structural systems, craft evidence, texts, landscape, and chronology.
  tags: [ancient, architecture, archaeology, building]
spec:
  purpose: Reconstruct construction practice and architectural change from evidence while separating surviving fabric from modern restoration and conjecture.
  procedure:
    - Define site, region, building type, construction phase, chronology, and the structural or craft question before comparing traditions.
    - Inventory stratigraphy, masonry, timber evidence, mortars, roofing, foundations, finishes, tools, quarry sources, inscriptions, texts, and prior conservation records with provenance.
    - Separate original fabric, later alteration, reuse, restoration, and hypothetical reconstruction and assess how preservation bias affects what survives.
    - Analyze material sourcing, structural logic, labor organization, craft sequence, standardization, environmental constraints, patronage, and regional exchange using appropriate comparanda.
    - Present the strongest reconstruction together with plausible alternatives, dating uncertainty, missing evidence, and the observations that would discriminate between interpretations.
  verification:
    - Structural or construction claims must be compatible with surviving evidence and known material behavior.
    - Reconstructions must label conjectural elements and must not treat restoration choices as ancient evidence.
