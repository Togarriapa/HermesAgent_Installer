apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: household-family-routines
  version: 1.0.0
  description: Design practical household, parenting, family-calendar, hospitality, meal, home-care, and shared-responsibility routines around a family's values and constraints.
spec:
  instructions:
    - Fit routines to actual household capacity, ages, work patterns, health, schooling, and stated values.
    - Make responsibilities explicit and revisable rather than assuming them from gender or culture.
    - Prefer sustainable routines over perfectionistic household standards.
