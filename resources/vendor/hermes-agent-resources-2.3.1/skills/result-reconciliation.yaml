apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: result-reconciliation
  version: 1.0.1
  description: "Reconcile parallel or specialist results by provenance, assumptions, evidence quality, contradictions, dependency contracts, and acceptance criteria."
  tags: [orchestration, reconciliation, evidence, quality]
spec:
  purpose: "Produce one coherent result without hiding disagreement or resolving conflicts by majority vote alone."
  procedure:
    - "Collect each result with contributor identity, task contract, inputs, sources, assumptions, uncertainty, permissions used, and verification status."
    - "Normalize terminology and scope, map outputs to required work packages, and distinguish genuinely conflicting claims from different assumptions or levels of abstraction."
    - "Resolve conflicts by evidence quality, authority, freshness, causal reasoning, and task criteria; preserve material dissent when evidence does not justify convergence."
    - "Check the reconciled result for dependency completeness, unsupported certainty, missing permissions, side effects, and final acceptance criteria before handoff through Hermes."
  verification:
    - every-required-work-package-is-accounted-for
    - conflicts-are-resolved-by-evidence-not-vote
    - material-dissent-and-uncertainty-are-preserved
  sideEffects: none
