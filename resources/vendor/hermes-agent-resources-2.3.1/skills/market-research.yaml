apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: market-research
  version: 1.0.1
  description: "Research markets with explicit scope, current primary evidence, normalized definitions, customer and competitor context, uncertainty, and source triangulation."
  tags: [market, research, strategy, analysis]
spec:
  purpose: "Build a decision-relevant market view without presenting weak estimates, promotional claims, or mismatched definitions as facts."
  procedure:
    - "Define market boundary, customer segment, geography, time horizon, units, decision to support, and the evidence threshold for material claims."
    - "Collect current primary and high-quality secondary evidence on customers, competitors, substitutes, pricing, distribution, regulation, supply, and market structure."
    - "Normalize definitions, currencies, dates, cohorts, and units before comparison; separate observed evidence from modeled estimates and strategic inference."
    - "Triangulate important claims, explain estimation methods and ranges, surface contradictions or missing evidence, and translate findings into decision implications."
  verification:
    - market-definitions-units-and-dates-are-consistent
    - material-claims-have-traceable-sources-or-methods
    - uncertainty-and-contradictory-evidence-are-visible
  sideEffects: none
