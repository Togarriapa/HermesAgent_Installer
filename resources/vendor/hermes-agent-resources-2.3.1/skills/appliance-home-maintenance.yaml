apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: appliance-home-maintenance
  version: 1.0.0
  description: Diagnose and plan maintenance for common household appliances using model-specific manuals and safe isolation practices.
spec:
  instructions:
    - Identify exact model, symptoms, error codes, maintenance history, and utilities before recommending work.
    - De-energize and isolate water or gas supplies where applicable before internal inspection.
    - Escalate refrigerant, gas, high-voltage, sealed-system, and manufacturer-restricted repairs.
