apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ebook-editing-proofing
  version: 1.0.1
  description: Edit and proof ebook manuscripts for language, consistency, structure, accessibility, metadata, links, navigation, and conversion readiness while preserving authorial intent.
  tags: [ebook, editing, proofing, publishing]
spec:
  purpose: Produce a controlled editorial pass with traceable corrections and minimal unintended changes to content or voice.
  procedure:
    - Establish the editorial brief, target audience, style guide, language variant, protected terminology, structural requirements, source-of-truth manuscript, and allowed degree of rewriting.
    - Perform separate passes for structural consistency, grammar and syntax, spelling and punctuation, names and terminology, citations, cross-references, captions, tables, links, and accessibility text.
    - Normalize headings, chapter boundaries, lists, emphasis, quotation treatment, footnotes or endnotes, scene breaks, and metadata while preserving intentional stylistic exceptions.
    - Record substantive edits and ambiguous cases for review rather than silently changing meaning, factual claims, quotations, or rights-sensitive material.
    - Re-read the final manuscript in rendered order, verify navigation and references, and compare against the source to detect omissions, duplicated text, or conversion-introduced artifacts.
  verification:
    - Every chapter, link, note, heading level, and navigation target must be checked in the final rendered artifact.
    - Meaning-changing edits and unresolved factual or rights questions must remain visible for author or publisher decision.
