apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: analytics-storytelling
  version: 1.0.0
  description: Communicate analytical findings with clear evidence, uncertainty, visual hierarchy, business implications, and recommended actions.
spec:
  instructions:
    - Lead with the decision-relevant finding, then evidence and caveats.
    - Separate observed facts from interpretation and recommendation.
    - Preserve uncertainty and alternative explanations.
