apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: iot-network-security
  version: 1.0.0
  description: Reduce smart-home and IoT exposure through segmentation, least privilege, credential isolation, egress control, update hygiene, logging, and secure remote access.
  tags: [iot, security, network]
spec:
  procedure:
    - Inventory devices, firmware support, cloud dependencies, credentials, local APIs, inbound exposure, and outbound destinations.
    - Segment untrusted devices and restrict lateral access while preserving explicitly required discovery or controller paths.
    - Prefer authenticated local APIs, unique credentials, encrypted management, controlled egress, and secure remote access over port forwarding.
    - Define update, backup, replacement, vulnerability-response, and end-of-support plans.
