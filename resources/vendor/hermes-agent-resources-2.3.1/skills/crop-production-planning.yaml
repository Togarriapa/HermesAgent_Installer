apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: crop-production-planning
  version: 1.0.0
  description: Plan crop establishment, rotation, fertility, irrigation, protection, harvest, and post-harvest activities from site and crop constraints.
  tags: [agriculture, crops, planning]
spec:
  procedure:
    - Establish crop, cultivar, site, soil, climate, rotation history, market or household objective, and production constraints.
    - Build stage-based requirements for establishment, nutrition, water, weed and pest pressure, support, and harvest.
    - Use local extension or authoritative crop guidance where available.
    - Record assumptions and adapt the plan to observed crop condition and weather rather than following a fixed calendar blindly.
