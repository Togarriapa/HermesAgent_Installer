apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: release-engineering
  version: 1.0.0
  description: Plan and execute software releases with versioning, change records, compatibility checks, staged rollout, verification, and rollback.
  tags: [release, devops, delivery]
spec:
  procedure:
    - Define release scope, dependencies, compatibility, migrations, risk, verification, and rollback before deployment.
    - Produce identifiable artifacts and a clear change record.
    - Prefer staged exposure for high-impact changes when the platform supports it.
    - Verify critical behavior after deployment and stop or roll back on material regressions.
