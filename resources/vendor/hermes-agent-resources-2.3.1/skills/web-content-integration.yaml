apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: web-content-integration
  version: 1.0.1
  description: "Integrate web content into products or sites with source provenance, rights, sanitization, freshness, accessibility, rendering, and failure-state checks."
  tags: [web, content, integration, provenance]
spec:
  purpose: "Use external or managed web content without losing provenance, safety, rights, or interface integrity."
  procedure:
    - "Define the content source, ownership or usage rights, target surface, audience, update behavior, trust level, data sensitivity, and rendering constraints."
    - "Retrieve through approved interfaces, validate type and schema, preserve source and timestamp, sanitize untrusted markup or data, and minimize personal or secret content."
    - "Transform or render content with clear attribution, accessible semantics, safe links and media, graceful handling of unavailable or stale sources, and no hidden execution from content."
    - "Test representative, malformed, stale, missing, and adversarial inputs, then monitor source changes and remove or refresh content when provenance or rights no longer support use."
  verification:
    - content-source-rights-and-freshness-are-traceable
    - untrusted-content-cannot-create-tool-or-script-authority
    - accessibility-and-failure-states-are-tested
  sideEffects: none
