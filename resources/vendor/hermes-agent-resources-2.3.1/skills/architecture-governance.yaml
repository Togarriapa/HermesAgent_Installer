apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: architecture-governance
  version: 1.0.1
  description: "Govern architecture decisions, standards, exceptions, reviews, and long-term coherence with evidence, proportional guardrails, and traceable decisions."
  tags: [architecture, governance, technology, decisions]
spec:
  purpose: "Keep architecture coherent without turning governance into either unchecked autonomy or unnecessary delivery blockage."
  procedure:
    - "Define the decision scope, affected systems, quality attributes, owners, constraints, existing standards, dependencies, and consequences of divergence."
    - "Gather current architecture evidence and compare materially different options across reliability, security, operability, cost, evolvability, compatibility, and reversibility."
    - "Apply the smallest appropriate guardrail, record decisions and exceptions with rationale, expiry or review conditions, and avoid granting implementation authority through the review itself."
    - "Verify downstream conformance and outcomes, revisit decisions when assumptions or constraints change, and retire obsolete standards rather than accumulating contradictory rules."
  verification:
    - architecture-decisions-and-exceptions-are-traceable
    - guardrails-are-proportionate-to-risk
    - governance-review-does-not-create-execution-authority
  sideEffects: none
