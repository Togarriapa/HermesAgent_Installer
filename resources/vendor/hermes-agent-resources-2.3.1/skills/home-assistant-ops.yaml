apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: home-assistant-ops
  version: 1.0.0
  description: Diagnose and change Home Assistant configuration conservatively.
  tags: [home-assistant, automation, smart-home]
spec:
  procedure:
    - Inspect entity, integration, automation, and log state relevant to the task.
    - Prefer configuration validation before restart/reload.
    - Use service reloads for scoped changes when supported.
    - Verify the changed entity or automation using observable state after application.
  guardrails:
    - Do not expose long-lived access tokens.
    - Avoid broad entity or integration deletion when a repair/reload is available.
    - Treat alarm, lock, access-control, and safety automations as high impact.
