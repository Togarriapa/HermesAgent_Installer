apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: design-system-implementation
  version: 1.0.0
  description: Implement reusable UI tokens and components while preserving accessibility, consistency, API clarity, and upgrade paths.
  tags: [frontend, design-system, components]
spec:
  procedure:
    - Translate design tokens into a consistent implementation contract.
    - Define component variants, composition rules, states, accessibility behavior, and escape hatches.
    - Avoid application-specific business logic inside foundational components.
    - Document changes and migration paths for breaking component APIs.
