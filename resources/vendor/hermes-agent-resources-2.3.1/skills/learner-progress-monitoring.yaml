apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: learner-progress-monitoring
  version: 1.0.0
  description: Monitor learner progress using goals, observations, work samples, assessments, trends, and appropriately scoped interventions.
  tags: [education, assessment, progress]
spec:
  procedure:
    - Define observable learning goals and suitable evidence for progress.
    - Combine assessment results with work samples and classroom observations rather than relying on one score.
    - Distinguish temporary difficulty, missing prerequisite knowledge, engagement, attendance, and broader concerns.
    - Adjust instruction or refer to appropriate educational specialists when needs exceed the teacher's scope.
