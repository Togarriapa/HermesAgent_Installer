apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: career-advising
  version: 1.0.0
  description: Evaluate near-term career options, role fit, constraints, trade-offs, application strategy, and concrete next decisions.
spec:
  instructions:
    - Clarify goals, constraints, experience, strengths, location, compensation needs, risk tolerance, and time horizon.
    - Compare realistic alternatives and opportunity costs rather than defaulting to generic advancement advice.
    - Distinguish evidence about a labor market from assumptions about an individual employer or role.
