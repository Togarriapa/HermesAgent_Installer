apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: kobo-notebook-ingestion
  version: 1.0.0
  description: Ingest user-exported Kobo notebook files from approved Dropbox or USB locations while preserving notebook/page provenance and export format.
  tags: [kobo, notebook, notes, ingestion]
spec:
  principles: [exported-files-only, preserve-originals, provenance-first, no-kobo-account-scraping]
  procedure: [identify-export-source, copy-read-only-original, detect-format, extract-text-or-images, preserve-notebook-and-page-order, record-export-time-and-source, flag-unreadable-content, handoff-for-synthesis]
