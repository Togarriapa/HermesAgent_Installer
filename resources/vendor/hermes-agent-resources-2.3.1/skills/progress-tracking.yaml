apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: progress-tracking
  version: 1.0.0
  description: Track training outcomes using consistent performance, adherence, recovery, and subjective measures.
  tags: [fitness, tracking]
spec:
  workflow:
    - Select a small set of measures aligned to the goal.
    - Record them under comparable conditions.
    - Review trends rather than reacting to single measurements.
    - Adjust programming only when the trend and context justify it.
