apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: home-repair-diagnostics
  version: 1.0.1
  description: "Diagnose household repair problems through safe observation, symptom isolation, measurements, documentation, and escalation before recommending intervention."
  tags: [home, repair, diagnostics, safety]
spec:
  purpose: "Identify likely causes and safe next diagnostic steps without encouraging hazardous, licensed, or destructive work beyond competence and authority."
  procedure:
    - "Identify the system, symptoms, timing, environment, recent changes, maintenance history, utilities involved, and immediate electrical, gas, structural, fire, water, or contamination hazards."
    - "Consult manufacturer information and applicable safety or code context, then inspect non-destructively and collect measurements that discriminate among plausible causes."
    - "Rank hypotheses by evidence and failure consequence, specifying safe tests, isolation requirements, stop conditions, and when a licensed professional is required."
    - "Verify any diagnosis against observed behavior before planning repair, preserve uncertainty, and avoid trial-and-error changes that could worsen damage or safety risk."
  verification:
    - hazards-and-stop-conditions-are-explicit
    - diagnosis-is-supported-by-observation-or-measurement
    - licensed-or-high-risk-work-is-escalated
  sideEffects: none
