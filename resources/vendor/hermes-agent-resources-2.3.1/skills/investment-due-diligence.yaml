apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: investment-due-diligence
  version: 1.0.1
  description: Evaluate investment theses, sources, counterparties, fees, liquidity, governance, incentives, and downside scenarios.
  tags: [investment, due-diligence]
spec:
  purpose: Produce evidence-backed diligence with explicit red flags and unresolved questions.
  procedure:
    - Define the investment claim, structure, legal/economic exposure, counterparties, liquidity terms, fee stack, and source of expected return.
    - Verify material claims against primary documents and independent evidence, distinguishing marketing statements from contractual or audited facts.
    - Examine governance, incentives, conflicts, leverage, concentration, valuation methodology, custody, operational controls, and exit constraints.
    - Build downside and failure scenarios including fraud, illiquidity, counterparty failure, model error, dilution, refinancing stress, and adverse regulation where relevant.
    - Produce a red-flag register, unresolved-question list, and evidence-backed conclusion without converting diligence into execution authority.
  verification:
    - material-claims-have-source-provenance
    - fees-liquidity-conflicts-and-counterparties-are-accounted-for
    - red-flags-and-unresolved-questions-are-explicit
