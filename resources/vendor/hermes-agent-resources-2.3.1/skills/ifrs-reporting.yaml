apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ifrs-reporting
  version: 1.0.0
  description: Analyze financial-reporting questions under IFRS with standard identification, recognition, measurement, presentation, disclosure, and effective-date discipline.
  tags: [accounting, ifrs, reporting]
spec:
  procedure:
    - Confirm that IFRS is the applicable reporting framework and establish the reporting period.
    - Identify the relevant IFRS or IAS requirements and any amendments effective for that period.
    - Analyze recognition, measurement, presentation, disclosure, transition, estimates, and significant judgments.
    - Distinguish authoritative requirements from implementation guidance, practice, and alternative local-GAAP treatment.
