apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: instance-lifecycle-management
  version: 1.0.1
  description: "Manage agent or service instance lifecycle through creation criteria, identity, isolation, dependencies, health, draining, retirement, and audit evidence."
  tags: [instances, lifecycle, operations, orchestration]
spec:
  purpose: "Create and retire instances predictably without leaving orphaned credentials, state, workspaces, routes, or authority."
  procedure:
    - "Define why the instance is needed, owner, workload, resource budget, identity, dependencies, workspace or data roots, network targets, and maximum effective authority."
    - "Provision from a pinned and validated generation with isolated mutable state, runtime-only credentials, observability, health checks, and explicit registration metadata."
    - "Monitor health, work completion, resource use, drift, errors, and dependency state; replace or drain instances through controlled transitions rather than ad hoc mutation."
    - "On retirement, stop new work, preserve required outputs and audit records, revoke or detach credentials and routes, remove temporary state, and verify no orphan dependency remains."
  verification:
    - instance-identity-generation-and-authority-are-recorded
    - lifecycle-transitions-preserve-or-drain-required-state
    - retirement-removes-orphaned-access-and-resources
  sideEffects: none
