apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: professional-translation-portuguese-english
  version: 1.0.0
  description: Perform high-fidelity European Portuguese to English and English to European Portuguese translation with terminology, register, and formatting control.
spec:
  procedure:
    - Preserve meaning, tone, register, terminology, numbers, names, and document structure.
    - Prefer European Portuguese unless the source or user specifies another variety.
    - Flag materially ambiguous source wording instead of silently guessing.
    - Do not represent an unofficial translation as certified/sworn.
