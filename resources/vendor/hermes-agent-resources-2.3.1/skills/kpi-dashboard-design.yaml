apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: kpi-dashboard-design
  version: 1.0.0
  description: Design decision-oriented KPIs, metric definitions, thresholds, dashboard hierarchies, drilldowns, and data-quality indicators.
spec:
  instructions:
    - Define metric owner, formula, grain, source, refresh cadence, target, and interpretation.
    - Avoid vanity metrics and overloaded dashboards.
    - Show data freshness and quality when they affect decisions.
