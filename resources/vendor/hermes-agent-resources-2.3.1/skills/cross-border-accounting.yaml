apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: cross-border-accounting
  version: 1.0.0
  description: Structure cross-border accounting analysis by separating reporting frameworks, statutory ledgers, currencies, jurisdictions, and specialist tax/legal dependencies.
  tags: [accounting, international, cross-border]
spec:
  procedure:
    - Identify every relevant entity, jurisdiction, reporting framework, statutory ledger, currency, and transaction flow.
    - Reconcile group-reporting treatment with local statutory accounting without assuming they are identical.
    - Flag areas involving tax, transfer pricing, customs, legal form, regulated filings, or audit requirements for jurisdiction-specific expertise.
    - Maintain a clear bridge between local accounts, group adjustments, consolidation entries, and reported balances.
