apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: live-wallet-transaction-control
  version: 1.0.0
  description: Construct, simulate, authorize, sign, and reconcile real-value wallet transactions only from a fresh explicit user order, while keeping wallet secrets isolated from agents.
  tags: [crypto, wallet, execution, authorization]
spec:
  procedure:
    - Resolve the exact chain, source account, destination, asset, amount, maximum fee, and contract call data from the explicit user order.
    - Reject unknown networks, ambiguous recipients, wildcard amounts, unrestricted approvals, or actions whose economic effect cannot be explained before signing.
    - Simulate contract calls and estimate fees before requesting confirmation; include expected balance changes and relevant token approvals in the confirmation payload.
    - Require a one-shot fresh confirmation through Hermes immediately before signing.
    - Sign only inside the host wallet boundary; never expose private keys, seed phrases, recovery material, or raw signing credentials to Profiles.
    - Broadcast exactly the confirmed transaction once and reconcile the receipt, status, fees, and resulting balance/state.
    - Treat any follow-on transaction, swap, bridge, approval, staking action, or retry with changed parameters as a new action requiring a new user order and confirmation.
  policy:
    autonomousRealValueAction: deny
    explicitUserOrderRequired: true
    freshConfirmationRequired: true
    secretExport: deny
