apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: failure-analysis
  version: 1.0.0
  description: Investigate mechanical or electromechanical failures using evidence preservation, timelines, load history, fracture or wear patterns, competing hypotheses, and corrective action.
  tags: [engineering, failure, diagnostics]
spec:
  procedure:
    - Preserve evidence and document condition before disassembly or cleanup.
    - Establish timeline, operating conditions, prior maintenance, modifications, loads, environment, and symptoms.
    - Develop competing hypotheses across design, material, manufacturing, assembly, maintenance, misuse, environment, and controls.
    - Seek discriminating evidence and separate root cause, contributing factors, and damage caused after the initiating event.
