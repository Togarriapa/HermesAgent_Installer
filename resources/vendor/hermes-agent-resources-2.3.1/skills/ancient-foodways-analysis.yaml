apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ancient-foodways-analysis
  version: 1.0.1
  description: Analyze ancient food production, preparation, consumption, trade, identity, and diet using archaeological, textual, botanical, faunal, residue, and isotope evidence.
  tags: [ancient, foodways, archaeology, history]
spec:
  purpose: Reconstruct ancient food systems without equating elite recipes or literary stereotypes with population-wide diet.
  procedure:
    - Define region, chronology, social group, and whether the question concerns production, ingredients, preparation, dining, ritual, trade, nutrition, or identity.
    - Assemble plant and animal remains, residues, vessels, installations, isotopes, dental evidence, texts, iconography, prices, transport containers, and environmental data with contextual dating.
    - Evaluate preservation and sampling bias and distinguish prescriptive recipes, elite dining discourse, ritual deposits, market evidence, and ordinary household consumption.
    - Reconstruct ingredient availability, seasonality, processing, fuel and equipment, storage, distribution, social differentiation, and change over time using multiple evidence classes.
    - Present supported patterns and competing interpretations, explicitly separating direct residues or remains from textual analogy and modern culinary reconstruction.
  verification:
    - Dietary claims require evidence appropriate to the population and time period rather than isolated literary references.
    - Experimental reconstructions must be labeled modern hypotheses and must not be treated as proof of exact ancient recipes.
