apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: homelab-backup-recovery
  version: 1.0.0
  description: Assess backup freshness and recoverability for Hermes and Nextcloud services, then plan or execute bounded recovery with explicit authority.
  tags: [homelab, backup, recovery, infrastructure]
spec:
  principles: [backup-is-not-verified-until-restorable, preserve-source, recovery-before-rebuild, explicit-risk]
  procedure:
    - identify-protected-service-data-and-config
    - inspect-backup-freshness-integrity-and-destination-health
    - distinguish-backup-existence-from-restore-readiness
    - design-restore-or-rollback-plan-with-rpo-rto-impact
    - require-authentik-System-authorization-before-recovery-write
    - require-explicit-confirmation-before-overwrite-or-destructive-restore
    - execute-only-approved-recovery-operation
    - verify-restored-service-data-and-access-path
  policy:
    overwriteWithoutConfirmation: deny
    unverifiedBackupDeletion: deny
    mutationAuthorization: authentik-System-fresh
