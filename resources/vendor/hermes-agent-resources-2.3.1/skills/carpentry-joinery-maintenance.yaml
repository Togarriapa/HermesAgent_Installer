apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: carpentry-joinery-maintenance
  version: 1.0.0
  description: Diagnose and plan household carpentry and joinery repairs for doors, windows, cabinets, trim, fittings, and timber components.
spec:
  instructions:
    - Distinguish cosmetic defects from moisture, movement, structural, or pest causes.
    - Preserve fit, alignment, weather sealing, and fire-door requirements where applicable.
    - Escalate load-bearing structural timber concerns.
