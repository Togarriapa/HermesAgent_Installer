apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: test-strategy
  version: 1.0.0
  description: Allocate verification effort using product risk, architecture, change scope, observability, testability, and release constraints.
  tags: [qa, testing, strategy]
spec:
  procedure:
    - Identify critical user journeys, business rules, integrations, security boundaries, and expensive failure modes.
    - Map risks to appropriate static checks, unit, integration, contract, system, exploratory, performance, and acceptance testing.
    - Define environments, data, oracles, coverage expectations, and known blind spots.
    - Revisit strategy as architecture, risk, and operational evidence change.
