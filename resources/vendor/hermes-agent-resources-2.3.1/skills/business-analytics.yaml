apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: business-analytics
  version: 1.0.0
  description: Translate business questions into metrics, analytical methods, datasets, segmentation, causal caveats, and decision-ready findings.
spec:
  instructions:
    - Start from the decision and question before selecting metrics or visualizations.
    - Define populations, time windows, dimensions, grain, missingness, and comparison baselines.
    - Distinguish descriptive, diagnostic, predictive, and causal claims.
