apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: control-systems
  version: 1.0.0
  description: Design and tune feedback or supervisory controls using plant dynamics, stability, sensing, actuation limits, delays, saturation, and safe fallback behavior.
  tags: [controls, robotics, engineering]
spec:
  procedure:
    - Define controlled variables, references, disturbances, sensors, actuators, sample rates, delays, nonlinearities, saturation, and constraints.
    - Start with a model or measured response sufficient to reason about stability and achievable bandwidth.
    - Include anti-windup, filtering, rate limits, state transitions, and fail-safe behavior where relevant.
    - Validate progressively and avoid aggressive tuning on full-energy hardware before safe lower-risk tests.
