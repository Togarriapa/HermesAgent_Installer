apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: small-scale-water-systems
  version: 1.0.0
  description: Plan non-industrial water collection, storage, distribution, irrigation, drainage, and maintenance with potable-water boundaries and contamination controls.
  tags: [water, homestead, infrastructure]
spec:
  procedure:
    - Define source, intended use, demand, storage, elevation, pressure, treatment needs, overflow, drainage, freeze risk, and maintenance.
    - Keep potable and non-potable systems clearly separated and protected from cross-connection or contamination.
    - Account for structural load, tank safety, pump dry-run protection, filtration maintenance, overflow, mosquito control, and local regulation.
    - Escalate drinking-water treatment validation, wells, pressure vessels, or regulated plumbing to competent professionals.
