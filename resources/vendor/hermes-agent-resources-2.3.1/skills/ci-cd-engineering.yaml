apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ci-cd-engineering
  version: 1.0.0
  description: Design CI/CD pipelines with deterministic builds, quality gates, artifact provenance, environment promotion, and controlled deployment.
  tags: [devops, ci, cd, delivery]
spec:
  procedure:
    - Define triggers, build inputs, artifacts, tests, security checks, approvals, environments, and rollback requirements.
    - Build once and promote immutable artifacts where practical.
    - Keep credentials scoped to the minimum stage and environment required.
    - Make failures actionable and prevent unverified artifacts from silently progressing.
