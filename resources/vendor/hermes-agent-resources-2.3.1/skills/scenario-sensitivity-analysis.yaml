apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: scenario-sensitivity-analysis
  version: 1.0.0
  description: Compare decisions across scenarios, sensitivities, uncertainties, thresholds, and downside cases.
spec:
  procedure:
    - Identify decision variables, uncertain inputs, constraints, and outcome metrics.
    - Model base, upside, downside, and stress scenarios where appropriate.
    - Test parameter sensitivity and identify decision-changing thresholds.
    - State assumptions and avoid false precision.
