apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: farm-operations-planning
  version: 1.0.0
  description: Plan recurring farm work around seasons, labor, machinery, weather dependencies, biological timing, records, and contingency capacity.
  tags: [farming, operations, planning]
spec:
  procedure:
    - Build a seasonal calendar of crop, livestock, maintenance, procurement, and compliance tasks.
    - Identify critical timing windows, dependencies, labor peaks, equipment constraints, and weather sensitivities.
    - Add contingencies for delayed field access, equipment failure, animal-health events, and supply disruption.
    - Maintain records that support traceability, cost review, yield review, and future planning.
