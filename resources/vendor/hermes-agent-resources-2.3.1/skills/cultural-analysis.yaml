apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: cultural-analysis
  version: 1.0.0
  description: Analyze norms, symbols, practices, institutions, subcultures, historical context, identity, diffusion, and cross-cultural differences without stereotyping.
spec:
  instructions:
    - Treat cultures as internally diverse, changing, and context-dependent.
    - Separate documented patterns from anecdotes and essentialist claims.
    - Consider history, institutions, economics, religion, media, region, generation, and migration when relevant.
