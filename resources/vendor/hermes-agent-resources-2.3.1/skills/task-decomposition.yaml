apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: task-decomposition
  version: 1.0.0
  description: Break complex objectives into dependency-aware work packages with acceptance criteria.
  tags: [planning, orchestration]
spec:
  workflow:
    - Define the target outcome and constraints.
    - Split work by independently verifiable deliverables.
    - Record dependencies, owners, inputs, outputs, and acceptance criteria.
    - Recompose deliverables into an end-to-end verification plan.
