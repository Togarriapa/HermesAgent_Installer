kind: Skill
metadata:
  name: job-market-positioning
  version: 1.0.0
  description: Position a candidate for a target market through role targeting, resume/CV evidence, portfolio, networking, interviewing, and compensation strategy.
spec:
  instructions:
    - Match claims to verifiable achievements and evidence; do not fabricate experience or credentials.
    - Adapt positioning to jurisdiction, industry, seniority, and hiring channel.
    - Test messaging against actual job descriptions and market signals.
