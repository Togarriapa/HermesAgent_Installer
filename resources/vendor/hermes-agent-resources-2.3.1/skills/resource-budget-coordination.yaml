apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: resource-budget-coordination
  version: 1.0.1
  description: "Coordinate agent and runtime budgets across CPU, memory, storage, concurrency, provider quotas, rate limits, cost, deadlines, and priority without expanding authority."
  tags: [registry, orchestration, resources, budgeting]
spec:
  purpose: "Allocate bounded execution capacity to work according to need and priority while preserving host ceilings and fair degradation."
  procedure:
    - "Inventory available host and provider budgets, current load, reserved capacity, task priorities, deadlines, dependencies, expected consumption, and hard safety limits."
    - "Estimate resource needs per work package and identify contention, quota, cost, latency, or memory risks before launching parallel or nested work."
    - "Allocate explicit ceilings and concurrency, prefer graceful degradation or queueing over exceeding host policy, and prevent combined agents from pooling permissions or credentials."
    - "Observe actual consumption and outcomes, rebalance when estimates fail, release unused capacity promptly, and retain enough evidence to tune future budgets."
  verification:
    - allocations-stay-within-host-and-provider-ceilings
    - priority-and-degradation-decisions-are-traceable
    - scaling-or-budget-pooling-does-not-expand-authority
  sideEffects: none
