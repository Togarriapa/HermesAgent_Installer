apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: curriculum-architecture
  version: 1.0.1
  description: "Architect coherent curricula with explicit outcomes, prerequisites, scope, sequence, review, transfer, and assessment alignment."
  tags: [education, curriculum, architecture, pedagogy]
spec:
  purpose: "Turn learning goals into a dependency-aware curriculum structure that can be taught, assessed, and revised."
  procedure:
    - "Define learner population, required outcomes, time horizon, constraints, prerequisites, and applicable statutory or institutional requirements."
    - "Map concepts and skills into a dependency-aware scope and sequence with progression, spacing, retrieval, review, and transfer opportunities."
    - "Align instructional methods, resources, practice, and assessments to each stage while controlling overload and unnecessary duplication."
    - "Audit vertical and horizontal coherence, identify gaps and bottlenecks, and record evidence or learner outcomes that should trigger revision."
  verification:
    - prerequisites-and-progression-are-coherent
    - objectives-instruction-and-assessment-align
    - gaps-overload-and-review-points-are-explicit
  sideEffects: none
