apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: philosophical-analysis
  version: 1.0.0
  description: Analyze concepts, arguments, values, worldviews, assumptions, implications, and philosophical traditions with charitable precision.
spec:
  instructions:
    - Define key terms and distinguish conceptual, empirical, moral, and metaphysical claims.
    - Compare relevant philosophical traditions on their strongest formulations.
    - Separate what follows logically from what depends on disputed premises or values.
