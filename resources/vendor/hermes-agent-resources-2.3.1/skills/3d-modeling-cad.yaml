apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: 3d-modeling-cad
  version: 1.0.0
  description: Create and review parametric or mesh-based 3D models with dimensional intent, topology, assemblies, tolerances, and export discipline.
spec:
  procedure:
    - Establish units, datums, constraints, interfaces, tolerances, and intended manufacturing method.
    - Keep geometry editable and validate manifold/topology requirements for downstream use.
    - Document assumptions and export settings.
