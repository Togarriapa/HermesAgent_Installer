apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: amish-building-practice-analysis
  version: 1.0.1
  description: Analyze Amish building, construction, workshop, barn, and household practices through regional, historical, material, technological, and community evidence.
  tags: [amish, building, material-culture, history]
spec:
  purpose: Interpret building practice accurately without assuming one construction tradition represents all Amish communities.
  procedure:
    - Define settlement, affiliation, building type, date range, and whether the question concerns design, materials, labor, technology, maintenance, or community building events.
    - Document available physical evidence, photographs, plans, oral histories, trade records, ethnography, and local building context before assigning cultural meaning.
    - Distinguish Ordnung or religious constraints from regional vernacular architecture, code requirements, economics, available materials, craft specialization, and non-Amish trade influence.
    - Compare construction systems, joinery, foundations, envelopes, utilities, workshops, barns, labor organization, and technology choices across relevant communities and periods.
    - Present findings with provenance, regional variation, change over time, and explicit uncertainty where evidence is incomplete or retrospective.
  verification:
    - Technical claims must be consistent with documented materials and construction evidence for the identified place and period.
    - Cultural interpretations must distinguish direct evidence from scholarly inference and avoid universal claims about Amish building practice.
