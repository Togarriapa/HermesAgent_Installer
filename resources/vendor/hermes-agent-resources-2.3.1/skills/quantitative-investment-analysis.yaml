apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: quantitative-investment-analysis
  version: 1.0.1
  description: Quantitative analysis of returns, factors, correlations, drawdowns, regime sensitivity, backtests, and model robustness.
  tags: [quant, investment, statistics]
spec:
  purpose: Require reproducibility, out-of-sample thinking, transaction-cost awareness, and leakage/overfitting controls.
  procedure:
    - Define the hypothesis, investable universe, data vintage, sampling frequency, benchmark, constraints, and evaluation period before inspecting results.
    - Validate data for survivorship, look-ahead, selection, revision, timestamp, corporate-action, and missing-data biases.
    - Separate model fitting, validation, and genuinely out-of-sample testing; control for multiple testing and parameter instability.
    - Include realistic turnover, spreads, market impact, borrow/funding, fees, capacity, and implementation delays in backtests where relevant.
    - Stress regimes, subperiods, alternative specifications, and perturbations, then report effect sizes and uncertainty rather than headline Sharpe or return alone.
  verification:
    - analysis-is-reproducible-from-defined-data-and-parameters
    - leakage-overfitting-and-transaction-cost-controls-are-documented
    - out-of-sample-and-regime-robustness-are-reported
