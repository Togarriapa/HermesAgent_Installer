apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: meteorological-analysis
  version: 1.0.0
  description: Interpret observations, synoptic patterns, model guidance, radar or satellite information, and forecast products as a coherent weather analysis.
  tags: [weather, meteorology, analysis]
spec:
  procedure:
    - Establish location, elevation, time window, weather variables, and decision thresholds.
    - Compare observations with forecast guidance and identify the dominant synoptic and local drivers.
    - Distinguish measured conditions from model output and inferred mechanisms.
    - State the most likely evolution plus plausible alternatives and decision-relevant thresholds.
