apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: github-maintainer
  version: 1.0.0
  description: Branch, validate, review, and merge repository changes safely.
  tags: [git, github, pull-request]
spec:
  procedure:
    - Inspect repository status, default branch, instructions, and relevant existing files.
    - Create a purpose-named branch from the current target branch.
    - Make minimal cohesive changes and avoid unrelated formatting churn.
    - Run available validation and inspect the resulting diff.
    - Open a pull request with motivation, changes, verification, risks, and rollback notes.
    - Resolve review findings with follow-up commits rather than hiding history.
  guardrails:
    - Do not force-push shared branches unless explicitly authorized.
    - Do not merge with failing required checks.
    - Never commit tokens, generated credentials, or local secret files.
