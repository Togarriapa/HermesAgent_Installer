apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: academic-citation
  version: 1.0.0
  description: Maintain traceable scholarly citations and bibliographic integrity.
  tags: [citations, research]
spec:
  workflow:
    - Cite the source that directly supports each material claim.
    - Prefer persistent identifiers and complete bibliographic metadata.
    - Verify author, title, venue, year, and identifier before finalizing.
    - Never invent or silently repair an uncertain citation.
