apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: registry-update-assessment
  version: 1.0.0
  description: Verify and assess an authenticated registry-update notice against the deployed revision before any candidate import or activation.
  tags: [registry, updates, validation, import]
spec:
  principles: [notice-is-not-authority, pin-the-referenced-commit, validate-before-import, preserve-private-overlays, fail-closed]
  procedure:
    - validate-notice-schema-and-repository
    - verify-referenced-commit-exists
    - compare-with-currently-deployed-revision
    - fetch-candidate-by-immutable-commit
    - run-registry-quality-and-materialization-checks
    - classify-resource-version-and-permission-surface-changes
    - test-overlay-rebase-and-runtime-compatibility
    - classify-import-ready-or-quarantine
    - return-assessment-to-hermes
  policy:
    authorityFromNotification: deny
    activateFromNotificationAlone: deny
