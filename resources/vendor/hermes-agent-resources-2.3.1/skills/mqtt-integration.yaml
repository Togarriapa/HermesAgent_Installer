apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: mqtt-integration
  version: 1.0.0
  description: Design and troubleshoot MQTT integrations using topic hierarchy, QoS, retain behavior, availability, discovery, authentication, ACLs, and message observability.
  tags: [mqtt, iot, messaging]
spec:
  procedure:
    - Define broker ownership, clients, topic namespace, payload schema, retained-state semantics, availability, QoS, and discovery behavior.
    - Apply per-client authentication and topic ACLs rather than shared unrestricted credentials.
    - Diagnose with broker logs and observed publish/subscribe traffic while avoiding sensitive payload leakage.
    - Handle stale retained messages, reconnect storms, duplicate delivery, offline devices, and schema changes explicitly.
