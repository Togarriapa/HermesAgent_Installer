apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: browser-performance
  version: 1.0.0
  description: Diagnose and improve frontend loading, rendering, interaction, asset, and runtime performance using measurement before optimization.
  tags: [frontend, performance, web]
spec:
  procedure:
    - Establish user-relevant performance symptoms and measure before changing implementation.
    - Inspect network waterfalls, bundle cost, caching, image/font delivery, rendering, and long tasks.
    - Prioritize improvements by user impact and regression risk.
    - Re-measure after changes and preserve representative performance budgets for critical flows.
