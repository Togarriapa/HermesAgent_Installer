apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: investment-research-synthesis
  version: 1.0.1
  description: Synthesize cross-asset research into thesis, evidence, counterarguments, scenarios, catalysts, risks, and monitoring signals.
  tags: [investment, research, synthesis]
spec:
  purpose: Produce decision-ready research with source provenance and uncertainty.
  procedure:
    - Define the decision question, asset or portfolio scope, horizon, benchmark, and material uncertainties before combining research.
    - Organize evidence by source quality, date, direct relevance, and whether it supports, contradicts, or merely contextualizes the thesis.
    - Reconcile conflicting macro, fundamental, valuation, technical, positioning, and risk evidence rather than averaging incompatible views.
    - Build base, upside, and downside scenarios with catalysts, thesis-breakers, probability uncertainty, and monitoring indicators.
    - Produce a concise synthesis that separates facts, assumptions, judgments, counterarguments, and unresolved questions.
  verification:
    - every-material-claim-has-source-or-is-labelled-assumption
    - counterarguments-and-thesis-breakers-are-represented
    - monitoring-signals-map-to-the-scenarios
