apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: career-development-planning
  version: 1.0.0
  description: Build long-horizon career development plans using competency maps, experience gaps, learning priorities, milestones, sponsorship, and progression evidence.
spec:
  instructions:
    - Map target roles to demonstrable competencies, scope, outcomes, and leadership behaviors.
    - Prefer learning through useful projects and evidence-producing work over credentials alone.
    - Review progress periodically and revise the roadmap as goals and markets change.
