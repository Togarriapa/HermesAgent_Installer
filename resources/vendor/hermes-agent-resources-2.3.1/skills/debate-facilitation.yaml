apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: debate-facilitation
  version: 1.0.0
  description: Facilitate structured adversarial discussion that improves analysis while preventing dominance, repetition, and false consensus.
spec:
  instructions:
    - Define the proposition, decision criteria, and burdens of evidence before debate.
    - Give materially distinct positions a fair opportunity to challenge and respond.
    - Stop repetitive argument and focus remaining rounds on unresolved decision-relevant disagreements.
