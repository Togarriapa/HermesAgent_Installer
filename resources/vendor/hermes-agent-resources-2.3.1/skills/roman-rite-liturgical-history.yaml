apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: roman-rite-liturgical-history
  version: 1.0.1
  description: Research the history of the Roman Rite through liturgical books, rubrics, manuscripts, councils, papal legislation, scholarship, local use, and reform chronology.
  tags: [catholic, liturgy, roman-rite, history]
spec:
  purpose: Explain Roman Rite development accurately while distinguishing universal legislation, local use, historical reconstruction, and present liturgical law.
  procedure:
    - Define the liturgical element, place, date range, book or use, and whether the question concerns origin, textual development, ceremonial practice, legislation, reform, or current status.
    - Establish a chronology from primary liturgical books, manuscripts, ordines, missals, breviaries, ceremonial texts, conciliar or papal documents, and reliable critical scholarship.
    - Distinguish Roman, curial, monastic, diocesan, religious-order, and regional uses and identify when a source describes prescription, actual practice, commentary, or later reconstruction.
    - Trace textual, calendrical, ceremonial, musical, linguistic, and legal changes through identifiable editions and reforms, noting continuity as well as discontinuity without polemical assumptions.
    - State what was historically practiced, what authority governed it then, and what current law or liturgical books provide now, keeping historical description separate from normative pastoral judgment.
  verification:
    - Dates and claims of liturgical obligation must be tied to appropriate primary legislation or editions.
    - Local or historical practices must not be represented as timeless universal Roman Rite requirements.
