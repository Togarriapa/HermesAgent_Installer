apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: technical-documentation
  version: 1.0.0
  description: Produce maintainable technical documentation for architecture, operation, decisions, interfaces, and recovery.
  tags: [documentation, engineering]
spec:
  workflow:
    - Identify the reader and operational question the document must answer.
    - Record assumptions, prerequisites, architecture, interfaces, and failure handling.
    - Include verification and rollback or recovery where relevant.
    - Keep volatile configuration separate from durable concepts.
