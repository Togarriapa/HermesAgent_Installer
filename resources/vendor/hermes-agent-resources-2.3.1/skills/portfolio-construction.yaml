apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: portfolio-construction
  version: 1.0.1
  description: Construct diversified portfolios from objectives, constraints, asset classes, correlations, liquidity, and implementation risks.
  tags: [portfolio, allocation, investment]
spec:
  purpose: Produce transparent portfolio structures and trade-off analysis without executing transactions.
  procedure:
    - Translate objectives, horizon, liquidity, liabilities, risk tolerance, currency, tax/legal constraints, and implementation limits into portfolio requirements.
    - Define the opportunity set and estimate the role, expected return range, risk, correlation, liquidity, and downside behavior of each exposure.
    - Construct candidate portfolios using diversification, concentration limits, risk budgets, scenario analysis, and robust rather than point-estimate optimization.
    - Compare candidates on drawdown, liquidity, factor concentration, turnover, costs, currency, tail risk, and sensitivity to estimation error.
    - Document allocation ranges, trade-offs, and review triggers while leaving all transaction execution to separately authorized systems or professionals.
  verification:
    - portfolio-weights-and-constraints-reconcile
    - concentration-liquidity-and-stress-risks-are-explicit
    - construction-does-not-imply-execution-authority
