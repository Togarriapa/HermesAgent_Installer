apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: outcome-metrics
  version: 1.0.1
  description: "Design outcome metrics with clear constructs, units, populations, baselines, guardrails, attribution limits, data quality, and anti-gaming checks."
  tags: [metrics, outcomes, measurement, management]
spec:
  purpose: "Measure whether the intended result changed rather than substituting activity, output volume, or easily gamed proxies."
  procedure:
    - "Define the decision or objective, target population, desired outcome, time horizon, baseline, causal assumptions, and unacceptable side effects."
    - "Choose primary outcome and guardrail metrics with precise definitions, units, inclusion rules, data sources, latency, and known attribution limitations."
    - "Test validity, reliability, sensitivity, missingness, segmentation, and gaming incentives; pair leading signals with lagging outcomes where useful."
    - "Set interpretation and review rules before observing results, then investigate metric movement with supporting evidence rather than assuming causality."
  verification:
    - metric-definitions-and-populations-are-unambiguous
    - guardrails-data-quality-and-gaming-risk-are-checked
    - causal-claims-do-not-exceed-the-evidence
  sideEffects: none
