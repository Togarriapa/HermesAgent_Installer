apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: primary-source-analysis
  version: 1.0.0
  description: Evaluate primary sources for authorship, audience, purpose, provenance, context, limitations, and corroboration.
  tags: [history, sources]
spec:
  workflow:
    - Identify creator, date, place, audience, genre, and provenance.
    - Ask what purpose and constraints shaped the source.
    - Distinguish what the source demonstrates from what it merely claims.
    - Corroborate with independent evidence where possible.
