apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: assessment-design
  version: 1.0.1
  description: "Design valid, fair, actionable formative and summative assessments aligned to intended learning outcomes and learner context."
  tags: [education, assessment, curriculum, validity, fairness]
spec:
  purpose: "Produce assessment evidence that supports a defined learning decision rather than merely generating scores."
  procedure:
    - "Define the learning outcomes, learner level, assessment purpose, and decisions the assessment must support."
    - "Select task types and scoring criteria that sample the intended construct while minimizing construct-irrelevant difficulty."
    - "Check fairness, accessibility, age appropriateness, rubric or answer-key quality, and the balance of formative versus summative evidence."
    - "Pilot or review results for ambiguity and bias, then revise items, thresholds, feedback, and follow-up instruction from observed evidence."
  verification:
    - every-material-item-maps-to-an-intended-outcome
    - scoring-rules-are-consistent-and-reviewable
    - fairness-accessibility-and-feedback-quality-are-checked
  sideEffects: none
