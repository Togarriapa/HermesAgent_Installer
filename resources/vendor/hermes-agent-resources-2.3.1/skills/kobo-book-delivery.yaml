apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: kobo-book-delivery
  version: 1.0.0
  description: Stage a validated non-DRM EPUB or PDF to a supported Kobo delivery path only after an explicit user request.
  tags: [kobo, ebook, delivery, dropbox, google-drive, usb]
spec:
  principles: [explicit-user-order, capability-detect-device, validate-before-copy, no-drm-removal, no-silent-overwrite]
  procedure: [confirm-device-and-delivery-mode, verify-supported-output, verify-file-integrity, select-official-cloud-folder-or-usb, check-name-conflict, request-confirmation-if-overwrite, copy-or-upload, verify-provider-or-filesystem-result, tell-hermes-sync-or-disconnect-step]
