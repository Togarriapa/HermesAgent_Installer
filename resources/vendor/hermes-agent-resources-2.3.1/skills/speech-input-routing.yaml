apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: speech-input-routing
  version: 1.0.1
  description: "Route spoken input through authenticated Hermes sessions with transcription confidence, privacy limits, ambiguity handling, and unchanged authorization semantics."
  tags: [voice, speech, routing, privacy, hermes]
spec:
  purpose: "Make voice an input modality without turning speech recognition or device proximity into authority."
  procedure:
    - "Establish the authenticated session, input source, language, privacy context, and the maximum authority the corresponding typed request could exercise."
    - "Transcribe and normalize speech with confidence tracking, preserving alternatives or uncertainty when words materially affect intent, identity, recipient, amount, target, or side effect."
    - "Route the interpreted request only through Hermes and require the same authorization, confirmation, safety, and tool policies that apply to equivalent typed input."
    - "Verify routed intent and delivery state, minimize retained audio or transcript data, and request clarification when ambiguity could materially alter an action."
  verification:
    - spoken-input-is-bound-to-an-authenticated-hermes-session
    - low-confidence-material-ambiguity-is-not-silently-resolved
    - voice-input-never-expands-authority
  sideEffects: none
