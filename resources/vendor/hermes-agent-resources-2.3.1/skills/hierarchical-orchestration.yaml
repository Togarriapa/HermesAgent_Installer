apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: hierarchical-orchestration
  version: 1.0.1
  description: "Orchestrate nested agent teams through explicit work decomposition, delegated context, dependency management, bounded authority, reconciliation, and lifecycle release."
  tags: [agents, orchestration, hierarchy, coordination]
spec:
  purpose: "Use hierarchy only where it reduces coordination complexity while preserving Hermes routing and non-expanding authority."
  procedure:
    - "Decompose the objective into bounded work packages with inputs, outputs, dependencies, acceptance criteria, authority, and required specialist domains."
    - "Create hierarchy only where a subproblem benefits from local coordination; pass minimum necessary context and explicit ceilings to each leader or nested team."
    - "Require subordinate recruitment and tool use to remain within inherited host and session authority, with no privilege pooling from multiple Profiles or Bundles."
    - "Reconcile nested outputs against evidence and dependency contracts, surface conflicts and dissent, and release temporary hierarchy when the task is complete."
  verification:
    - hierarchy-reflects-real-dependency-or-coordination-needs
    - nested-teams-do-not-expand-authority
    - final-reconciliation-covers-all-work-packages
  sideEffects: none
