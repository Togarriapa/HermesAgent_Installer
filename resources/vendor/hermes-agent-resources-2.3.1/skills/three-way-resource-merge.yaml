apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: three-way-resource-merge
  version: 1.0.1
  description: "Three-way merge registry resource evolution using base, local, and upstream state with semantic conflict classification, authority checks, overlay preservation, and rollback."
  tags: [registry, merge, evolution, versioning]
spec:
  purpose: "Reconcile concurrent resource changes without silently losing local intent or accepting incompatible upstream behavior."
  procedure:
    - "Identify exact base, local, and upstream resource generations plus effective policies, dependencies, provenance, private or learned overlays, and intended changes on each side."
    - "Compute structural and semantic differences, separating independent additions from conflicts in method, capability, authority, selectors, integrations, versions, and safety boundaries."
    - "Auto-merge only demonstrably nonconflicting changes; preserve unresolved semantic conflicts for explicit reconciliation and reject any authority expansion that lacks separate approval."
    - "Materialize the merged candidate, run dependencies and regressions, verify overlays and permissions, record conflict decisions, and retain all parent generations for rollback."
  verification:
    - base-local-and-upstream-provenance-is-known
    - semantic-conflicts-are-not-silently-overwritten
    - merged-effective-authority-is-not-expanded-by-accident
  sideEffects: none
