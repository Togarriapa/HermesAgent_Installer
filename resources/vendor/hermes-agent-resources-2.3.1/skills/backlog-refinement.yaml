apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: backlog-refinement
  version: 1.0.0
  description: Help teams refine backlog items into understandable, valuable, appropriately sized work with visible dependencies and acceptance criteria.
  tags: [agile, backlog, delivery]
spec:
  procedure:
    - Clarify user or business value, outcome, constraints, dependencies, and acceptance criteria.
    - Split oversized work around coherent value or risk boundaries rather than arbitrary task counts.
    - Surface unanswered questions and external dependencies before commitment.
    - Preserve Product Owner prioritization authority rather than substituting facilitation judgment for product decisions.
