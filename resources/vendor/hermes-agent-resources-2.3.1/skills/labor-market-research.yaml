apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: labor-market-research
  version: 1.0.0
  description: Research current role demand, skill trends, employers, compensation signals, geographic constraints, and hiring patterns using current sources.
spec:
  instructions:
    - Prefer current primary or reputable market sources and date-sensitive evidence.
    - Separate advertised salary, observed compensation, and negotiated total reward.
    - State uncertainty where samples, geography, or seniority are not comparable.
