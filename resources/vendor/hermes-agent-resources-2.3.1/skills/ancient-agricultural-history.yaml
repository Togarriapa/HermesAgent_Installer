apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ancient-agricultural-history
  version: 1.0.1
  description: Reconstruct ancient agricultural systems using textual, archaeobotanical, zooarchaeological, environmental, technological, and economic evidence.
  tags: [ancient, agriculture, history, archaeology]
spec:
  purpose: Explain agricultural production and change without treating prescriptive texts as direct descriptions of everyday practice.
  procedure:
    - Define region, chronology, political context, environmental setting, and the production system or crop, livestock, land, labor, or technology question under study.
    - Assemble literary and documentary texts together with archaeobotanical, zooarchaeological, pollen, isotope, landscape, tool, storage, and settlement evidence and record each source's dating and context.
    - Distinguish normative agronomic writing, elite estate practice, taxation records, subsistence evidence, market production, and archaeological inference rather than combining them uncritically.
    - Analyze seasonality, labor, land tenure, water management, soil constraints, crop and herd choices, storage, transport, risk, and political-economic pressures across the relevant period.
    - Reconcile conflicting evidence and present ranges or competing interpretations where yields, population, climate effects, or institutional control cannot be established precisely.
  verification:
    - Major claims must identify both evidence type and chronological/geographic applicability.
    - Quantitative reconstructions must state assumptions and uncertainty rather than presenting model outputs as direct observations.
