apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: impediment-management
  version: 1.0.0
  description: Identify, prioritize, assign, escalate, and follow through on impediments that constrain team delivery or learning.
  tags: [agile, scrum, impediments]
spec:
  procedure:
    - Distinguish normal work difficulty from systemic or external impediments.
    - Record impact, owner, next action, dependency, and escalation path.
    - Remove or escalate constraints without taking over work the team can resolve itself.
    - Review recurring impediments for systemic corrective action.
