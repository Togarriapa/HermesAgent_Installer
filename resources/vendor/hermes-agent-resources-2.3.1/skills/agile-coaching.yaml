apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: agile-coaching
  version: 1.0.0
  description: Coach teams and leaders on empirical delivery, collaboration, product feedback, flow, and process ownership without creating methodology dependency.
  tags: [agile, coaching, teams]
spec:
  procedure:
    - Diagnose the team's actual constraints before recommending process interventions.
    - Help participants understand tradeoffs and make their own explicit working agreements.
    - Use observation, questions, teaching, facilitation, and experiments according to the situation.
    - Reduce coaching dependency as the team develops its own improvement capability.
