apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: family-learning-routines
  version: 1.0.1
  description: "Design sustainable family learning routines that balance consistency, autonomy, developmental needs, household constraints, and evidence of progress."
  tags: [education, family, routines, learning]
spec:
  purpose: "Create repeatable learning rhythms that support goals without turning family life into continuous assessment or coercion."
  procedure:
    - "Clarify family goals, learner ages, existing commitments, available spaces and materials, preferred rhythms, and known stress or support needs."
    - "Design short predictable routines for instruction, independent work, reading, practice, review, and recovery with clear cues and realistic duration."
    - "Build learner choice and age-appropriate responsibility into the routine while keeping safeguarding, sleep, meals, movement, and family relationships protected."
    - "Review participation and learning evidence periodically, simplify routines that create friction without benefit, and adapt rather than escalating pressure."
  verification:
    - routine-is-feasible-with-household-constraints
    - learning-purpose-and-learner-agency-are-preserved
    - review-uses-progress-and-wellbeing-evidence
  sideEffects: none
