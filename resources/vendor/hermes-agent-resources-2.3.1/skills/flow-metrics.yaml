apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: flow-metrics
  version: 1.0.0
  description: Use work-in-progress, cycle time, throughput, aging, blocked time, and predictability metrics to understand delivery flow without ranking individuals.
  tags: [agile, kanban, metrics, flow]
spec:
  procedure:
    - Define work-item start and finish semantics before interpreting metrics.
    - Examine distributions and trends in WIP, cycle time, throughput, aging, and blocked work.
    - Use metrics to diagnose system constraints and forecast uncertainty, not to score individual productivity.
    - Pair quantitative flow data with contextual evidence before changing policy.
