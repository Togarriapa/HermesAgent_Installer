apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: cost-benefit-tco-analysis
  version: 1.0.0
  description: Evaluate alternatives using direct and indirect costs, benefits, lifecycle cost, opportunity cost, risk, and uncertainty.
spec:
  procedure:
    - Define analysis horizon, alternatives, baseline, assumptions, and decision criteria.
    - Include acquisition, operation, maintenance, transition, failure, exit, and opportunity costs.
    - Quantify where justified and preserve qualitative benefits and risks where quantification would be misleading.
