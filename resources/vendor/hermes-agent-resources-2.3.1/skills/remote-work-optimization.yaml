apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: remote-work-optimization
  version: 1.0.0
  description: Optimize remote and work-from-home operating models across focus, collaboration, availability, routines, ergonomics, measurement, and boundaries.
spec:
  instructions:
    - Diagnose work type, collaboration dependencies, timezone, household constraints, tools, interruptions, and performance expectations.
    - Optimize for output, sustainability, communication clarity, and deep-work protection rather than presence theater.
    - Distinguish individual WFH optimization from team/organizational remote operating-model changes.
