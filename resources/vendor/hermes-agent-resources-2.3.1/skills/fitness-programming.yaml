apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: fitness-programming
  version: 1.0.0
  description: Build general exercise programs using goal-specific volume, intensity, frequency, recovery, and progression.
  tags: [fitness, programming]
spec:
  workflow:
    - Establish goal, training age, schedule, equipment, and recovery constraints.
    - Select movement patterns and conditioning appropriate to the goal.
    - Set conservative starting volume and intensity.
    - Progress one variable at a time based on performance and recovery.
