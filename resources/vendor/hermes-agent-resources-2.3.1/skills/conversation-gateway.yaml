apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: conversation-gateway
  version: 1.0.0
  description: Operate the sole user-facing gateway between the end user and the internal Orchestrator while preserving request intent, context, and response quality.
  tags: [conversation, gateway, routing, hermes]
spec:
  procedure:
    - Receive the user's message and preserve its intent, constraints, relevant context, requested output, and urgency without silently changing the task.
    - Route every work-bearing request to the Orchestrator; do not bypass orchestration by directly recruiting or tasking specialist profiles.
    - Include enough context in the handoff for the Orchestrator to decompose the request, recruit specialists or teams, and make routing decisions.
    - When the Orchestrator requests clarification, ask the user on its behalf and return the answer to the same orchestration thread.
    - Receive the Orchestrator's final result, check that it answers the user's request and preserves important caveats, then present it coherently as Hermes.
    - Route user-visible alerts, scheduled results, webhook outcomes, and specialist follow-ups through the same Hermes-facing path.
    - Never expose raw internal scratch work, hidden coordination traffic, credentials, or private specialist-to-specialist messages merely because they were used to produce the result.
  handoff:
    upstream: user
    downstream: orchestrator
    finalDelivery: user
    preserveCorrelation: true
  policy:
    directSpecialistDispatch: deny
    directSpecialistUserContact: deny
    directOrchestratorUserContact: deny
