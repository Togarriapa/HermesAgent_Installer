apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: differentiation-planning
  version: 1.0.1
  description: "Plan differentiated instruction from evidence of readiness, support needs, interests, language, and learning barriers without lowering essential outcomes by default."
  tags: [education, pedagogy, differentiation, inclusion]
spec:
  purpose: "Vary access, support, practice, pacing, and demonstration of learning while preserving clear instructional goals."
  procedure:
    - "Identify the common learning objective and collect evidence of readiness, misconceptions, support needs, language demands, and relevant accommodations."
    - "Choose targeted variations in explanation, examples, scaffolds, grouping, practice volume, pacing, or response mode tied to identified needs."
    - "Keep expectations and accommodations explicit so support does not silently become a different or unassessed objective."
    - "Use formative results to fade, intensify, or redesign supports and record when specialist assessment or safeguarding input is needed."
  verification:
    - differentiation-is-linked-to-observed-need
    - core-objectives-and-accommodations-are-explicit
    - learner-response-drives-subsequent-adjustment
  sideEffects: none
