apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: embedded-systems-development
  version: 1.0.0
  description: Develop embedded firmware with explicit timing, interfaces, state machines, watchdogs, resource limits, diagnostics, and hardware-aware testing.
  tags: [embedded, firmware, robotics]
spec:
  procedure:
    - Define processor, memory, timing, I/O, buses, power modes, boot behavior, update path, and failure response.
    - Use explicit state machines and bounded timing for safety- or sequence-sensitive behavior.
    - Add watchdogs, brownout handling, input validation, logging, test points, and recoverable update behavior as appropriate.
    - Test hardware interfaces under nominal, limit, disconnected, noisy, and restart conditions.
