apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: data-visualization
  version: 1.0.0
  description: Design truthful, readable visualizations matched to the analytical question and audience.
  tags: [data, visualization, communication]
spec:
  procedure:
    - Choose encodings that match comparison, distribution, relationship, composition, temporal, or spatial questions.
    - Use scales, baselines, aggregation, labeling, and uncertainty representations that do not distort interpretation.
    - Reduce decorative complexity and emphasize the evidence necessary for the decision.
    - Pair visual summaries with definitions, units, filters, caveats, and source information where needed.
