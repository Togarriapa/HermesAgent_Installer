apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: container-deployment-operations
  version: 1.0.0
  description: Deploy and operate containerized services with immutable images, health checks, resource controls, safe configuration, and rollback.
  tags: [containers, devops, deployment]
spec:
  procedure:
    - Define image provenance, runtime configuration, secrets, health checks, resources, networking, persistence, and dependencies.
    - Avoid mutable container state for data that must survive replacement.
    - Roll deployments using health evidence and a known rollback target.
    - Diagnose at image, runtime, network, storage, and application layers before destructive remediation.
