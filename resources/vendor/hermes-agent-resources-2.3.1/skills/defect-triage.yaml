apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: defect-triage
  version: 1.0.0
  description: Reproduce, classify, prioritize, and route software defects using user impact, severity, frequency, scope, evidence, and release context.
  tags: [qa, defects, triage]
spec:
  procedure:
    - Reproduce with the smallest useful case and capture environment, inputs, expected behavior, actual behavior, and evidence.
    - Separate severity, business priority, occurrence frequency, and suspected cause.
    - Identify affected versions or surfaces and route ownership without prematurely asserting root cause.
    - Retest the fix and relevant regression surface before closure.
