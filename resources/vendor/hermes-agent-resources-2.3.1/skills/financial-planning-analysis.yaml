apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: financial-planning-analysis
  version: 1.0.1
  description: "Perform financial planning and analysis with source reconciliation, driver models, scenarios, variance explanations, and decision-focused outputs."
  tags: [finance, fp-and-a, planning, analysis]
spec:
  purpose: "Translate financial and operational evidence into planning insight without substituting model output for execution authority."
  procedure:
    - "Define the management question, entities, period, accounting basis, currencies, materiality threshold, and operational drivers that should explain results."
    - "Reconcile source financial data and construct transparent driver-based models with assumptions separated from observed historical values."
    - "Analyze actual-versus-plan and scenario variance by price, volume, mix, timing, productivity, headcount, capital, financing, or other causal drivers relevant to the case."
    - "Present decision-relevant ranges, sensitivities, risks, and follow-up measurements, with calculations reproducible and no implicit authority to transact or book entries."
  verification:
    - source-data-reconciles-to-analysis
    - drivers-and-assumptions-explain-material-variance
    - calculations-are-reproducible-and-non-executing
  sideEffects: none
