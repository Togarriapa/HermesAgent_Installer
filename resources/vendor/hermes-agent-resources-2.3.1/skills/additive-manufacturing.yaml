apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: additive-manufacturing
  version: 1.0.0
  description: Plan FDM/resin additive manufacturing with material, orientation, supports, slicing, calibration, post-processing, and printer-safety considerations.
spec:
  procedure:
    - Match process and material to mechanical, thermal, chemical, aesthetic, and dimensional requirements.
    - Plan orientation, supports, layer strategy, tolerances, infill/walls, and post-processing.
    - Treat resin, fumes, heat, motion, and electrical hazards according to manufacturer guidance.
