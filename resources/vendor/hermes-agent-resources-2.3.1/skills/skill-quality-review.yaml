apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: skill-quality-review
  version: 1.0.1
  description: "Review Skills for distinct purpose, substantive direct method, evidence handling, verification, failure modes, outputs, side effects, overlap, and domain safety."
  tags: [registry, skills, quality, review]
spec:
  purpose: "Determine whether a Skill is sufficiently specific and reusable to justify its place in the registry."
  procedure:
    - "Inspect the declared Skill plus inherited and overlay policy, dependencies, consumers, tags, version, history, and representative tasks it is expected to solve."
    - "Evaluate whether direct method content is operational and domain-specific rather than a description or token principles list, and whether effective evidence, verification, failure, output, and side-effect contracts are complete."
    - "Check overlap and contradictions with neighboring Skills, authority expansion, regulated or safety boundaries, stale assumptions, selector effects, and whether examples or procedures can actually be verified."
    - "Classify the Skill as pass, refine, merge, split, deprecate, or retire with concrete findings, regression cases, semver impact, and acceptance criteria for remediation."
  verification:
    - direct-method-is-substantive-and-domain-specific
    - effective-contract-and-safety-overlays-are-complete
    - disposition-is-backed-by-specific-auditable-findings
  sideEffects: none
