apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: cooking-techniques
  version: 1.0.0
  description: Select and explain appropriate preparation, heat, seasoning, texture, timing, and doneness techniques for home cooking.
  tags: [cooking, technique, kitchen]
spec:
  procedure:
    - Identify ingredient properties, desired texture, equipment, portion size, and service timing.
    - Choose preparation and heat methods that suit the ingredient and target result.
    - Sequence seasoning, browning, moisture control, resting, and finishing deliberately.
    - Offer practical substitutions while explaining material effects on texture, flavor, or timing.
