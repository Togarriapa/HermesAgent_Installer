apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: homelab-host-operations
  version: 1.0.0
  description: Diagnose and perform bounded operational maintenance on the approved Hermes and Nextcloud hosts without exposing raw shell or unrestricted SSH.
  tags: [homelab, infrastructure, linux, operations]
spec:
  principles: [inspect-before-change, bounded-operations, smallest-reversible-change, verify-after-write, rollback-ready]
  procedure:
    - identify-approved-target-host-and-service
    - gather-health-resource-service-container-and-bounded-log-evidence
    - separate-host-failure-from-network-provider-or-application-failure
    - require-authentik-System-authorization-before-any-write
    - build-change-and-rollback-plan
    - execute-only-an-allowlisted-operation
    - verify-service-health-and-observable-user-impact
    - record-change-and-rollback-result
  policy:
    rawSsh: deny
    arbitraryShell: deny
    unrestrictedPackageExecution: deny
    mutationAuthorization: authentik-System-fresh
