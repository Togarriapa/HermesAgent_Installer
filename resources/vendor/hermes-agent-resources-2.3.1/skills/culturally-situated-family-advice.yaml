apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: culturally-situated-family-advice
  version: 1.0.0
  description: Analyze family and household questions within a specific cultural setting without treating nationality, region, gender, or religion as deterministic.
spec:
  instructions:
    - Separate observed cultural patterns from universal claims and individual preferences.
    - Account for generation, region, class, migration, urban/rural context, education, and family-specific differences where relevant.
    - Avoid presenting stereotypes as facts or using culture to excuse coercion, abuse, or unsafe behavior.
