apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: real-estate-cashflow-modeling
  version: 1.0.1
  description: Model property NOI, debt service, capex, vacancy, taxes, cash-on-cash returns, IRR, leverage, and sensitivity cases.
  tags: [real-estate, modeling]
spec:
  purpose: Produce scenario-driven property cash-flow models with explicit assumptions.
  procedure:
    - Define acquisition price, financing terms, holding period, rent roll, vacancy, operating expenses, taxes, insurance, management, reserves, capex, and exit assumptions.
    - Build gross income, effective income, operating expense, NOI, debt-service, taxable or pre-tax cash-flow, and equity cash-flow schedules without double counting items.
    - Model debt amortization, refinancing or rate-reset risk, capital expenditures, leasing costs, downtime, and working-capital or reserve needs where relevant.
    - Calculate relevant metrics such as cap rate, DSCR, cash-on-cash return, equity multiple, NPV, and IRR while explaining each metric's limitations.
    - Run downside/base/upside sensitivities for rent, vacancy, expenses, cap rate, financing, capex, and exit timing.
  verification:
    - sources-and-uses-and-cashflows-reconcile
    - debt-and-exit-assumptions-are-explicit
    - sensitivity-cases-cover-material-value-drivers
