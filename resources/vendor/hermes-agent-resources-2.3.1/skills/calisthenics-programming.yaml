apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: calisthenics-programming
  version: 1.0.1
  description: Design progressive calisthenics training using movement prerequisites, skill progressions, volume, intensity, recovery, technique, and measurable progression.
  tags: [fitness, calisthenics, programming, training]
spec:
  purpose: Build adaptable bodyweight training plans that prioritize technique, recoverability, and progressive overload rather than novelty.
  procedure:
    - Establish current training age, movement competency, available equipment, schedule, recovery capacity, goals, pain or movement limitations, and objective baseline tests before selecting progressions.
    - Choose push, pull, squat or leg, hinge or posterior-chain, trunk, locomotion, and goal-specific skill patterns and place each athlete at a progression they can perform with controlled technique.
    - Program weekly frequency, sets, repetitions or holds, proximity to failure, tempo, range of motion, skill practice, and rest so total stress is appropriate for the trainee and goal.
    - Progress by increasing quality, range, leverage, repetitions, load, density, or complexity one variable at a time and deload or regress when technique, recovery, or joint tolerance deteriorates.
    - Reassess performance and recovery on a fixed cadence and update the plan from measured trends rather than a single good or bad session.
  verification:
    - Progressions must have explicit entry and exit criteria and preserve pain-free controlled technique.
    - Persistent or concerning pain, neurologic symptoms, or unexplained performance decline must trigger appropriate clinical evaluation rather than training escalation.
