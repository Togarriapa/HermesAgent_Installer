apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: reflective-review
  version: 1.0.0
  description: Conduct structured reviews of goals, habits, decisions, and lessons without turning reflection into rumination.
  tags: [reflection, coaching]
spec:
  workflow:
    - Compare intended outcomes with observable results.
    - Identify what helped, what hindered, and what was outside control.
    - Extract one or two actionable lessons.
    - Choose the next experiment or adjustment.
