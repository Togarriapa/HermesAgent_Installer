apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: observability-engineering
  version: 1.0.0
  description: Design logs, metrics, traces, health signals, dashboards, and alerts around service behavior and operational decisions.
  tags: [observability, devops, operations]
spec:
  procedure:
    - Start from important service behavior, user impact, and operator decisions rather than collecting telemetry indiscriminately.
    - Define useful logs, metrics, traces, health checks, and correlation identifiers.
    - Alert on actionable symptoms with ownership and runbook context while controlling noise.
    - Preserve enough telemetry to distinguish dependency, capacity, deployment, and application failures.
