apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: threat-modeling
  version: 1.0.0
  description: Identify assets, trust boundaries, threat actors, abuse paths, controls, and residual risk for authorized systems.
  tags: [security, architecture]
spec:
  workflow:
    - Inventory assets, identities, entry points, data flows, and trust boundaries.
    - Enumerate plausible misuse and failure scenarios.
    - Map preventive, detective, and recovery controls.
    - Prioritize mitigations by impact, likelihood, exposure, and cost.
