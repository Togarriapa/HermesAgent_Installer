apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: dissent-analysis
  version: 1.0.0
  description: Preserve, evaluate, and explain material opinions that oppose the final recommendation or solution.
spec:
  instructions:
    - Record the strongest materially supported alternative positions rather than every minor disagreement.
    - Explain why each dissenting position did not become the final recommendation.
    - Surface dissent that would change the answer if a key assumption changes.
    - State no material dissent when appropriate instead of inventing opposition.
