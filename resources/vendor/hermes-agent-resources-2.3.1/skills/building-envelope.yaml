apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: building-envelope
  version: 1.0.0
  description: Reason about roofs, walls, windows, doors, insulation, air leakage, vapor behavior, drainage, moisture, and thermal performance as one enclosure system.
  tags: [building, moisture, energy, home]
spec:
  procedure:
    - Trace rain, bulk water, air, vapor, and heat paths through the assembly and local climate.
    - Identify drainage planes, flashing, penetrations, capillary breaks, air barriers, insulation continuity, and drying potential.
    - Avoid isolated insulation or sealing changes that create condensation, trapped moisture, combustion-air, or ventilation problems.
    - Verify details against applicable building practice and local climate requirements.
