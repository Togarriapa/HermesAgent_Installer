apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: wealth-planning
  version: 1.0.1
  description: Coordinate long-horizon wealth objectives, liquidity, investment policy, tax/legal dependencies, and intergenerational planning considerations.
  tags: [wealth, planning]
spec:
  purpose: Integrate planning domains while routing tax, legal, estate, and regulated matters to qualified specialists.
  procedure:
    - Map household or entity goals, horizons, liquidity needs, income sources, liabilities, concentrated assets, dependants, currencies, jurisdictions, and governance constraints.
    - Separate emergency/near-term liquidity, lifestyle funding, long-horizon investment capital, business or property concentration, and intergenerational objectives.
    - Coordinate investment policy, cash-flow planning, risk management, insurance dependencies, tax considerations, estate/succession issues, and charitable or family-governance goals without collapsing them into one recommendation.
    - Model base and adverse scenarios for longevity, inflation, market drawdowns, income disruption, major spending, liquidity events, and concentration risk.
    - Produce an integrated action map showing which items are analytical, which need legal/tax/estate or regulated professional advice, and which require periodic review.
  verification:
    - goals-assets-liabilities-and-liquidity-needs-are-reconciled
    - cross-domain-dependencies-and-concentration-risks-are-explicit
    - regulated-legal-tax-and-estate-items-are-routed-to-qualified-specialists
