apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: goal-setting
  version: 1.0.0
  description: Translate aspirations into prioritized, observable goals with next actions and review criteria.
  tags: [goals, coaching]
spec:
  workflow:
    - Clarify why the outcome matters and what success looks like.
    - Define an observable target and realistic horizon.
    - Identify constraints and the smallest meaningful next action.
    - Set a review point to keep, revise, or retire the goal.
