apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: retrieval-knowledge-engineering
  version: 1.0.1
  description: Engineer retrieval and knowledge systems through corpus design, parsing, chunking, metadata, indexing, ranking, grounding, evaluation, freshness, and access control.
  tags: [retrieval, rag, knowledge, ai]
spec:
  purpose: Build retrieval systems that return authorized, relevant, current, and source-traceable context rather than maximizing similarity scores alone.
  procedure:
    - Define user questions, authoritative source sets, data ownership, freshness requirements, access-control boundaries, citation needs, latency budget, and measurable retrieval success criteria.
    - Parse and normalize documents while preserving document identity, hierarchy, timestamps, permissions, section boundaries, links, tables, and provenance; choose chunking based on semantic and structural units.
    - Build candidate retrieval using lexical, dense, metadata, graph, or hybrid methods and apply filters, reranking, deduplication, diversity, and recency controls appropriate to the corpus.
    - Evaluate retrieval independently from generation using labeled queries, recall, precision, ranking metrics, answer-support coverage, access-control tests, and adversarial queries for cross-tenant leakage.
    - Monitor corpus drift, stale documents, broken parsers, embedding or model changes, index lag, and failed queries, then feed verified misses back into parsing, metadata, or ranking improvements.
  verification:
    - Retrieved context must retain source identity and permission checks through the complete query path.
    - Improvements must be demonstrated on a versioned evaluation set including difficult negatives and freshness cases.
