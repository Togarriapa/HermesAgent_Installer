apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: historiography
  version: 1.0.0
  description: Compare how historians have interpreted the same events, evidence, causes, and significance over time.
  tags: [history, historiography]
spec:
  workflow:
    - Identify major interpretive schools and representative works.
    - Compare evidence bases, assumptions, methods, and historical context.
    - Explain why interpretations differ and what later evidence changed.
    - Avoid presenting fringe positions as equal to well-supported scholarship.
