apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: product-discovery
  version: 1.0.1
  description: "Run product discovery from user problems and evidence through hypotheses, alternatives, validation, decision criteria, and learning preservation."
  tags: [product, discovery, customer, research]
spec:
  purpose: "Reduce uncertainty about user value, usability, viability, and feasibility before committing disproportionate delivery effort."
  procedure:
    - "Define target user, context, problem, desired outcome, constraints, current alternatives, and the decision discovery must enable."
    - "Gather direct user and behavioral evidence, distinguishing stated requests from observed tasks, workarounds, frequency, severity, and consequences."
    - "Generate materially different solution hypotheses and identify the riskiest assumptions across value, usability, feasibility, viability, accessibility, privacy, and safety."
    - "Run the smallest ethical validation capable of changing the decision, preserve counter-evidence, and record whether to proceed, revise, defer, or stop."
  verification:
    - hypotheses-trace-to-user-problem-evidence
    - riskiest-assumptions-are-tested-before-scale
    - decision-and-counter-evidence-are-preserved
  sideEffects: none
