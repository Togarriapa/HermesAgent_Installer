apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: change-management
  version: 1.0.1
  description: "Manage organizational change with explicit scope, stakeholders, readiness, communication, enablement, risk, sequencing, and feedback loops."
  tags: [management, change, organization, governance]
spec:
  purpose: "Coordinate a controlled transition from current to target operating state while preserving evidence, ownership, and reversibility where possible."
  procedure:
    - "Define current and target state, rationale, affected processes and people, decision rights, dependencies, timing, and material risks."
    - "Assess readiness, stakeholder impact, capability gaps, operational constraints, communication requirements, and competing changes already in flight."
    - "Sequence implementation, enablement, communications, support, migration, and fallback with named owners and explicit success and stop criteria."
    - "Monitor adoption, operational health, outcome movement, feedback, and unintended effects; adjust the plan and record material deviations from the approved change."
  verification:
    - current-target-state-and-owners-are-explicit
    - implementation-and-fallback-criteria-are-defined
    - adoption-and-outcomes-are-measured-after-change
  sideEffects: none
