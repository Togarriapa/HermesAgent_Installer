apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: homestead-systems-planning
  version: 1.0.0
  description: Design a maintainable homestead as interacting food, water, energy, shelter, storage, waste, transport, and labor systems.
  tags: [homestead, systems, resilience]
spec:
  procedure:
    - Define household goals, site constraints, climate, budget, labor, skills, regulations, and acceptable maintenance burden.
    - Map dependencies between water, food, energy, storage, waste, structures, access, equipment, and communications.
    - Prioritize high-value reliability improvements before adding complexity.
    - Stage projects with maintenance plans, spares, failure modes, recovery paths, and seasonal workload estimates.
