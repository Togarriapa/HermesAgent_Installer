apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: epub-conversion-validation
  version: 1.0.1
  description: Convert and validate EPUB publications across structure, metadata, navigation, HTML/CSS, media, accessibility, rendering, and source preservation.
  tags: [epub, ebook, publishing, validation]
spec:
  purpose: Produce standards-conformant EPUB artifacts while preserving the source manuscript and surfacing conversion loss or rendering defects.
  procedure:
    - Preserve an immutable source copy and inventory chapters, images, fonts, notes, links, tables, metadata, language, identifiers, and accessibility requirements before conversion.
    - Build EPUB package structure with valid XHTML, stylesheet references, media types, spine order, navigation document, metadata, cover handling, and internal anchors.
    - Run standards validation and repair malformed markup, missing resources, duplicate identifiers, broken references, invalid metadata, CSS incompatibilities, and accessibility errors without silently dropping content.
    - Render the EPUB in multiple representative reading engines and viewport sizes, checking chapter order, navigation, images, tables, typography, footnotes, page breaks, and dark-mode or reflow behavior where applicable.
    - Compare rendered content against the source and retain validation logs, conversion settings, unresolved compatibility notes, and the original artifact for rollback.
  verification:
    - The final EPUB must pass the selected validator with no unexplained fatal errors and all internal navigation targets must resolve.
    - Source text, required media, and metadata must be reconciled against the original so conversion loss is detectable.
