apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: investment-policy-design
  version: 1.0.1
  description: Design investment policy statements with objectives, constraints, liquidity, time horizon, risk tolerance, diversification, and governance.
  tags: [investment, portfolio, policy, governance]
spec:
  purpose: Translate goals and constraints into a reviewable investment policy without executing trades.
  procedure:
    - Convert stated goals into measurable return, capital-preservation, income, liquidity, horizon, and risk objectives while documenting conflicts between them.
    - Record legal, tax, currency, liquidity, concentration, leverage, ethical, operational, and implementation constraints that bound the policy.
    - Define strategic allocation ranges, diversification principles, risk limits, eligible/ineligible exposures, benchmark logic, and rebalancing governance appropriate to the mandate.
    - Specify decision rights, monitoring cadence, exception handling, review triggers, and how policy changes must be approved.
    - Test the policy against plausible adverse scenarios and confirm that it remains implementable without creating trade authority.
  verification:
    - objectives-and-constraints-are-measurable-and-conflicts-are-documented
    - governance-and-review-triggers-are-explicit
    - policy-survives-defined-stress-scenarios
