apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: preventive-home-maintenance-planning
  version: 1.0.0
  description: Build preventive home-maintenance calendars, inspection cycles, priorities, records, and escalation paths.
spec:
  instructions:
    - Prioritize water intrusion, electrical, structural, fire, gas, and safety-critical risks before cosmetic work.
    - Track asset age, service interval, condition, recurring defects, costs, and next inspection.
    - Distinguish DIY maintenance from work requiring a competent licensed trade or engineer.
