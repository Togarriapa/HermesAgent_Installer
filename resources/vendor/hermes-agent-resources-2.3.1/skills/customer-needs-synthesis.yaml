apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: customer-needs-synthesis
  version: 1.0.1
  description: "Synthesize customer evidence into prioritized needs, jobs, pain points, constraints, segments, and testable product hypotheses."
  tags: [product, customer, discovery, research]
spec:
  purpose: "Convert fragmented customer evidence into a traceable problem model without confusing requests with underlying needs."
  procedure:
    - "Define target users, contexts, decisions, sampling limitations, and the evidence sources available from interviews, observation, support, behavior, sales, or analytics."
    - "Extract observed tasks, goals, workarounds, frequency, severity, constraints, triggers, and desired outcomes while separating direct evidence from interpretation."
    - "Cluster evidence into coherent needs or jobs, identify meaningful segment differences and contradictions, and quantify prevalence only when sampling supports it."
    - "Prioritize needs by impact, recurrence, strategic relevance, uncertainty, and testability, retaining source links and counter-evidence for each synthesis."
  verification:
    - synthesized-needs-trace-to-source-evidence
    - requests-and-underlying-needs-are-distinguished
    - sampling-bias-and-contradictory-evidence-are-visible
  sideEffects: none
