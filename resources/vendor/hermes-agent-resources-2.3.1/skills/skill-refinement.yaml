apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: skill-refinement
  version: 1.0.1
  description: "Refine an existing Skill from observed failures and usage while preserving identity, authority boundaries, semantic versioning, compatibility, and regression evidence."
  tags: [registry, skills, refinement, evolution]
spec:
  purpose: "Improve reusable method quality without casually expanding responsibility or creating unnecessary replacement resources."
  procedure:
    - "Collect the current declared and effective Skill, consumers, usage evidence, failure examples, overlaps, learned overlays, and the precise behavior that should improve."
    - "Determine whether the problem belongs in direct domain method, verification, failure handling, selector metadata, another resource, or runtime policy before editing."
    - "Make the smallest coherent change, preserve or clarify boundaries, choose the correct semantic version, and flag any capability or responsibility expansion for stronger review."
    - "Run dependency, quality, regression, materialization, and overlay-compatibility checks, compare representative outcomes, and preserve rollback to the previous version."
  verification:
    - refinement-is-supported-by-usage-or-failure-evidence
    - semver-and-authority-impact-are-correct
    - regression-and-overlay-compatibility-are-verified
  sideEffects: none
