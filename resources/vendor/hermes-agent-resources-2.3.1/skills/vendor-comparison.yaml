apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: vendor-comparison
  version: 1.0.0
  description: Compare suppliers using requirements fit, total cost, quality, delivery, support, risk, lock-in, and evidence.
spec:
  procedure:
    - Normalize requirements, quote assumptions, inclusions, exclusions, and commercial terms.
    - Compare total lifecycle cost rather than headline price alone.
    - Assess delivery, support, quality, concentration, security, compliance, and exit risk.
