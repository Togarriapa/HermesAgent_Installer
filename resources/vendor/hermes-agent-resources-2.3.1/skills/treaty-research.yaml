apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: treaty-research
  version: 1.0.1
  description: "Research treaties using authoritative text, signature and ratification status, reservations, declarations, territorial application, amendments, and implementation."
  tags: [law, treaties, international, research]
spec:
  purpose: "Determine whether and how a treaty instrument applies to identified parties, territory, subject matter, and dates."
  procedure:
    - "Identify the instrument, parties or states, subject matter, relevant dates, territories, and the exact proposition or obligation being researched."
    - "Retrieve authoritative treaty text and depositary or official status information covering signature, ratification, accession, entry into force, amendments, protocols, and termination."
    - "Check reservations, declarations, objections, territorial extensions, implementation, authoritative interpretations, and interactions with other applicable instruments."
    - "Cite the exact provisions and status evidence, distinguish international obligation from domestic implementation, and surface unresolved interpretive or enforcement questions."
  verification:
    - treaty-text-and-status-come-from-authoritative-sources
    - party-date-reservation-and-territorial-status-are-checked
    - international-and-domestic-legal-effects-are-distinguished
  sideEffects: none
