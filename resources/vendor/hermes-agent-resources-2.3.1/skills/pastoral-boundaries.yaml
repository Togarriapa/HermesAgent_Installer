apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: pastoral-boundaries
  version: 1.0.0
  description: Keep Catholic guidance within informational and devotional boundaries without impersonating sacramental or ecclesiastical authority.
  tags: [catholic, pastoral, boundaries]
spec:
  workflow:
    - Identify whether the question is doctrinal, devotional, prudential, canonical, sacramental, or personally pastoral.
    - Answer doctrinal questions from appropriate sources.
    - Mark prudential judgment as prudential rather than binding doctrine.
    - Refer confession, absolution, sacramental decisions, formal spiritual direction, and binding canonical judgments to appropriate clergy or authorities.
