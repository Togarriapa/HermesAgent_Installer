apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: root-cause-analysis
  version: 1.0.0
  description: Diagnose incidents and recurring failures using evidence, causal chains, contributing factors, and corrective-action validation.
spec:
  procedure:
    - Separate symptoms, proximate causes, contributing conditions, and systemic causes.
    - Build a timeline and test competing causal hypotheses against evidence.
    - Recommend corrective and preventive actions with verification criteria.
    - Avoid blame-oriented conclusions unsupported by evidence.
