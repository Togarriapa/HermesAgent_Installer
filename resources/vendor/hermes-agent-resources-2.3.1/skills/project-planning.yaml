apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: project-planning
  version: 1.0.0
  description: Convert objectives into scope, deliverables, milestones, dependencies, owners, and acceptance criteria.
  tags: [projects, planning]
spec:
  workflow:
    - Define objective, scope, non-goals, and constraints.
    - Decompose deliverables and map dependencies.
    - Assign owners, milestones, and acceptance criteria.
    - Identify critical path assumptions and review points.
