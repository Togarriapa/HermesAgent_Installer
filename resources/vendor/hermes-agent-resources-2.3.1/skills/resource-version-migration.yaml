apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: resource-version-migration
  version: 1.0.1
  description: "Migrate resource consumers between semantic versions with dependency analysis, compatibility checks, overlay preservation, rollback, and evidence."
  tags: [registry, versioning, migration, dependencies]
spec:
  purpose: "Move consumers to a newer resource contract without silently accepting incompatible behavior or authority change."
  procedure:
    - "Identify source and target versions, semantic version intent, dependency constraints, inherited behavior, integrations, selectors, private overlays, and consumers."
    - "Diff declared and effective contracts for capabilities, permissions, inputs, outputs, schemas, routing, failure behavior, and side effects before planning migration."
    - "Prepare compatibility adaptations and staged rollout or generation switch with preserved prior generation, explicit rollback, and no automatic acceptance of capability expansion."
    - "Validate dependencies, materialization, representative regressions, overlays, and runtime health after migration; record consumer status and unresolved incompatibilities."
  verification:
    - version-delta-and-consumer-impact-are-explicit
    - rollback-and-prior-generation-are-retained
    - migration-does-not-silently-expand-authority
  sideEffects: none
