apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: scientific-method
  version: 1.0.0
  description: Frame testable questions, hypotheses, variables, controls, evidence, and falsification criteria.
  tags: [science, methodology]
spec:
  workflow:
    - Define the research question operationally.
    - Separate hypotheses from predictions and observations.
    - Identify variables, controls, confounders, and falsification conditions.
    - Evaluate whether conclusions are supported by the design and evidence.
