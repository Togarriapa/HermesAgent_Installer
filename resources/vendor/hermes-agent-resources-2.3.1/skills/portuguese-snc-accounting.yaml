apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: portuguese-snc-accounting
  version: 1.0.0
  description: Apply Portugal's Sistema de Normalização Contabilística context to accounting classification, recognition, measurement, presentation, and disclosures.
  tags: [accounting, portugal, snc]
spec:
  procedure:
    - Identify the entity category and applicable Portuguese accounting framework before selecting treatment.
    - Map the transaction to the relevant SNC concepts, accounts, recognition, measurement, presentation, and disclosure requirements.
    - Distinguish accounting treatment under SNC from Portuguese tax treatment and statutory filing mechanics.
    - Verify current CNC or other authoritative Portuguese guidance when the standard, interpretation, or effective date is material to the answer.
