apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: kitchen-workflow
  version: 1.0.0
  description: Organize mise en place, preparation sequencing, equipment use, cleanup, storage, and parallel cooking for efficient meal execution.
  tags: [cooking, workflow, kitchen]
spec:
  procedure:
    - Work backward from service time and identify long-lead, passive, and last-minute tasks.
    - Group preparation by equipment, ingredient, and contamination risk.
    - Use passive cooking and resting windows for parallel tasks without creating unsafe timing pressure.
    - Incorporate cleanup, cooling, labeling, and storage into the plan rather than treating them as afterthoughts.
