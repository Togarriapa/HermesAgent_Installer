apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: parallel-workspace-isolation
  version: 1.0.1
  description: "Design workspace isolation for parallel agents or tasks with bounded mounts, mutable state, credentials, provenance, merge points, and cleanup."
  tags: [orchestration, workspace, isolation, security]
spec:
  purpose: "Prevent parallel work from corrupting shared state, leaking credentials, or making one task's mutable cache an authority source for another."
  procedure:
    - "Identify canonical read sources, per-task writable artifacts, shared outputs, credentials, caches, temporary data, and paths that must never be exposed across workspaces."
    - "Allocate isolated writable roots and minimum read mounts with explicit ownership, quotas, lifecycle, and runtime-only credentials; share immutable inputs where safe."
    - "Define approved synchronization or merge points for outputs and prohibit direct cross-workspace mutation outside those boundaries."
    - "Verify file ownership, mounts, secret absence, merge provenance, and cleanup after completion, preserving required audit artifacts without retaining unnecessary task data."
  verification:
    - writable-roots-and-shared-state-are-explicit
    - credentials-and-private-state-do-not-cross-workspaces
    - merge-and-cleanup-provenance-is-verifiable
  sideEffects: none
