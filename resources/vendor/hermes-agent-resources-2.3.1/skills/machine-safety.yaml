apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: machine-safety
  version: 1.0.0
  description: Identify machine hazards and design guarding, isolation, safe states, interlocks, access, maintenance controls, and verification around credible failure modes.
  tags: [machines, safety, engineering]
spec:
  procedure:
    - Identify crushing, cutting, entanglement, ejection, stored energy, pressure, heat, electrical, noise, and unexpected-start hazards.
    - Define safe states, isolation, guarding, interlocks, emergency stops, access zones, and maintenance procedures proportional to risk.
    - Avoid relying on software-only controls where independent physical protection is required.
    - Require competent standards-based review for machinery placed into service where regulation applies.
