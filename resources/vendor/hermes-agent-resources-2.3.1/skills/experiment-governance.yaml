apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: experiment-governance
  version: 1.0.1
  description: "Govern experiments through hypotheses, ethics and authority, predeclared metrics, populations, stop conditions, data handling, reproducibility, and decision rules."
  tags: [experiments, governance, evaluation, evidence]
spec:
  purpose: "Ensure experiments produce trustworthy evidence without allowing experimental status to bypass safety, privacy, or authorization."
  procedure:
    - "Define hypothesis, decision, population or system, treatment and control logic, metrics, minimum useful evidence, risks, data needs, authority, and ethical or regulatory constraints before execution."
    - "Predeclare allocation or sampling, exclusion rules, analysis plan, guardrails, stop conditions, duration, instrumentation, and handling of missing or anomalous data."
    - "Run only within approved boundaries, preserve protocol deviations and adverse or failure outcomes, and prevent midstream metric changes from being hidden after results are visible."
    - "Analyze uncertainty and practical significance, document limitations and reproducibility details, and apply the predeclared decision rule with appropriate post-experiment monitoring."
  verification:
    - protocol-and-decision-criteria-precede-results
    - privacy-safety-and-authority-boundaries-are-preserved
    - deviations-failures-and-uncertainty-are-reported
  sideEffects: none
