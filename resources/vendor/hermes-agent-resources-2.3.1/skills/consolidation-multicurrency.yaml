apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: consolidation-multicurrency
  version: 1.0.0
  description: Perform consolidation and multi-currency accounting analysis including group scope, eliminations, translation, and reconciliation.
  tags: [accounting, consolidation, foreign-currency]
spec:
  procedure:
    - Establish group structure, control relationships, reporting dates, functional currencies, presentation currency, and framework.
    - Align accounting policies and periods before combining balances.
    - Identify intercompany balances, transactions, unrealized results, non-controlling interests, and required eliminations.
    - Apply the appropriate foreign-currency translation approach and reconcile translation effects and equity movements.
