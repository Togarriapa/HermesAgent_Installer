apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: stakeholder-communication
  version: 1.0.1
  description: "Communicate decisions, evidence, risks, requests, and changes to stakeholders with audience fit, traceability, clarity, and feedback loops."
  tags: [communication, stakeholders, management, governance]
spec:
  purpose: "Enable informed stakeholder action without hiding uncertainty, dissent, ownership, or material consequences behind polished messaging."
  procedure:
    - "Define audience, decision or action needed, stakeholder context, authority, likely concerns, confidentiality, and the evidence that must remain intact."
    - "Structure the communication around the decision-relevant result, supporting evidence, assumptions, trade-offs, risks, ownership, and explicit request or next step."
    - "Adapt depth, terminology, channel, and timing to the audience without changing material facts, uncertainty, safety limits, or dissent."
    - "Confirm receipt and understanding where consequential, capture questions or disagreement, and update the record when new evidence changes the message."
  verification:
    - intended-action-and-owner-are-clear
    - material-evidence-risk-and-uncertainty-are-preserved
    - feedback-or-decision-outcome-is-recorded-when-needed
  sideEffects: none
