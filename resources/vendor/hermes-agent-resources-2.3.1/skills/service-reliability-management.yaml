apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: service-reliability-management
  version: 1.0.1
  description: "Manage service reliability through objectives, indicators, dependencies, error budgets, incidents, capacity, change risk, recovery, and recurring-failure reduction."
  tags: [infrastructure, reliability, operations, sre]
spec:
  purpose: "Keep service behavior aligned to explicit reliability objectives rather than reacting to isolated alerts or maximizing uptime at any cost."
  procedure:
    - "Define service boundaries, owners, users, critical dependencies, service-level indicators and objectives, recovery targets, maintenance constraints, and failure consequences."
    - "Collect representative availability, latency, error, saturation, dependency, change, and incident evidence, distinguishing user-impact signals from noisy infrastructure symptoms."
    - "Prioritize reliability work using objective breaches, error budget, correlated risk, recurring failure, recovery weakness, capacity, and change exposure with explicit trade-offs."
    - "Verify remediation through post-change metrics and incident recurrence, update runbooks and failure tests, and preserve rollback or recovery options for state-changing work."
  verification:
    - service-objectives-and-user-impact-signals-are-explicit
    - reliability-priorities-link-to-evidence-and-risk
    - remediation-is-verified-and-recurring-failures-are-tracked
  sideEffects: none
