apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: household-operations-management
  version: 1.0.1
  description: "Manage recurring household operations through priorities, schedules, ownership, inventory, maintenance, safety, budget constraints, and exception handling."
  tags: [home, household, operations, management]
spec:
  purpose: "Keep household routines dependable without creating unnecessary monitoring, complexity, or unsafe automation."
  procedure:
    - "Inventory recurring household needs, critical assets, occupants, accessibility or safeguarding constraints, budgets, supplies, maintenance obligations, and failure consequences."
    - "Group work into routine, event-driven, seasonal, preventive, and exception tasks with clear ownership, frequency, dependencies, and minimum acceptable state."
    - "Automate only deterministic low-risk reminders or actions through the appropriate control plane, keeping physical or privileged actions behind applicable authorization and safety checks."
    - "Review missed work, recurring failures, inventory waste, maintenance backlog, and household feedback; simplify or revise routines when process cost exceeds benefit."
  verification:
    - critical-routines-and-owners-are-visible
    - automation-matches-risk-and-control-plane
    - recurring-failures-create-review-not-silent-repetition
  sideEffects: none
