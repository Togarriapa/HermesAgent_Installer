apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: infrastructure-capacity-management
  version: 1.0.1
  description: "Manage infrastructure capacity from demand, utilization, headroom, growth, contention, failure modes, service objectives, and scaling constraints."
  tags: [infrastructure, capacity, operations, reliability]
spec:
  purpose: "Keep services within safe capacity margins while avoiding reactive scaling based on isolated utilization snapshots."
  procedure:
    - "Inventory services and resource pools, critical dependencies, service objectives, current limits, reserved capacity, scaling mechanisms, and known bottlenecks."
    - "Collect representative CPU, memory, storage, I/O, network, connection, queue, latency, and application demand evidence with peak, percentile, seasonality, and growth context."
    - "Model headroom and saturation under normal, peak, failure, maintenance, and growth scenarios, including shared-resource contention and recovery capacity."
    - "Recommend threshold, optimization, scaling, or replacement actions with cost, lead time, rollback, and verification; privileged changes remain separately authorized."
  verification:
    - capacity-model-uses-representative-demand-evidence
    - failure-and-growth-headroom-are-accounted-for
    - scaling-recommendations-include-post-change-verification
  sideEffects: none
