apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: security-hardening
  version: 1.0.0
  description: Reduce attack surface through least privilege, secure defaults, patching, segmentation, authentication, and recovery controls.
  tags: [security, hardening]
spec:
  workflow:
    - Remove unnecessary exposure, services, accounts, and permissions.
    - Enforce strong authentication and secret management.
    - Apply supported updates and safer configuration defaults.
    - Verify logging, backup, restore, and rollback capability after changes.
