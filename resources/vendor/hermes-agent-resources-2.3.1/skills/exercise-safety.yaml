apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: exercise-safety
  version: 1.0.0
  description: Apply non-medical exercise safety checks, conservative progression, technique cues, and referral boundaries.
  tags: [fitness, safety]
spec:
  workflow:
    - Screen for stated injuries, symptoms, contraindications, and environmental risks.
    - Choose regressions and loads that preserve controlled technique.
    - Stop or modify work when warning symptoms or sharp pain occur.
    - Refer medical or rehabilitation questions to qualified professionals.
