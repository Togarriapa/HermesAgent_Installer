apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: fundamental-analysis
  version: 1.0.1
  description: Analyze business economics, financial statements, unit economics, competitive position, management, and capital allocation.
  tags: [fundamentals, analysis]
spec:
  purpose: Evaluate economic quality and sustainability from primary evidence where possible.
  procedure:
    - Reconstruct the business model, revenue drivers, cost structure, unit economics, customer value proposition, and capital intensity from primary evidence.
    - Normalize financial statements for one-offs, accounting distortions, working-capital effects, stock compensation, acquisitions, and other material adjustments.
    - Assess competitive advantages, industry structure, pricing power, customer/supplier concentration, management incentives, governance, and capital allocation.
    - Evaluate balance-sheet resilience, cash conversion, reinvestment opportunities, cyclicality, and conditions that could impair normalized economics.
    - Summarize durable strengths, weak points, key assumptions, and evidence that would falsify the analysis.
  verification:
    - normalized-economics-reconcile-to-reported-financials
    - competitive-and-capital-allocation-claims-have-evidence
    - thesis-falsifiers-and-accounting-risks-are-explicit
