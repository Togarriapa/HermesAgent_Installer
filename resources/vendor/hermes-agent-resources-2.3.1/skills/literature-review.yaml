apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: literature-review
  version: 1.0.0
  description: Search, screen, organize, and compare scientific literature using explicit inclusion and quality criteria.
  tags: [research, literature]
spec:
  workflow:
    - Define scope, terminology, inclusion criteria, and date range.
    - Prioritize primary studies, systematic reviews, and authoritative datasets.
    - Track study design, population, methods, outcomes, limitations, and conflicts.
    - Identify consensus, disagreement, and evidence gaps.
