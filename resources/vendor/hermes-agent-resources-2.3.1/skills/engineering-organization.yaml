apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: engineering-organization
  version: 1.0.1
  description: "Design engineering organization boundaries, ownership, interfaces, decision rights, capabilities, reliability responsibilities, and feedback loops around the actual work."
  tags: [engineering, organization, management, governance]
spec:
  purpose: "Align engineering structure to product and platform flows without optimizing for titles, ratios, or fashionable topology alone."
  procedure:
    - "Map products, platforms, services, value streams, critical dependencies, operational responsibilities, required expertise, and current coordination failure modes."
    - "Define clear ownership and decision rights for code, services, data, infrastructure, security, reliability, architecture, and incident response at appropriate boundaries."
    - "Compare team and interface designs across cognitive load, coupling, handoffs, resilience, skill concentration, manager capacity, and expected change rate."
    - "Test the design against representative delivery and incident scenarios, then measure flow, quality, reliability, ownership ambiguity, and coordination cost after adoption."
  verification:
    - ownership-and-decision-rights-cover-critical-assets
    - interfaces-and-dependencies-are-explicit
    - organization-design-is-tested-against-real-work
  sideEffects: none
