apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: regression-review
  version: 1.0.1
  description: "Review behavioral, capability, safety, integration, or output regressions against preserved baselines, failure cases, evidence, and intended change scope."
  tags: [quality, regression, review, testing]
spec:
  purpose: "Determine whether a change caused unacceptable loss or unintended behavior and what evidence supports rollback or remediation."
  procedure:
    - "Define the changed component, expected behavior change, prior baseline, affected interfaces, acceptance criteria, and preserved regression corpus."
    - "Reproduce reported regressions under controlled and representative conditions, recording version, inputs, environment, permissions, and observable outcomes."
    - "Compare baseline and candidate across correctness, safety, capability boundaries, latency, cost, stability, integration compatibility, and material output quality."
    - "Classify confirmed, intermittent, environment-specific, or unsupported regressions; recommend fix, containment, or rollback with evidence and new permanent regression cases."
  verification:
    - regression-is-reproducible-or-uncertainty-is-stated
    - comparison-controls-version-environment-and-inputs
    - confirmed-regressions-become-preserved-test-cases
  sideEffects: none
