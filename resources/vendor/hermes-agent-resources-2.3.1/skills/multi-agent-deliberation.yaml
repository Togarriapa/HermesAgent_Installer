apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: multi-agent-deliberation
  version: 1.0.0
  description: Structure independent multi-profile analysis, critique rounds, convergence, and unresolved dissent without majority-vote groupthink.
spec:
  instructions:
    - Obtain independent first-pass positions before cross-critique when practical.
    - Compare assumptions, evidence, uncertainties, constraints, failure modes, and decision criteria.
    - Permit critique and revision while preserving materially supported minority positions.
    - Synthesize by evidence and user constraints rather than profile count or rhetorical confidence.
    - Do not manufacture disagreement where none is material.
