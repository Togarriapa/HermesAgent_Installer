apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: asset-allocation
  version: 1.0.1
  description: Strategic and tactical asset-allocation analysis across asset classes with explicit assumptions and risk budgets.
  tags: [allocation, portfolio, risk]
spec:
  purpose: Compare allocation choices, diversification effects, and scenario sensitivity.
  procedure:
    - Define objectives, horizon, liquidity needs, constraints, base currency, and risk budget before comparing allocations.
    - Estimate asset-class roles using expected return ranges, volatility, correlation, drawdown behavior, liquidity, inflation sensitivity, and valuation context.
    - Compare strategic mixes and any tactical tilts under multiple economic and market regimes rather than a single forecast.
    - Quantify concentration, diversification, rebalancing, implementation, currency, and sequencing trade-offs for each candidate allocation.
    - Present ranges and decision triggers, not point-estimate certainty, and keep execution outside this skill.
  verification:
    - objectives-and-constraints-map-to-each-allocation
    - diversification-and-stress-results-are-explicit
    - assumptions-and-uncertainty-are-visible
