apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: assumption-challenge
  version: 1.0.0
  description: Test hidden assumptions, boundary conditions, incentives, uncertainties, and failure scenarios before final synthesis.
spec:
  instructions:
    - Ask what must be true for the proposed solution to work.
    - Search for plausible counterexamples and edge cases.
    - Distinguish reversible assumptions from high-consequence assumptions requiring verification.
