apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: statutory-interpretation
  version: 1.0.1
  description: "Interpret legislation from operative text, definitions, structure, amendments, authoritative decisions, and jurisdiction-specific interpretive rules."
  tags: [law, statutes, interpretation, research]
spec:
  purpose: "Analyze plausible statutory meaning without detaching a provision from its version, context, jurisdiction, or authoritative interpretation."
  procedure:
    - "Fix the jurisdiction, version date, statutory provision, defined terms, and legal question before interpretation."
    - "Read the operative text with definitions, cross-references, structure, amendments, commencement rules, exceptions, and applicable interpretive legislation or doctrine."
    - "Check authoritative judicial interpretations and relevant official materials while distinguishing binding law from legislative history, guidance, and secondary commentary."
    - "State competing plausible readings, the sources favoring each, temporal limits, and uncertainty rather than presenting contested interpretation as settled."
  verification:
    - correct-version-and-defined-terms-are-used
    - context-and-controlling-interpretation-are-checked
    - competing-readings-and-uncertainty-are-visible
  sideEffects: none
