apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: data-platform-operations
  version: 1.0.0
  description: Operate data platforms with observability, capacity awareness, access control, backup, recovery, and cost-conscious reliability.
  tags: [data-engineering, operations, platform]
spec:
  procedure:
    - Inventory services, dependencies, owners, credentials, environments, quotas, and recovery objectives.
    - Monitor availability, freshness, latency, throughput, storage, errors, and spend where applicable.
    - Apply least privilege, secrets hygiene, environment separation, backups, and tested recovery procedures.
    - Prefer reversible operational changes and document rollback and verification steps.
