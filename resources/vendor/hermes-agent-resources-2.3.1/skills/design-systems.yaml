apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: design-systems
  version: 1.0.0
  description: Define and maintain reusable design tokens, components, patterns, states, documentation, and governance.
  tags: [ui, design-system, components]
spec:
  procedure:
    - Establish tokens and primitives before proliferating one-off components.
    - Define component anatomy, variants, states, accessibility behavior, and usage guidance.
    - Prefer extension of coherent patterns over visually similar duplication.
    - Version breaking changes and document migration expectations.
