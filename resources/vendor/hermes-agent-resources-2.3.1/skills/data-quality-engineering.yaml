apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: data-quality-engineering
  version: 1.0.0
  description: Define, test, monitor, and remediate data-quality expectations as executable data contracts.
  tags: [data-engineering, quality, observability]
spec:
  procedure:
    - Translate business expectations into tests for schema, uniqueness, completeness, validity, consistency, freshness, and referential integrity.
    - Classify quality failures by severity and define quarantine, retry, escalation, and downstream-blocking behavior.
    - Monitor quality trends and distinguish source defects from pipeline defects.
    - Preserve evidence needed to reproduce and remediate failures without silently rewriting source history.
