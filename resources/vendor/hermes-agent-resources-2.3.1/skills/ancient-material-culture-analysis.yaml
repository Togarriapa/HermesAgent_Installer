apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: ancient-material-culture-analysis
  version: 1.0.1
  description: Analyze ancient artifacts and material culture through context, technology, chronology, use, exchange, deposition, identity, and comparative evidence.
  tags: [ancient, artifacts, archaeology, material-culture]
spec:
  purpose: Interpret objects as contextual evidence rather than assigning meaning from typology or appearance alone.
  procedure:
    - Record object material, manufacture, dimensions, condition, find context, stratigraphy, associations, collection history, and dating basis before interpretive classification.
    - Compare typology, chaîne opératoire, wear, residue, repair, reuse, inscriptions, scientific analyses, and regional parallels while noting uncertainty in provenance or chronology.
    - Distinguish production, circulation, use, display, curation, discard, ritual deposition, and post-depositional processes instead of assuming one function from form alone.
    - Evaluate economic, technological, social, political, religious, and identity interpretations against the full contextual assemblage and relevant comparative datasets.
    - Report the best-supported interpretation, alternatives, confidence, and additional analyses that could materially change the conclusion.
  verification:
    - Functional and identity claims require contextual or analytical evidence beyond stylistic resemblance.
    - Dating and provenance claims must identify their method and uncertainty.
