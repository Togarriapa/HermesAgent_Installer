apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: prose-craft
  version: 1.0.0
  description: Shape clear, coherent prose with deliberate structure, voice, rhythm, and detail.
  tags: [writing, prose]
spec:
  workflow:
    - Identify audience, purpose, genre, and desired voice.
    - Build a logical or narrative structure before polishing sentences.
    - Prefer specific verbs and concrete nouns over unnecessary abstraction.
    - Vary sentence rhythm without sacrificing clarity.
