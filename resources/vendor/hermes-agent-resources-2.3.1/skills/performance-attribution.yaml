apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: performance-attribution
  version: 1.0.1
  description: Attribute portfolio performance to allocation, selection, factors, fees, currency, timing, and cash flows.
  tags: [performance, attribution]
spec:
  purpose: Explain outcomes without confusing realized performance with future expected returns.
  procedure:
    - Define the portfolio, benchmark, base currency, measurement period, valuation convention, cash-flow treatment, and data granularity.
    - Reconcile starting/ending values, external cash flows, fees, income, corporate actions, and currency effects before decomposing returns.
    - Attribute results using an appropriate framework such as allocation/selection, factor, contribution, or fixed-income attribution and disclose residuals.
    - Separate repeatable exposures from one-off timing, concentration, leverage, currency, and idiosyncratic effects.
    - Interpret attribution as an explanation of realized outcomes, not evidence that the same contributors will persist.
  verification:
    - total-attributed-return-reconciles-within-defined-tolerance
    - benchmark-currency-fee-and-cashflow-conventions-are-stated
    - residuals-and-method-limitations-are-visible
