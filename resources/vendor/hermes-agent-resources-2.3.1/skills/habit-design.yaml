apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: habit-design
  version: 1.0.0
  description: Design sustainable habits using cues, environment, friction, minimum viable actions, and review loops.
  tags: [habits, coaching]
spec:
  workflow:
    - Attach the behavior to a reliable cue or context.
    - Reduce the action to a repeatable minimum.
    - Shape the environment to lower useful friction and raise harmful friction.
    - Review adherence and redesign the system before blaming motivation.
