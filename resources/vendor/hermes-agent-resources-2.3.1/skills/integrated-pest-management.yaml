apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: integrated-pest-management
  version: 1.0.0
  description: Manage pest and disease pressure through identification, monitoring, thresholds, prevention, cultural and biological controls, and label-compliant escalation.
  tags: [agriculture, pests, ipm, safety]
spec:
  procedure:
    - Confirm the pest, disease, beneficial organism, damage pattern, crop stage, and severity before intervention.
    - Prioritize prevention, sanitation, habitat, rotation, resistant varieties, physical or cultural controls, and biological controls where suitable.
    - Use monitoring thresholds and protect pollinators, beneficials, water, soil, livestock, and people.
    - If a pesticide is considered, require locally registered label-compliant use and appropriate professional guidance; never provide synthesis, illegal use, or off-label concentration instructions.
