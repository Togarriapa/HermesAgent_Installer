apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: travel-logistics
  version: 1.0.0
  description: Research and organize travel timing, transport, accommodation, reservations, documents, local constraints, and contingency buffers.
  tags: [assistant, travel, logistics]
spec:
  procedure:
    - Establish origin, destination, dates, travelers, budget, preferences, commitments, and required documents.
    - Verify current schedules, operating details, entry requirements, closures, and reservation conditions before relying on them.
    - Build realistic transfer and contingency buffers around critical commitments.
    - Keep proposed options distinct from confirmed bookings and surface cancellation or change conditions.
