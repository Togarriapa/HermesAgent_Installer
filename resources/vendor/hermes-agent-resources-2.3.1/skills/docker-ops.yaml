apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: docker-ops
  version: 1.0.0
  description: Safe diagnosis and lifecycle operations for Docker containers.
  tags: [docker, containers, operations]
spec:
  procedure:
    - Capture `docker ps --no-trunc` and target container inspect data.
    - Check recent logs and container health before changing state.
    - Identify bind mounts, named volumes, networks, ports, environment sources, and restart policy.
    - For upgrades, pull the intended image explicitly and preserve persistent storage.
    - Recreate only when configuration or image changes require it; otherwise prefer restart.
    - Verify health, logs, ports, and dependent services after the change.
  guardrails:
    - Never delete volumes as part of routine cleanup.
    - Never use broad `docker system prune --volumes` without explicit authorization.
    - Redact secrets from inspect/environment output.
  rollback:
    - Retain the prior image digest or tag until post-change validation succeeds.
