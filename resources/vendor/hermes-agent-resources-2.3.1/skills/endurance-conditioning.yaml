apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: endurance-conditioning
  version: 1.0.1
  description: Design endurance conditioning using aerobic base, threshold, interval, specificity, load progression, recovery, and performance monitoring.
  tags: [fitness, endurance, conditioning, training]
spec:
  purpose: Build sustainable endurance capacity with training stress matched to the athlete's history, goals, recovery, and event demands.
  procedure:
    - Establish sport or event demands, current weekly volume, recent training history, injury history, schedule, recovery factors, and baseline pace, power, heart-rate, or field-test metrics.
    - Allocate easy aerobic work, long sessions, threshold or tempo, high-intensity intervals, technique, and strength support according to training age and goal while keeping most volume recoverable.
    - Progress frequency and duration before adding substantial intensity, use planned recovery weeks, and avoid abrupt increases in monotony or total load.
    - Monitor session RPE, pace or power response, resting or submaximal trends, sleep, soreness, motivation, and performance so accumulating fatigue is distinguished from productive overload.
    - Re-test at planned intervals and adjust zones, volume, intensity distribution, tapering, or recovery from longitudinal data rather than one workout.
  verification:
    - Weekly progression and intensity distribution must be consistent with the athlete's baseline and recovery evidence.
    - Persistent chest symptoms, syncope, unusual breathlessness, significant pain, or other concerning signs require medical evaluation rather than further training progression.
