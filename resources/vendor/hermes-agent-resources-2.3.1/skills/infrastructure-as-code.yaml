apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: infrastructure-as-code
  version: 1.0.0
  description: Manage infrastructure declaratively with reviewable plans, state protection, drift awareness, modularity, and safe change workflows.
  tags: [devops, infrastructure, iac]
spec:
  procedure:
    - Model desired infrastructure state in version-controlled configuration without embedding secrets.
    - Review planned changes and identify replacements, deletions, privilege changes, and blast radius before apply.
    - Protect remote state, locking, credentials, and environment separation.
    - Detect drift and document rollback or recovery strategy for material changes.
