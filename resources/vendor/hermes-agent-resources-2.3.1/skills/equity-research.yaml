apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: equity-research
  version: 1.0.1
  description: Research public equities using business quality, financial statements, industry structure, catalysts, valuation, and risk.
  tags: [equities, stocks, research]
spec:
  purpose: Separate source facts, assumptions, valuation cases, and investment thesis uncertainty.
  procedure:
    - Define the company, share class, reporting period, business segments, geographic exposure, and material industry drivers.
    - Analyze primary filings and disclosures for revenue quality, margins, cash generation, balance-sheet strength, capital allocation, dilution, and accounting risks.
    - Evaluate competitive position, management incentives, customer/supplier concentration, cyclicality, regulation, and plausible catalysts or thesis-breakers.
    - Build valuation ranges using methods appropriate to the business and test key assumptions under downside, base, and upside cases.
    - Separate verified facts, management claims, analyst assumptions, variant views, and unresolved questions in the final thesis.
  verification:
    - thesis-is-supported-by-primary-financial-evidence
    - valuation-range-links-to-explicit-assumptions
    - material-risks-and-thesis-breakers-are-stated
