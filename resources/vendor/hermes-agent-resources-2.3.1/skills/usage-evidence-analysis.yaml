apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: usage-evidence-analysis
  version: 1.0.1
  description: "Analyze privacy-minimized resource usage evidence for demand, failures, overlap, quality, cost, routing, and improvement opportunities without turning frequency into authority."
  tags: [registry, usage, evidence, analysis, privacy]
spec:
  purpose: "Use observed operation to improve the registry while preserving privacy, provenance, and the distinction between popularity and correctness."
  procedure:
    - "Define the improvement question and minimum telemetry needed, excluding secrets, unnecessary user content, private learning, and identity details not required for the analysis."
    - "Aggregate resource selection, task class, outcome, failure, latency, cost, retries, verification, and routing evidence with known sampling and instrumentation limitations."
    - "Look for recurring gaps, unused or overlapping resources, misrouting, failure clusters, cost or latency outliers, and quality regressions while controlling for task mix and version."
    - "Translate findings into testable refinement hypotheses, preserve contradictory evidence, and require normal review before any change to capability, authority, or routing."
  verification:
    - telemetry-is-minimized-and-provenance-aware
    - conclusions-control-for-version-and-task-mix
    - usage-frequency-never-creates-authority
  sideEffects: none
