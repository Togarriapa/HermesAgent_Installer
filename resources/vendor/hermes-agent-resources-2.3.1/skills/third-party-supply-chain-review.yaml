apiVersion: hermes.togarriapa/v1
kind: Skill
metadata:
  name: third-party-supply-chain-review
  version: 1.0.0
  description: Review third-party packages, plugins, containers, scripts, and integrations for provenance, maintenance, permissions, dependencies, update risk, and rollback.
  tags: [supply-chain, security, review]
spec:
  procedure:
    - Verify publisher identity, canonical repository, license, release history, maintenance activity, issue history, and distribution channel.
    - Inspect install commands, dependency graph, containers, binaries, scripts, requested credentials, filesystem access, network access, and update behavior.
    - Prefer pinned versions or digests for production and document reproducible rollback.
    - Reject opaque installers, excessive permissions, unsigned or unverifiable binaries, abandoned critical dependencies, and unexplained telemetry for privileged use.
