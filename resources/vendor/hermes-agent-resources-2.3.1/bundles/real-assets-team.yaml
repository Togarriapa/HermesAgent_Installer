apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: real-assets-team
  version: 1.0.0
  description: Real-assets team for real-estate investment analysis, asset oversight, property condition, finance, risk and specialist coordination.
  tags: [real-estate, assets, team]
spec:
  imports:
    profiles:
      - team-leader@^1.2.0
      - real-estate-manager@^1.0.0
      - real-estate-investment-analyst@^1.0.0
      - asset-manager@^1.0.0
      - investment-risk-analyst@^1.0.0
      - home-improvement-specialist@^1.0.0
  policy:
    acquisitionExecution: deny
    saleExecution: deny
    financingExecution: deny
