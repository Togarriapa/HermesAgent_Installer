apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: ebook-publishing-team
  version: 1.0.0
  description: Internal ebook planning, writing, editing, design, conversion, Kobo notebook, device integration, and explicit delivery team.
  tags: [bundle, ebook, publishing, kobo]
spec:
  imports:
    profiles:
      - team-leader@^1.3.0
      - ebook-planner@^1.0.0
      - ebook-writer@^1.0.0
      - ebook-editor-publisher@^1.0.0
      - ebook-designer@^1.0.0
      - ebook-converter@^1.0.0
      - kobo-library-notebook-specialist@^1.0.0
      - kobo-integration-specialist@^1.0.0
  policy:
    userFacing: false
    drmRemoval: deny
    externalDelivery: explicit-user-order
    authorityExpansion: deny
