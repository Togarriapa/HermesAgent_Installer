apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: decision-science-team
  version: 1.0.0
  description: Decision-science team combining formal modeling, analytics, debate, verification, and dynamically recruited domain expertise.
spec:
  imports:
    profiles:
      - team-leader@^1.3.0
      - decision-scientist-operations-research-specialist@^1.0.0
      - debate-analyst@^1.0.0
      - data-analytics-specialist@^1.0.0
      - fact-checker-source-verification-specialist@^1.0.0
  recruitment: {open: true, allowOutsideBundle: true}
  policy: {majorityVoteDecisionMaking: deny, preserveMaterialDissent: true}
