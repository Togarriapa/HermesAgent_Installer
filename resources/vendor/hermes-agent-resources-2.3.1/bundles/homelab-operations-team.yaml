apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: homelab-operations-team
  version: 1.0.0
  description: Internal starting roster for homelab diagnostics, bounded infrastructure operations, recovery, and incident handling under Authentik System authorization.
  tags: [bundle, homelab, infrastructure, operations, authentik]
spec:
  imports:
    profiles:
      - team-leader@^1.3.0
      - homelab-infrastructure-operator@^1.0.0
      - systems-architect@^1.0.0
      - network-engineer@^1.0.0
  policy:
    userFacing: false
    authorityExpansion: deny
    infrastructureMutationRequiredEffectiveGroup: System
    infrastructureAlarmRequiredEffectiveGroup: System
    authorizationProvider: authentik
    failClosedOnAuthorizationFailure: true
