    profiles:
      - team-leader@^1.3.0
      - home-maintenance-manager@^1.0.0
      - plumbing-maintenance-specialist@^1.0.0
      - appliance-maintenance-specialist@^1.0.0
      - carpentry-joinery-specialist@^1.0.0
      - painting-finishes-specialist@^1.0.0
      - roofing-drainage-specialist@^1.0.0
      - garden-grounds-maintenance-specialist@^1.0.0
      - home-comfort-maintenance-specialist@^1.0.0
      - home-fixing-specialist@^1.0.0
  policy:
    internalOnly: true
    dynamicRecruitment: true
    regulatedTradeEscalation: required
