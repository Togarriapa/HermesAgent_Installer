apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: catholic-family-perspectives-team
  version: 1.0.0
  description: Cross-cultural Catholic family-life advisory team spanning Portuguese, Sicilian, Spanish, and German perspectives without stereotyping.
spec:
  imports:
    profiles:
      - team-leader@^1.3.0
      - portuguese-catholic-family-advisor@^1.0.0
      - sicilian-catholic-family-advisor@^1.0.0
      - spanish-catholic-family-advisor@^1.0.0
      - german-catholic-family-advisor@^1.0.0
      - catholic-traditional-advisor@^1.0.0
      - culture-expert@^1.0.0
  policy:
    internalOnly: true
    dynamicRecruitment: true
    distinguishDoctrineFromCulture: true
    stereotypeAsFact: deny
