apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: financial-execution-team
  version: 1.0.0
  description: Internal execution bundle that separates decision/recommendation roles from one-shot explicitly authorized bank, broker, exchange, and Ledger execution.
  tags: [bundle, finance, execution, explicit-order]
spec:
  imports:
    profiles:
      - team-leader@^1.2.0
      - financial-execution-operator@^1.0.0
      - financial-data-steward@^1.0.0
      - investment-risk-analyst@^1.0.0
  policy:
    userFacing: false
    autonomousExecution: deny
    explicitUserOrderRequired: true
    freshConfirmationRequired: true
