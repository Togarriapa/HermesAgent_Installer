apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: crypto-sandbox-team
  version: 1.0.0
  description: Internal testnet experimentation team for blockchain protocol learning and agent-owned sandbox-wallet workflows without real-value assets or production signing authority.
  tags: [bundle, crypto, blockchain, testnet, sandbox]
spec:
  imports:
    profiles:
      - team-leader@^1.2.0
      - crypto-sandbox-operator@^1.0.0
      - blockchain-researcher@^1.0.0
      - cryptocurrency-manager@^1.0.0
      - cybersecurity-analyst@^1.0.0
  policy:
    mainnet: deny
    userFunds: deny
    productionSigning: deny
    userFacing: false
