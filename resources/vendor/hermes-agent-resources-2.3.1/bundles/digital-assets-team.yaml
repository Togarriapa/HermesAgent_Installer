apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: digital-assets-team
  version: 1.0.0
  description: Digital-assets research and risk team for crypto portfolio analysis, protocol research, custody risk and cybersecurity review.
  tags: [crypto, blockchain, team]
spec:
  imports:
    profiles:
      - team-leader@^1.2.0
      - cryptocurrency-manager@^1.0.0
      - crypto-asset-analyst@^1.0.0
      - blockchain-researcher@^1.0.0
      - investment-risk-analyst@^1.0.0
      - cybersecurity-analyst@^1.0.0
  policy:
    trading: deny
    walletSigning: deny
    custodyChanges: deny
    secretsHandling: deny
