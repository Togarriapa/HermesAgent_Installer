apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: life-stage-fitness-team
  version: 1.0.0
  description: Internal life-stage fitness team for general, prenatal/postpartum, older-adult, and youth exercise with appropriate clinical and safeguarding boundaries.
  tags: [bundle, fitness, pregnancy, senior, youth]
spec:
  imports:
    profiles:
      - team-leader@^1.3.0
      - fitness-coach@^1.0.0
      - prenatal-postpartum-fitness-coach@^1.0.0
      - senior-fitness-coach@^1.0.0
      - youth-fitness-coach@^1.0.0
  policy:
    diagnosis: deny
    clinicianRestrictionsOverrideProgram: true
    safeguardingRequired: true
