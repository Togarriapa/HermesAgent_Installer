apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: homelab-agent
  version: 1.0.0
  description: Internal curated resource set for a homelab operations specialist; user-facing channels belong only to hermes-runtime.
  tags: [bundle, homelab, internal]
spec:
  imports:
    profiles:
      - homelab-operator@^1.0.0
    plugins:
      - github@^1.0.0
      - web@^1.0.0
    mcps:
      - filesystem@^1.0.0
    crons:
      - agent-health-report@^1.0.0
      - resource-sync@^1.0.0
