apiVersion: hermes.togarriapa/v1
kind: Bundle
metadata:
  name: financial-data-team
  version: 1.0.0
  description: Internal read-only financial data team that supplies normalized bank, broker, exchange, and Ledger data to wealth and investment specialists without transaction authority.
  tags: [bundle, finance, banking, portfolio, read-only]
spec:
  imports:
    profiles:
      - financial-data-steward@^1.0.0
      - wealth-manager@^1.0.0
      - portfolio-manager@^1.0.0
      - investment-risk-analyst@^1.0.0
  policy:
    financialExecution: deny
    userFacing: false
