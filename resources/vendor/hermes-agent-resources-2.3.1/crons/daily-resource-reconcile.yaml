apiVersion: hermes.togarriapa/v1
kind: Cron
metadata:
  name: daily-resource-reconcile
  version: 1.1.0
  description: Daily candidate assessment of upstream Hermes resources while preserving local and private overlays; schedule never grants activation authority.
  tags: [cron, resources, updates, learning, infrastructure]
spec:
  requires:
    profiles:
      - resource-evolution-manager@^1.0.0
  schedule: "23 4 * * *"
  timezone: Europe/Lisbon
  action:
    type: profile-run
    profile: resource-evolution-manager@^1.0.0
    repository: Togarriapa/HermesAgent_Resources
    ref: main
    mode: candidate-assessment
  runtime:
    scope: control-agent
    required: true
    engine: hermes-cron
    profileSelection: registry-action-profile
    delivery: local
  policy:
    autoApply: safe-compatible-only
    candidateMaterialization: true
    authorityFromSchedule: deny
    activationFromSchedule: deny
    activationRequiresIndependentAuthorizedPath: true
    preserveLocalExperienceOverlay: true
    preservePrivateUserLearnedOverlay: true
    publishPrivateOverlays: false
    breakingChanges: quarantine
    conflicts: quarantine
    rollbackSnapshot: true
    notifyOnBlockedChanges: true
    jitterSeconds: 300
    infrastructureAlarmRequiredGroup: System
    resolveRecipientsAtDelivery: true
    failClosedOnRecipientAuthorizationFailure: true
    staticRecipientListAsAuthority: deny
