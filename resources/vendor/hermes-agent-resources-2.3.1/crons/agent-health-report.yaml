apiVersion: hermes.togarriapa/v1
kind: Cron
metadata:
  name: agent-health-report
  version: 1.1.0
  description: Daily non-destructive agent-runtime health review with infrastructure alarms restricted to current Authentik System members.
  tags: [cron, health, observability, infrastructure]
spec:
  requires:
    profiles:
      - homelab-infrastructure-operator@^1.0.0
  schedule: "23 7 * * *"
  timezone: Europe/Lisbon
  action:
    type: profile-run
    profile: homelab-infrastructure-operator@^1.0.0
    mode: agent-runtime-health-report
    checks:
      - agent-process
      - container-health
      - disk-space
      - recent-errors
      - resource-version
  runtime:
    scope: control-agent
    required: true
    engine: hermes-cron
    profileSelection: registry-action-profile
    delivery: local
  policy:
    mutate: false
    authorityFromSchedule: deny
    remediationFromSchedule: deny
    notifyOnlyOnProblems: true
    noProblemNoNotification: true
    evidenceRequiredForAlarm: true
    infrastructureAlarmRequiredGroup: System
    resolveRecipientsAtDelivery: true
    failClosedOnRecipientAuthorizationFailure: true
    staticRecipientListAsAuthority: deny
