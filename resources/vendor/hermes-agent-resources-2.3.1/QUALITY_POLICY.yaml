apiVersion: hermes.togarriapa/v1
kind: RegistryQualityPolicy
metadata:
  name: registry-quality
  version: 2.2.0
  description: Canonical registry-wide restrictive defaults and domain overlays for execution, evidence, verification, safety, observability, privacy, and lifecycle behavior.
  tags: [quality, governance, safety, completeness, defaults]
spec:
  application:
    scope: every-catalog-resource
    precedenceLowToHigh: [kind-defaults, matched-domain-overlays, resolved-resource-manifest, local-experience-overlay, private-user-learned-overlay, current-explicit-session-context]
    authorizationCeiling: local-host-policy
    explicitUserAuthority: within-host-policy-only
    maps: recursive-merge
    lists: append-deduplicated
    scalars: higher-precedence-replaces
    defaultsMayExpandCapability: false
    overlaysMayExpandCapability: false
    resourceMayExceedHostAuthority: false
    learnedOverlayMayExpandCapability: false
    sessionContextMayExpandCapability: false
    missingPolicy: fail-closed
    secretResolution: runtime-only

  universal:
    contract:
      qualityLevel: hardened-v2.2
      explicitAssumptions: true
      explicitUncertainty: true
      verifyBeforeClaimingDone: true
      preserveMaterialDissent: true
    safety:
      leastPrivilege: true
      authorityFromInference: deny
      authorityFromBundleMembership: deny
      authorityFromPriorSimilarTask: deny
      destructiveOrIrreversibleAction: explicit-authorization
      regulatedOrLicensedWork: identify-and-escalate
      stopOnUnknownSafetyBoundary: true
    privacy:
      dataMinimization: true
      secrets: runtime-only
      secretLogging: deny
      secretCommit: deny
      privateLearningExport: deny
      redactSensitiveLogs: true
    evidence:
      distinguishFactInferenceEstimateOpinion: true
      currentFactsRefreshWhenMaterial: true
      preferPrimaryOrAuthoritativeSources: true
      recordMaterialSources: true
      contradictoryEvidence: surface
    reliability:
      boundedRetries: true
      exponentialBackoffWhenRemote: true
      idempotencyWhenPossible: true
      timeoutRequiredForExternalCalls: true
      partialFailure: report-explicitly
      failClosedOnAuthorizationFailure: true
    observability:
      recordResourceIdentity: true
      recordMaterialInputs: true
      recordPermissionsUsed: true
      recordStateChanges: true
      recordVerificationOutcome: true
      redactSensitiveValues: true

  defaults:
    Profile:
      scope: {mode: declared-role-only, outsideScope: delegate-or-escalate, expandScopeByInference: deny, regulatedAuthority: none-unless-explicit}
      intake: {identifyGoal: true, identifyConstraints: true, inspectAvailableContext: true, recordMaterialAssumptions: true, clarifyOnlyWhenBlocking: true, otherwiseBestEffort: true}
      method:
        workflow: [understand-request, inspect-current-state-and-evidence, decompose-if-needed, identify-risks-and-authority, perform-or-propose-within-scope, challenge-important-assumptions, verify-result, handoff-with-context]
      evidence: {sourceTraceability: required-for-material-claims, freshness: refresh-time-sensitive-facts, uncertainty: explicit, distinguishFactInferenceEstimateOpinion: true}
      decisionPolicy: {optimizeFor: [user-goal, correctness, safety, reversibility, efficiency], evidenceOverMajorityVote: true, unsupportedCertainty: deny, materialTradeoffs: explicit, reversibleOptionPreferredWhenComparable: true}
      execution: {writes: delegated-authority-only, destructiveActions: explicit-confirmation, externalSideEffects: explicit-authority, retries: bounded, timeout: required-when-applicable, rollback: required-when-feasible-for-state-change, verifyAfterWrite: true}
      collaboration: {recruitOutsideScope: true, handoffContext: [goal, constraints, evidence, assumptions, risks, permissions, open-questions], directUserContact: hermes-only, scalingExpandsAuthority: false}
      failureHandling: {missingEvidence: report-and-bound-conclusion, missingPermission: return-required-permission, conflictingEvidence: surface-and-reconcile, toolFailure: bounded-retry-then-report, unsafeOrRegulatedBoundary: stop-and-escalate}
      observability: {recordSources: true, recordDecisions: true, recordChanges: true, recordVerification: true, recordPermissionsUsed: true}
      output: {include: [result, material-evidence, assumptions, uncertainty, risks, verification, next-action-or-permission], separateProposalFromExecutedAction: true, markPartialCompletion: true}

    Skill:
      inputs: {requiredConcepts: [objective, context, constraints], optionalConcepts: [examples, prior-state, evidence, desired-output]}
      preconditions: {scopeUnderstood: true, requiredInputsAvailableOrDeclaredMissing: true, authorityCheckedBeforeSideEffects: true}
      procedure:
        genericSteps: [frame-objective-and-success-criteria, gather-or-validate-required-inputs, apply-domain-method, test-assumptions-and-edge-cases, verify-against-success-criteria, return-result-with-evidence-and-limitations]
        domainSpecificManifestContentRequired: true
      evidence: {traceMaterialInputs: true, distinguishObservedFromDerived: true, refreshTimeSensitiveInputs: true}
      verification: {successCriteria: explicit, edgeCases: considered, contradictions: checked, resultReproducibleWhenApplicable: true}
      failureModes: {missingInput: identify-and-bound, inconsistentInput: surface-before-conclusion, insufficientEvidence: lower-confidence-or-escalate, unsafeSideEffect: stop, unavailableTool: degrade-gracefully-or-report}
      outputs: {include: [result, assumptions, evidence, limitations, verification]}
      sideEffects: {default: none, requireExplicitDeclaration: true, authorization: explicit}
      quality: {reusableAcrossProfiles: true, avoidHiddenState: true, deterministicWhenInputsAndMethodAreDeterministic: true}

    Plugin:
      capabilities: {defaultExposure: deny, explicitCapabilityDeclaration: true, unlistedOperations: deny}
      security: {credentials: runtime-only, leastPrivilege: true, secretLogging: deny, secretInArgumentsWhenAvoidable: deny, tenantOrUserIsolationWhenApplicable: true}
      network: {timeoutSeconds: 30, retries: bounded, backoff: exponential, validateTls: true}
      sideEffects: {reads: allow-when-declared, writes: explicit-policy-only, destructive: explicit-confirmation, financialOrLegalCommitment: explicit-user-order}
      failureHandling: {authenticationFailure: fail-closed, authorizationFailure: fail-closed, rateLimit: honor-and-backoff, partialFailure: return-structured-error}
      observability: {auditInvocations: true, recordOperationAndTarget: true, redactCredentials: true, recordExternalRequestIdWhenAvailable: true}
      provenancePolicy: {providerIdentityRequired: true, productionVersionPinWhenAvailable: true, thirdPartyDiscoveryIsNotTrust: true}

    MCP:
      capabilities: {defaultExposure: deny, explicitRootsOrTools: true, unlistedRootsOrTools: deny}
      security: {credentials: runtime-only, leastPrivilege: true, secretLogging: deny, processIsolation: required-where-supported, networkExposure: minimum-necessary}
      runtime: {startupTimeoutSeconds: 30, operationTimeoutSeconds: 60, retries: bounded, healthCheck: required-when-long-lived}
      sideEffects: {writes: explicit-policy-only, destructive: explicit-confirmation, safetySensitiveControl: explicit-confirmation}
      failureHandling: {unavailableServer: fail-clearly, malformedResponse: reject, authorizationFailure: fail-closed}
      observability: {auditToolCalls: true, recordServerAndTool: true, redactCredentials: true}
      provenancePolicy: {sourceRequired: true, officialOrReviewedSourcePreferred: true, versionPinWhenPractical: true}

    Channel:
      routing: {inboundProfile: hermes, outboundProfile: hermes, allowDirectProfileSelection: false, allowedUserFacingProfiles: [hermes]}
      admission: {defaultUnknownSender: deny, requireAuthenticationOrExplicitAllowlist: true, bindIdentityToConversation: true}
      sessions: {correlateInboundOutbound: true, boundedContext: true, crossUserContextLeakage: deny, expireInactiveSessions: true}
      limits: {maxMessageBytes: 1048576, rateLimit: required, attachmentPolicy: explicit, oversizedPayload: reject}
      replayProtection: {deduplicateMessageIdsWhenAvailable: true, rejectStaleSignedRequestsWhenApplicable: true}
      privacy: {rawCredentialRetention: false, redactLogs: true, attachmentsRetainedOnlyAsNeeded: true}
      failureHandling: {deliveryFailure: report-to-hermes, malformedInput: reject, targetMismatch: reject}
      observability: {recordChannel: true, recordConversationCorrelationId: true, recordDeliveryStatus: true, redactMessageSecrets: true}
      policy: {requireHermesGateway: true, rejectNonHermesProfileTarget: true}

    Cron:
      concurrency: {default: single-instance, overlap: deny-unless-explicit}
      idempotency: {required: true, deduplicationKey: schedule-slot-and-resource}
      timeouts: {executionSeconds: 900, externalCallSeconds: 30}
      retries: {attempts: 3, backoff: exponential, retryUnsafeSideEffects: false}
      misfire: {policy: run-once-if-still-relevant, catchUpLimit: 1}
      notifications: {userVisibleRoute: hermes, onFailure: true, onMaterialChange: true, noOpMayBeSilent: true}
      observability: {recordStartEnd: true, recordOutcome: true, recordMutations: true, recordRetryCount: true}
      policy: {authorityFromSchedule: deny, stateChangeRequiresDeclaredAuthority: true}

    Webhook:
      replayProtection: {requireTimestampOrProviderEventIdWhenAvailable: true, deduplicate: true, defaultToleranceSeconds: 300}
      deduplication: {required: true, keyPreference: [provider-event-id, signature-and-body-hash]}
      limits: {maxBodyBytes: 1048576, rateLimit: required, acceptedContentTypes: [application/json]}
      routing: {userVisibleRoute: hermes, directProfileSelection: deny}
      validation: {rejectMalformedPayload: true, schemaValidateWhenDefined: true, allowlistedEventTypesOnly: true}
      failureHandling: {authFailure: reject, replay: reject, processingFailure: return-safe-error-and-log, unsafeMutation: require-separate-authority}
      observability: {recordEventId: true, recordProvider: true, recordDisposition: true, redactPayloadSecrets: true}
      policy: {authorityFromWebhookReceipt: deny, externalSideEffects: explicitly-declared-only}

    Bundle:
      purpose: {compositionType: starting-roster, fixedRecruitmentCeiling: false}
      composition: {internalByDefault: true, preserveProfileBoundaries: true, duplicateProfileInstancesAllowed: true}
      recruitment: {dynamic: true, allowOutsideBundle: true, smallestCompetentTeamPreferred: true, scaleForIndependentWork: true}
      authority: {membershipExpandsAuthority: false, inheritedPermissions: per-resource-only, hostPolicyAuthoritative: true, sideEffects: no-new-authority}
      deliberation: {mode: adaptive, independentFirstPassForMaterialTradeoffs: true, evidenceOverMajorityVote: true, preserveMaterialDissent: true}
      lifecycle: {instantiateWhenNeeded: true, releaseIdleSpecialists: true, completionRequiresVerification: true, archiveMaterialDecisions: true}
      observability: {recordContributors: true, recordDelegations: true, recordMaterialDissent: true, recordPermissionsUsed: true}

  domainOverlays:
    - name: legal-regulatory
      match: {nameContains: [law, legal, gdpr, privacy, regulatory, estate-succession], tagsAny: [law, legal, regulation, compliance, privacy, gdpr]}
      apply:
        evidence: {authoritativeCurrentSourcesRequired: true, jurisdictionAndEffectiveDateRequired: true}
        safety: {legalRepresentation: deny, licensedLegalConclusion: qualify-and-escalate}
        output: {separateLawFromInterpretationAndPracticalOptions: true}

    - name: finance-investment
      match: {nameContains: [financial, finance, investment, portfolio, wealth, stocks, cryptocurrency, crypto, equity, fixed-income, asset-manager, insurance], tagsAny: [finance, investment, portfolio, wealth, banking, crypto, insurance]}
      apply:
        evidence: {currentMarketAndRegulatoryFactsRequired: true, assumptionsAndScenarioRiskRequired: true}
        safety: {recommendationDoesNotImplyExecutionAuthority: true, guaranteedReturns: deny, secretsOrSigningMaterialInContext: deny}
        output: {separateObservationAnalysisRecommendationExecution: true}

    - name: health-psychology-nutrition
      match: {nameContains: [psychology, nutrition, personal-trainer, child-development, sen, livestock-health], tagsAny: [health, psychology, nutrition, fitness, child-development, livestock-health]}
      apply:
        evidence: {evidenceQualityAndPopulationLimitsRequired: true}
        safety: {diagnosisFromChat: deny, prescriptionWithoutAuthorizedProfessional: deny, urgentRiskEscalation: true}
        output: {distinguishGeneralInformationFromProfessionalCare: true}

    - name: children-education
      match: {nameContains: [teacher, curriculum, homeschool, literacy, child-development, sen], tagsAny: [education, teaching, homeschooling, children, curriculum]}
      apply:
        safety: {safeguardingPriority: true, ageAndDevelopmentAppropriate: true, diagnosis: deny}
        output: {learningObjectiveAndVerificationRequired: true}

    - name: physical-engineering-property-farm
      match: {nameContains: [mechanical-engineer, electrical-engineer, robotics-engineer, building-architect, maintenance, roofing, plumbing, appliance, automotive, energy-solar, water-wastewater, arboriculture, machinery, farm, horticulture, pest-building, 3d-printer, 3d-model], tagsAny: [maintenance, home, property, farm, agriculture, automotive, solar, water, arboriculture, machinery, building, additive-manufacturing, physical-safety]}
      apply:
        safety: {lockoutAndIsolationWhenApplicable: true, regulatedTradeOrLicensedWork: identify-and-escalate, workAtHeightGasMainsElectricalPressureHazards: stop-or-professional, physicalExecutionAuthority: explicit}
        verification: {inspectBeforeAndAfterState: true, manufacturerOrStandardLimitsWhenApplicable: true}

    - name: catholic
      match: {nameContains: [catholic, theology, scripture, magisterial, liturgical], tagsAny: [catholic, theology, liturgy, tradition]}
      apply:
        evidence: {sourceHierarchy: [scripture, magisterium, universal-church-law, approved-liturgical-books, historical-primary-sources, reputable-scholarship]}
        output: {distinguish: [binding-doctrine, discipline, liturgical-law, theological-opinion, devotional-custom, prudential-judgment]}
        safety: {impersonateClergyOrEcclesiasticalAuthority: deny}

    - name: research-information-integrity
      match: {nameContains: [research, fact-check, source-verification, misinformation, history, analyst], tagsAny: [research, evidence, analysis, history, fact-checking, misinformation]}
      apply:
        evidence: {provenanceRequired: true, supportingAndDisconfirmingEvidence: true, publicationDateAndEventDateDistinguishedWhenRelevant: true}
        output: {confidenceAndUnresolvedQuestionsRequired: true}

    - name: software-data-infrastructure
      match: {nameContains: [developer, devops, network-engineer, site-reliability, database, ai-ml, privacy-security-engineer, data-engineer, data-scientist, systems-architect, infrastructure, homelab], tagsAny: [software, development, devops, network, sre, database, ai, data, infrastructure, homelab]}
      apply:
        execution: {changePlanBeforeWrite: true, testOrValidationRequired: true, rollbackPlanForMaterialProductionChanges: true, isolateConcurrentWriters: true}
        safety: {productionWriteAuthority: explicit, secretsInCodeOrLogs: deny}

    - name: translation
      match: {nameContains: [translator, translation], tagsAny: [translation]}
      apply:
        output: {preserveMeaningRegisterTerminologyAndFormatting: true, flagAmbiguityRatherThanInventing: true}
        safety: {claimSwornOrCertifiedStatusWithoutBasis: deny}
        privacy: {sourceDocumentConfidentiality: preserve}

    - name: ai-engineering
      match: {nameContains: [hermesagent-expert, ai-, llmops, prompt-engineer], tagsAny: [ai, llm, llmops, agents]}
      apply:
        evidence: {modelProviderAndVersionMaterialWhenRelevant: true, evaluationEvidenceRequiredForBehaviorClaims: true}
        safety: {promptTextDoesNotGrantAuthority: true, modelOutputIsUntrustedAcrossToolBoundaries: true, productionDeploymentAuthority: explicit, secretsInPromptOrModelContext: deny}
        verification: {regressionAndFailureCaseEvaluation: true, toolAndProviderFailureModes: required}
        output: {separateArchitectureProposalFromDeployedChange: true}

    - name: traditional-remedies
      match: {nameContains: [remedies, herbalism, materia-medica], tagsAny: [traditional-remedies, herbalism, ethnobotany, materia-medica]}
      apply:
        evidence: {separateTraditionalUseFromModernClinicalEvidence: true, substanceIdentityAndPreparationRequired: true, evidenceQualityAndUncertaintyRequired: true}
        safety: {naturalMeansSafeAssumption: deny, diagnosis: deny, individualizedPrescribing: deny, adviseDelayingUrgentOrEffectiveCare: deny, toxicityInteractionsAllergyScreening: required, pregnancyChildLiverKidneyRiskScreening: required-when-relevant}
        output: {separateHistoryEvidenceRiskAndUnknowns: true}

    - name: amish-cultural-context
      match: {nameContains: [amish], tagsAny: [amish]}
      apply:
        evidence: {affiliationRegionCommunityContextRequired: true, variationAcrossCommunitiesMustBePreserved: true}
        safety: {treatAmishAsUniform: deny, romanticizeHardshipOrRestrictedAccess: deny}
        output: {distinguishDocumentedPracticeFromModernAdaptation: true}

    - name: ancient-traditions-context
      match: {nameContains: [ancient-], tagsAny: [ancient-traditions]}
      apply:
        evidence: {civilizationPlacePeriodAndSourceRequired: true, distinguishAttestedInferredReconstructedSpeculative: true}
        safety: {universalAncientTraditionClaim: deny, historicalPracticeOverridesModernSafety: deny}
        output: {reconstructionAndUncertaintyMustBeLabeled: true}

    - name: pregnancy-postpartum-fitness
      match: {nameContains: [prenatal, postpartum], tagsAny: [pregnancy, postpartum, maternal-health]}
      apply:
        safety: {clinicianRestrictionsAreHardConstraints: true, obstetricOrPelvicFloorDiagnosis: deny, concerningSymptomsRequireStopAndReferral: true, individualizedReturnToTraining: true}
        evidence: {stageSymptomsAndRelevantRestrictionsRequired: true}
        output: {modificationsAndReferralTriggersExplicit: true}

    - name: specialized-fitness
      match: {nameContains: [fitness-coach, bodybuilding, calisthenics, powerlifting, strength-conditioning, mobility-flexibility, endurance-conditioning], tagsAny: [fitness, bodybuilding, powerlifting, calisthenics, conditioning]}
      apply:
        safety: {performanceEnhancingDrugOrHormoneAdvice: deny, dangerousDehydrationOrRapidCutAdvice: deny, painNeurologicCardiopulmonaryRedFlagsRequireReferral: true}
        verification: {progressionBasedOnObservedResponse: true, techniqueAndRecoveryReviewed: true}

    - name: ebook-kobo
      match: {nameContains: [ebook, kobo], tagsAny: [ebook, kobo, publishing]}
      apply:
        evidence: {sourceAndRightsProvenanceRequired: true}
        safety: {drmCircumvention: deny, externalDelivery: explicit-user-order, overwriteExistingContent: confirm, koboCredentialScraping: deny}
        privacy: {notebookExportsPrivateByDefault: true, readingNotesDataMinimized: true}
        verification: {validateEpubBeforeDelivery: true, verifyTransferResult: true, preserveSourceArtifact: true}
        output: {distinguishBuiltArtifactFromDeliveredArtifact: true}
