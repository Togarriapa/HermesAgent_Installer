<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=320,height=180">
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 320px; height: 180px; overflow: hidden; background: #000; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="root" data-width="320" data-height="180" data-duration="2">
      <div id="scene-red" class="scene clip" data-start="0" data-duration="1" style="background:#e02020"></div>
      <div id="scene-blue" class="scene clip" data-start="1" data-duration="1" style="background:#2040e0"></div>
    </main>
  </body>
</html>
