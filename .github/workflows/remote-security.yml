name: Remote security fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  remote-security-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/hermes_installer/remote/requirements-ci-x86-py313.lock
      - name: Install hash-pinned JWT and cryptography primitives
        run: |
          python -m pip install --no-deps --require-hashes -r src/hermes_installer/remote/requirements-ci-x86-py313-core.lock
      - name: Install exact-version HTTP and WebSocket fixture stack
        run: |
          python -m pip install --no-deps --only-binary=:all: -r src/hermes_installer/remote/requirements-ci-x86-py313.lock
      - name: Fetch pinned Xpra source for its real option parser
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/Xpra-org/xpra.git "$RUNNER_TEMP/xpra"
          git -C "$RUNNER_TEMP/xpra" checkout --quiet --detach 521b0d2e762c770b2641d258b93d23575fa9cbea
          git -C "$RUNNER_TEMP/xpra" rev-parse HEAD
          echo "XPRA_SOURCE_ROOT=$RUNNER_TEMP/xpra" >> "$GITHUB_ENV"
      - name: Execute all remote HTTP, WebSocket, JWT, and IPC fixture contracts
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests/contracts -p "test_remote_*.py" -v
      - name: Exercise Unix peer credentials across distinct unprivileged UIDs
        run: |
          sudo -E env PYTHONPATH=src "$pythonLocation/bin/python" -m unittest discover -s tests/contracts -p "test_remote_verifier_uid_harness.py" -v
