name: Host custody kernel integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  managed-process-kernel-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - id: install-ci-deps
        name: Install hash-pinned host authority primitives
        run: python -m pip install --no-deps --require-hashes -r src/hermes_installer/remote/requirements-ci-x86-py313-core.lock
      - id: prepare-interpreter
        name: Prepare immutable root-owned CI interpreter
        run: |
          sudo install -d -o root -g root -m 0755 /run/hermes-custody-python
          sudo install -o root -g root -m 0755 "$(command -v python)" /run/hermes-custody-python/python
      - name: Exercise root process custody
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_managed_process_custody_linux -v

      - name: Exercise selected display credential mount custody
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/tests/contracts:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest discover -s "${GITHUB_WORKSPACE}/tests/contracts" -p 'test_xauthority_mount_kernel_linux.py' -v

      - name: Exercise root task custody
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_managed_task_custody_linux -v

      - name: Exercise root managed build custody
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_managed_build_custody_linux -v

      - name: Exercise build output attestation
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/tests/contracts:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_build_execution_linux -v

      - name: Exercise fixed CPython output probe
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/tests/contracts:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_build_probe_linux -v

      - name: Exercise fixed service connector custody
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_service_connector -v

      - name: Exercise Linux package installation custody
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo env PYTHONPATH="${GITHUB_WORKSPACE}/src:${site_packages}" PYTHONDONTWRITEBYTECODE=1 /run/hermes-custody-python/python -m unittest tests.contracts.test_package_set_install_linux -v

      - name: Exercise root controller cleanup
        if: ${{ always() && steps.install-ci-deps.outcome == 'success' && steps.prepare-interpreter.outcome == 'success' }}
        run: |
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo /usr/bin/systemd-run --system --quiet --wait --pipe --collect --property=Type=exec --unit="hermes-root-controller-custody-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --setenv="PYTHONPATH=${GITHUB_WORKSPACE}/src" --setenv="HERMES_ROOT_CONTROLLER_TEST_UNIT=hermes-root-controller-custody-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service" /run/hermes-custody-python/python -m unittest discover -s "${GITHUB_WORKSPACE}/tests/contracts" -p 'test_root_controller_custody_linux.py' -v
