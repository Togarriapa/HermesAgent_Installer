name: Host custody kernel integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  managed-process-kernel-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install hash-pinned host authority primitives
        run: python -m pip install --no-deps --require-hashes -r src/hermes_installer/remote/requirements-ci-x86-py313-core.lock
      - name: Exercise root authority and kernel custody against disposable identities
        run: sudo env PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m unittest tests.contracts.test_managed_process_custody_linux -v
