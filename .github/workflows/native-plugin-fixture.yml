name: Pinned Hermes native plugin fixture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-plugin-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install hash-pinned fixture dependencies
        run: >-
          python -m pip install --no-deps --require-hashes
          -r requirements-runtime.txt
          -r requirements-test.txt
          -r requirements-native-plugin-fixture.lock
      - name: Fetch the exact official Hermes source revision
        run: |
          git init /tmp/hermes-agent-hi08
          git -C /tmp/hermes-agent-hi08 remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-agent-hi08 fetch --depth 1 origin 7085fbf7753266fc4943c55ac04926186bc90005
          git -C /tmp/hermes-agent-hi08 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hermes-agent-hi08 rev-parse HEAD)" = 7085fbf7753266fc4943c55ac04926186bc90005
      - name: Compile installer modules
        run: python -m compileall -q src
      - name: Exercise selected plugin discovery and native invocation fixtures
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/native/test_all_native_plugin_manager.py
          tests/native/test_pinned_hermes_plugin_manager.py
          tests/native/test_native_invocations.py
          tests/contracts/test_plugin_effects.py
