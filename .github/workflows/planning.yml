name: Current scope and authorized Pi checks
# Manual only: no off-Pi tests or automatic target enrollment.
# This runner label must be explicitly enrolled by the owner; no hosted fallback.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:

  runtime-contracts:
    runs-on: [self-hosted, Linux, ARM64, hermes-authorized-pi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install hash-pinned runtime YAML dependency
        run: python -m pip install --require-hashes -r requirements-runtime.txt
      - name: Install hash-pinned contract test tools
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Install hash-pinned JWT and cryptography test primitives
        run: python -m pip install --no-deps --require-hashes -r src/hermes_installer/remote/requirements-arm64-py314.lock
      - name: Compile installer modules
        run: python -m compileall -q src
      - name: Run runtime contract and failure tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/contracts
      - name: Run authorized-target acceptance workflow fixtures
        if: always()
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/acceptance -v

  planning:
    runs-on: [self-hosted, Linux, ARM64, hermes-authorized-pi]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: npm ci
      - run: npm run validate:specs
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: npm run validate:plan
      - run: npm run test:planning
