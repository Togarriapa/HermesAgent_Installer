name: Planning integrity and OpenSpec
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  remote-security-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/hermes_installer/remote/requirements-ci-x86-py313.lock
      - name: Install hash-pinned JWT and cryptography primitives
        run: python -m pip install --no-deps --require-hashes -r src/hermes_installer/remote/requirements-ci-x86-py313-core.lock
      - name: Install exact-version HTTP and WebSocket fixture stack
        run: python -m pip install --no-deps --only-binary=:all: -r src/hermes_installer/remote/requirements-ci-x86-py313.lock
      - name: Execute all remote HTTP, WebSocket, JWT, and IPC fixture contracts
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/contracts -p "test_remote_*.py" -v
      - name: Exercise Unix peer credentials across distinct unprivileged UIDs
        run: sudo -E env PYTHONPATH=src python -m unittest discover -s tests/contracts -p "test_remote_verifier_uid_harness.py" -v

  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compile installer modules
        run: python -m compileall -q src
      - name: Run runtime contract and failure tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/contracts -v

  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: npm ci
      - run: npm run validate:specs
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: npm run validate:plan
      - name: Compare immutable full tree against baseline tag
        run: python3 scripts/check_plan.py --tag hermes-installer-plan-2026-10-09-v1
      - run: npm run test:planning
