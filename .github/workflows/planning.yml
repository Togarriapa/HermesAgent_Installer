name: Planning integrity and OpenSpec
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:

  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install hash-pinned runtime YAML dependency
        run: python -m pip install --require-hashes -r requirements-runtime.txt
      - name: Install hash-pinned contract test tools
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Compile installer modules
        run: python -m compileall -q src
      - name: Run runtime contract and failure tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/contracts
      - name: Run authorized-target acceptance workflow fixtures
        if: always()
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/acceptance -v

  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: npm ci
      - run: npm run validate:specs
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: npm run validate:plan
      - name: Compare immutable full tree against baseline tag
        run: python3 scripts/check_plan.py --tag hermes-installer-plan-2026-10-09-v1
      - run: npm run test:planning
