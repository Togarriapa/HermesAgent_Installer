[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-installer"
version = "0.1.0"
description = "Recoverable installer and verification tooling for Hermes on Raspberry Pi"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-installer = "hermes_installer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
