[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-installer"
version = "0.1.0"
description = "Recoverable installer and verification tooling for Hermes on Raspberry Pi"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
hermes-installer = "hermes_installer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_installer = ["registry/bundle_data/*.json", "registry/bundle_data/*.tar.gz", "components/runtime_locks/browser-use/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
